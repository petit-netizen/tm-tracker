<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>TM 간편 기록 (모바일)</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
/* ── CSS 변수 (index.html과 동일) ── */
:root{
  --bg1:#ffffff;--bg2:#f5f5f4;--bg3:#f0ede8;--bgi:#e6f1fb;--bgs:#eaf3de;--bgw:#faeeda;--bgd:#fcebeb;
  --t1:#1a1a18;--t2:#6b6b67;--t3:#9c9c97;--ti:#185fa5;--ts:#3b6d11;--tw:#854f0b;--td:#a32d2d;
  --b1:rgba(0,0,0,.4);--b2:rgba(0,0,0,.3);--b3:rgba(0,0,0,.15);--bi:#378add;
  --r1:8px;--r2:12px;--font:-apple-system,BlinkMacSystemFont,'Segoe UI','Apple SD Gothic Neo','Noto Sans KR',sans-serif
}
@media(prefers-color-scheme:dark){:root{
  --bg1:#1e1e1c;--bg2:#2a2a28;--bg3:#242422;--bgi:#0c2540;--bgs:#162808;--bgw:#2a1800;--bgd:#280f0f;
  --t1:#f0ede8;--t2:#a8a8a3;--t3:#6b6b67;--ti:#85b7eb;--ts:#97c459;--tw:#ef9f27;--td:#f09595;
  --b1:rgba(255,255,255,.4);--b2:rgba(255,255,255,.3);--b3:rgba(255,255,255,.15)
}}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:var(--font);background:var(--bg3);color:var(--t1);min-height:100vh;padding-bottom:80px}

/* ── 헤더 ── */
.hd{
  background:var(--bg1);padding:14px 16px;
  border-bottom:0.5px solid var(--b3);
  display:flex;justify-content:space-between;align-items:center;
  position:sticky;top:0;z-index:100;
}
.hd-title{font-size:16px;font-weight:500;color:var(--t1)}
.hd-sub{font-size:11px;color:var(--t2);margin-top:1px}
.pc-link{
  font-size:12px;color:var(--ti);text-decoration:none;
  border:0.5px solid var(--bi);padding:5px 10px;
  border-radius:var(--r1);white-space:nowrap
}

/* ── 날짜/이름 바 ── */
.top-bar{background:var(--bgi);padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.date-area{display:flex;align-items:center;gap:6px}
.date-txt{font-size:13px;color:var(--ti);font-weight:500}
.arr-btn{background:transparent;border:0.5px solid var(--bi);color:var(--ti);width:26px;height:26px;border-radius:var(--r1);font-size:15px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.name-area{display:flex;align-items:center;gap:6px}
.name-area label{font-size:12px;color:var(--ti);white-space:nowrap}
.name-select{
  font-size:16px;padding:5px 8px;
  border:0.5px solid var(--bi);border-radius:var(--r1);
  background:var(--bg1);color:var(--t1);
  outline:none;-webkit-appearance:none;max-width:130px
}

/* ── 오늘 기록 수 표시 ── */
.cnt-bar{
  padding:8px 16px;background:var(--bg2);
  display:flex;align-items:center;justify-content:space-between;
  border-bottom:0.5px solid var(--b3)
}
.cnt-txt{font-size:12px;color:var(--t2)}
.cnt-num{font-size:13px;font-weight:600;color:var(--ti)}

/* ── 카드 ── */
.card{
  background:var(--bg1);border:0.5px solid var(--b3);
  border-radius:var(--r2);margin:12px 12px 0;padding:14px
}
.card-title{
  font-size:11px;font-weight:500;color:var(--t2);
  text-transform:uppercase;letter-spacing:.4px;
  margin-bottom:12px;padding-bottom:8px;
  border-bottom:0.5px solid var(--b3)
}

/* ── 폼 요소 ── */
.field{margin-bottom:11px}
.field:last-child{margin-bottom:0}
.field label{font-size:12px;color:var(--t2);display:block;margin-bottom:4px;font-weight:500}
.req{color:var(--td);margin-left:2px}
/* 16px 이상으로 iOS 자동확대 방지 */
.field input,.field select,.field textarea{
  width:100%;font-size:16px;padding:11px 12px;
  border:0.5px solid var(--b2);border-radius:var(--r1);
  background:var(--bg2);color:var(--t1);outline:none;
  -webkit-appearance:none;font-family:var(--font);
  transition:border-color .15s
}
.field input:focus,.field select:focus,.field textarea:focus{
  border-color:var(--bi);background:var(--bg1)
}
.field textarea{height:88px;resize:none;line-height:1.5}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}

/* ── 저장 버튼 ── */
.save-btn{
  display:block;width:calc(100% - 24px);margin:12px 12px 0;
  background:var(--ti);color:#fff;border:none;
  padding:15px;font-size:16px;font-weight:600;
  border-radius:var(--r2);cursor:pointer;
  font-family:var(--font);letter-spacing:.2px;
  box-shadow:0 4px 12px rgba(24,95,165,.2);
  transition:opacity .15s
}
.save-btn:active{opacity:.85}
.save-btn:disabled{background:var(--t3);box-shadow:none;cursor:not-allowed}

/* ── TM 기록 목록 ── */
.logs-wrap{padding:14px 12px 0}
.logs-title{
  font-size:12px;font-weight:500;color:var(--t2);
  margin-bottom:8px;padding-bottom:6px;
  border-bottom:0.5px solid var(--b3)
}
.lc{
  background:var(--bg1);border:0.5px solid var(--b3);
  border-radius:var(--r1);padding:11px 13px;margin-bottom:8px;
  border-left:3px solid var(--b3)
}
.lc.종결{border-left-color:#5F5E5A}
.lc.추가상담{border-left-color:var(--ti)}
.lh{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px;gap:8px}
.lco{font-size:13px;font-weight:500;color:var(--t1)}
.lb{display:flex;gap:4px;flex-shrink:0;flex-wrap:wrap;align-items:center}
.pill{font-size:10px;padding:2px 8px;border-radius:99px;display:inline-block;white-space:nowrap}
.pill.응답{background:var(--bgs);color:var(--ts)}
.pill.부재{background:var(--bgw);color:var(--tw)}
.pill.거절{background:var(--bgd);color:var(--td)}
.pill.콜백요청{background:var(--bgi);color:var(--ti)}
.pill.종결{background:var(--bg2);color:var(--t2)}
.pill.추가상담{background:var(--bgi);color:var(--ti)}
.lmg{display:grid;grid-template-columns:1fr 1fr;gap:3px 10px;margin-bottom:5px}
.lmi{font-size:11px;color:var(--t2)}
.lmi strong{color:var(--t1);font-weight:500}
.lcons{font-size:12px;color:var(--t1);background:var(--bg2);border-radius:var(--r1);padding:7px 9px;margin-bottom:4px;line-height:1.5;white-space:pre-wrap}
.lap{font-size:11px;color:var(--ti)}
.del-btn{background:none;border:none;color:var(--t3);font-size:14px;cursor:pointer;padding:1px 3px;line-height:1}
.del-btn:active{color:var(--td)}
.empty-log{text-align:center;padding:20px;font-size:13px;color:var(--t2)}

/* ── 토스트 ── */
.toast{
  position:fixed;bottom:24px;left:50%;
  transform:translateX(-50%) translateY(60px);
  background:#1D9E75;color:#fff;
  padding:12px 24px;border-radius:99px;
  font-size:14px;font-weight:600;
  opacity:0;pointer-events:none;
  transition:all .25s;z-index:999;
  white-space:nowrap;
  box-shadow:0 4px 16px rgba(0,0,0,.15)
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.err{background:var(--td)}
</style>
</head>
<body>

<!-- 헤더 -->
<div class="hd">
  <div>
    <div class="hd-title">📱 TM 간편 기록</div>
    <div class="hd-sub" id="hd-sub">이름을 선택하세요</div>
  </div>
  <a href="index.html" class="pc-link">PC 대시보드 →</a>
</div>

<!-- 날짜 + 이름 선택 바 -->
<div class="top-bar">
  <div class="date-area">
    <button class="arr-btn" onclick="chgDate(-1)">‹</button>
    <span class="date-txt" id="date-display">로딩 중...</span>
    <button class="arr-btn" onclick="chgDate(1)">›</button>
  </div>
  <div class="name-area">
    <label>내 이름</label>
    <select class="name-select" id="m-ma" onchange="onNameChange()">
      <option value="">선택</option>
      <optgroup label="동부팀">
        <option>백현석</option><option>심재천</option><option>이동성</option><option>정승상</option>
        <option>박재환</option><option>손혜령</option><option>권성은</option><option>김다진</option>
      </optgroup>
      <optgroup label="서부팀">
        <option>임현묵</option><option>최용</option><option>조인호</option><option>박민국</option>
        <option>강탄</option><option>우수민</option><option>조용준</option><option>장길평</option><option>박찬혜</option>
      </optgroup>
    </select>
  </div>
</div>

<!-- 오늘 기록 수 -->
<div class="cnt-bar">
  <span class="cnt-txt" id="cnt-txt">이름을 선택하면 오늘 기록이 표시됩니다</span>
  <span class="cnt-num" id="cnt-num"></span>
</div>

<!-- 입력 폼 -->
<div class="card">
  <div class="card-title">고객사 정보</div>
  <div class="field">
    <label>고객사명 <span class="req">*</span></label>
    <datalist id="m-company-list"></datalist>
    <input type="text" id="m-co" list="m-company-list" placeholder="DB에서 선택 또는 입력" autocomplete="off" oninput="syncMobileBranchInfo()">
    <span id="m-branches-badge" style="display:none;font-size:12px;padding:4px 10px;border-radius:99px;margin-top:6px;font-weight:500"></span>
  </div>
  <div class="row2">
    <div class="field">
      <label>현거래업체</label>
      <input type="text" id="m-cp" placeholder="KG이니시스">
    </div>
    <div class="field">
      <label>수수료율</label>
      <input type="text" id="m-fr" placeholder="1.8%">
    </div>
  </div>
  <div class="field" style="margin-bottom:0">
    <label>대표자 연락처</label>
    <input type="tel" id="m-ct" placeholder="010-0000-0000">
  </div>
</div>

<div class="card">
  <div class="card-title">상담 내용</div>
  <div class="field">
    <label>통화 결과 <span class="req">*</span></label>
    <select id="m-rs">
      <option value="">선택하세요</option>
      <option>응답</option><option>부재</option><option>거절</option><option>콜백요청</option>
    </select>
  </div>
  <div class="field">
    <label>상담 내역 <span class="req">*</span></label>
    <textarea id="m-cd" placeholder="통화 내용을 간단히 기록해주세요..."></textarea>
  </div>
  <div class="field">
    <label>상담 결과 <span class="req">*</span></label>
    <select id="m-cr">
      <option value="">선택하세요</option>
      <option value="종결">종결</option>
      <option value="추가상담">추가 상담진행</option>
    </select>
  </div>
  <div class="field" style="margin-bottom:0">
    <label>액션 플랜</label>
    <input type="text" id="m-ac" placeholder="다음주 재연락, 제안서 발송 등">
  </div>
</div>

<!-- 저장 버튼 -->
<button class="save-btn" id="btn-submit" onclick="submitLog()">저장하기</button>

<!-- 오늘 기록 목록 -->
<div class="logs-wrap">
  <div id="logs-title" class="logs-title" style="display:none">📋 오늘 내 TM 기록</div>
  <div id="logs-list"></div>
</div>

<div id="toast" class="toast"></div>

<script>
// ════════════════════════════════════════════
// ★ index.html과 동일하게 맞추세요 ★
const SUPABASE_URL = 'https://zndbcmzquoaavsfojhhz.supabase.co'
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpuZGJjbXpxdW9hYXZzZm9qaGh6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAzNTE5MzYsImV4cCI6MjA5NTkyNzkzNn0.5lI7H6QR5e-fJGBgQQu4Zwk4G_l3EZ4Dc8wM1cvokGs'
// ════════════════════════════════════════════

const EAST = ['백현석','심재천','이동성','정승상','박재환','손혜령','권성은','김다진']
const WEST = ['임현묵','최용','조인호','박민국','강탄','우수민','조용준','장길평','박찬혜']

let sb = null
let CUR_DATE = td()
let myLogs = []
let DB_LIST = []  // 거래처 DB (가맹점수 표시용)

// index.html의 td()와 동일한 방식
function td(){ return new Date().toISOString().slice(0,10) }

function fmtD(ds){
  const dt = new Date(ds + 'T00:00:00')
  const days = ['일','월','화','수','목','금','토']
  return (dt.getMonth()+1) + '월 ' + dt.getDate() + '일 (' + days[dt.getDay()] + ')'
}

function updateDateDisplay(){
  document.getElementById('date-display').textContent = fmtD(CUR_DATE)
}

function chgDate(dir){
  const d = new Date(CUR_DATE + 'T00:00:00')
  d.setDate(d.getDate() + dir)
  CUR_DATE = d.toISOString().slice(0,10)
  updateDateDisplay()
  loadMyLogs()
}

function onNameChange(){
  const name = document.getElementById('m-ma').value
  if(name) localStorage.setItem('my_ma_name', name)
  updateHeader()
  loadMyLogs()
}

function updateHeader(){
  const name = document.getElementById('m-ma').value
  const sub = document.getElementById('hd-sub')
  if(!name){
    sub.textContent = '이름을 선택하세요'
    document.getElementById('cnt-txt').textContent = '이름을 선택하면 오늘 기록이 표시됩니다'
    document.getElementById('cnt-num').textContent = ''
    return
  }
  const team = EAST.includes(name) ? '동부팀' : '서부팀'
  sub.textContent = name + ' · ' + team
}

async function loadMyLogs(){
  const ma = document.getElementById('m-ma').value
  if(!ma){ myLogs=[]; renderLogs(); return }
  try{
    const { data } = await sb.from('tm_logs')
      .select('*')
      .eq('ma_name', ma)
      .eq('log_date', CUR_DATE)
      .order('created_at', {ascending:false})
    myLogs = data || []
    renderLogs()
    updateCnt()
  }catch(e){ showToast('로드 실패: '+e.message, true) }
}

function updateCnt(){
  const ma = document.getElementById('m-ma').value
  if(!ma) return
  const cnt = myLogs.length
  document.getElementById('cnt-txt').textContent = fmtD(CUR_DATE) + ' · 기록 ' + cnt + '건'
  document.getElementById('cnt-num').textContent = cnt > 0 ? cnt+'건' : ''
}

function renderLogs(){
  const list = document.getElementById('logs-list')
  const title = document.getElementById('logs-title')
  if(!myLogs.length){
    title.style.display = 'none'
    list.innerHTML = '<div class="empty-log">아직 기록이 없습니다</div>'
    const ma = document.getElementById('m-ma').value
    if(!ma) list.innerHTML = ''
    return
  }
  title.style.display = 'block'
  list.innerHTML = myLogs.map(function(l){
    const crCls = l.consult_result === '종결' ? '종결' : '추가상담'
    const callPill = l.call_result ? '<span class="pill '+l.call_result+'">'+l.call_result+'</span>' : ''
    const crPill = l.consult_result
      ? '<span class="pill '+crCls+'">'+(l.consult_result==='추가상담'?'추가상담':l.consult_result)+'</span>' : ''
    const detailDiv = l.consult_detail ? '<div class="lcons">'+l.consult_detail+'</div>' : ''
    const apDiv = l.action_plan ? '<div class="lap">→ '+l.action_plan+'</div>' : ''
    return '<div class="lc '+crCls+'">'
      + '<div class="lh"><span class="lco">'+(l.company||'—')+'</span>'
      + '<div class="lb">'+callPill+' '+crPill
      + '<button class="del-btn" onclick="delLog(\''+l.id+'\')">✕</button>'
      + '</div></div>'
      + '<div class="lmg">'
      + '<div class="lmi">거래업체 <strong>'+(l.current_partner||'—')+'</strong></div>'
      + '<div class="lmi">수수료율 <strong>'+(l.fee_rate||'—')+'</strong></div>'
      + '<div class="lmi">연락처 <strong>'+(l.ceo_contact||'—')+'</strong></div>'
      + '</div>'
      + detailDiv + apDiv + '</div>'
  }).join('')
}

async function delLog(id){
  if(!confirm('이 TM 기록을 삭제하시겠습니까?')) return
  try{
    await sb.from('tm_logs').delete().eq('id', id)
    myLogs = myLogs.filter(function(l){ return l.id !== id })
    renderLogs()
    updateCnt()
    showToast('삭제되었습니다')
  }catch(e){ showToast('삭제 실패: '+e.message, true) }
}

async function submitLog(){
  const ma = document.getElementById('m-ma').value
  const co = document.getElementById('m-co').value.trim()
  const rs = document.getElementById('m-rs').value
  const cd = document.getElementById('m-cd').value.trim()
  const cr = document.getElementById('m-cr').value

  if(!ma){ showToast('이름을 선택해주세요', true); return }
  if(!co){ showToast('고객사명을 입력해주세요', true); return }
  if(!rs){ showToast('통화결과를 선택해주세요', true); return }
  if(!cd){ showToast('상담내역을 입력해주세요', true); return }
  if(!cr){ showToast('상담결과를 선택해주세요', true); return }

  const btn = document.getElementById('btn-submit')
  btn.disabled = true
  btn.textContent = '저장 중...'

  const rec = {
    log_date: CUR_DATE,         // index.html td()와 동일 방식
    ma_name: ma,
    team: EAST.includes(ma) ? 'east' : 'west',
    company: co,
    current_partner: document.getElementById('m-cp').value.trim(),
    fee_rate: document.getElementById('m-fr').value.trim(),
    ceo_contact: document.getElementById('m-ct').value.trim(),
    call_result: rs,
    consult_detail: cd,
    consult_result: cr,
    action_plan: document.getElementById('m-ac').value.trim()
  }

  try{
    const { data, error } = await sb.from('tm_logs').insert(rec).select().single()
    if(error) throw error
    myLogs.unshift(data)
    renderLogs()
    updateCnt()
    // 이름 유지, 나머지 초기화
    ;['m-co','m-cp','m-fr','m-ct','m-ac','m-cd'].forEach(function(id){
      document.getElementById(id).value = ''
    })
    document.getElementById('m-rs').value = ''
    document.getElementById('m-cr').value = ''
    window.scrollTo({top:0, behavior:'smooth'})
    showToast('✓ 저장되었습니다!')
  }catch(e){
    showToast('저장 실패: '+e.message, true)
  }

  btn.disabled = false
  btn.textContent = '저장하기'
}

async function loadDB(){
  try{
    const { data } = await sb.from('company_db')
      .select('name,branches,phase,is_target')
      .order('branches', {ascending:false})
    DB_LIST = (data||[]).filter(function(r){ return r.is_target!==false })
    buildCompanyDatalist()
  }catch(e){ console.warn('DB 로드 실패:', e.message) }
}

function buildCompanyDatalist(){
  const dl = document.getElementById('m-company-list')
  if(!dl) return
  dl.innerHTML = DB_LIST.map(function(r){
    return '<option value="'+r.name.replace(/"/g,'&quot;')+'">'+r.name+' ('+r.branches+'개점)'
  }).join('')
}

function syncMobileBranchInfo(){
  const val = (document.getElementById('m-co')||{}).value
  if(val) val.trim ? val.trim() : val; else return
  const co = document.getElementById('m-co')?.value.trim()
  const badge = document.getElementById('m-branches-badge')
  if(!badge) return
  if(!co){ badge.style.display='none'; return }
  const db = DB_LIST.find(function(r){ return r.name===co })
  if(db){
    const ph = db.phase===2 ? '2차' : ((db.branches||0)>=5 ? '1차' : '2차')
    badge.textContent = '🏢 '+db.branches+'개점 · '+ph
    badge.style.display = 'block'
    badge.style.background = ph==='2차' ? 'var(--bgw)' : 'var(--bgi)'
    badge.style.color = ph==='2차' ? 'var(--tw)' : 'var(--ti)'
  } else {
    badge.style.display = 'none'
  }
}

function showToast(msg, isErr){
  const t = document.getElementById('toast')
  t.textContent = msg
  t.className = 'toast' + (isErr ? ' err' : '')
  t.classList.add('show')
  setTimeout(function(){ t.classList.remove('show') }, 2500)
}

// 초기화
window.addEventListener('DOMContentLoaded', function(){
  function initSb(){
    if(typeof supabase !== 'undefined'){
      const { createClient } = supabase
      sb = createClient(SUPABASE_URL, SUPABASE_KEY)
      // DB 거래처 목록 로드 (가맹점수 표시용)
      loadDB()
      // 저장된 이름 복원
      const saved = localStorage.getItem('my_ma_name')
      if(saved){
        document.getElementById('m-ma').value = saved
        updateHeader()
        loadMyLogs()
      }
      updateDateDisplay()
    } else {
      setTimeout(initSb, 50)
    }
  }
  initSb()
})
</script>
