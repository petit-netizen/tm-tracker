/* ── CSS 변수 (index.html과 동일) ── */
:root{

  --r1:8px;--r2:12px;--font:-apple-system,BlinkMacSystemFont,'Segoe UI','Apple SD Gothic Neo','Noto Sans KR',sans-serif
}
@media(prefers-color-scheme:dark){:root{
  --bg1:#1e1e1c;--bg2:#2a2a28;--bg3:#242422;--bgi:#0c2540;--bgs:#162808;--bgw:#2a1800;--bgd:#280f0f;
  --t1:#f0ede8;--t2:#a8a8a3;--t3:#6b6b67;--ti:#85b7eb;--ts:#97c459;--tw:#ef9f27;--td:#f09595;
  --b1:rgba(255,255,255,.4);--b2:rgba(255,255,255,.3);--b3:rgba(255,255,255,.15)
}}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:var(--font);background:var(--bg3);color:var(--t1);min-height:100vh;padding-bottom:80px}

/* ── 헤더 ── */
.hd{
  background:var(--bg1);padding:14px 16px;
  border-bottom:0.5px solid var(--b3);
  display:flex;justify-content:space-between;align-items:center;
  position:sticky;top:0;z-index:100;
}
.hd-title{font-size:16px;font-weight:500;color:var(--t1)}
.hd-sub{font-size:11px;color:var(--t2);margin-top:1px}
.pc-link{
  font-size:12px;color:var(--ti);text-decoration:none;
  border:0.5px solid var(--bi);padding:5px 10px;
  border-radius:var(--r1);white-space:nowrap
}

/* ── 날짜/이름 바 ── */
.top-bar{background:var(--bgi);padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.date-area{display:flex;align-items:center;gap:6px}
.date-txt{font-size:13px;color:var(--ti);font-weight:500}
.arr-btn{background:transparent;border:0.5px solid var(--bi);color:var(--ti);width:26px;height:26px;border-radius:var(--r1);font-size:15px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.name-area{display:flex;align-items:center;gap:6px}
.name-area label{font-size:12px;color:var(--ti);white-space:nowrap}
.name-select{
  font-size:16px;padding:5px 8px;
  border:0.5px solid var(--bi);border-radius:var(--r1);
  background:var(--bg1);color:var(--t1);
  outline:none;-webkit-appearance:none;max-width:130px
}

/* ── 오늘 기록 수 표시 ── */
.cnt-bar{
  padding:8px 16px;background:var(--bg2);
  display:flex;align-items:center;justify-content:space-between;
  border-bottom:0.5px solid var(--b3)
}
.cnt-txt{font-size:12px;color:var(--t2)}
.cnt-num{font-size:13px;font-weight:600;color:var(--ti)}

/* ── 카드 ── */
.card{
  background:var(--bg1);border:0.5px solid var(--b3);
  border-radius:var(--r2);margin:12px 12px 0;padding:14px
}
.card-title{
  font-size:11px;font-weight:500;color:var(--t2);
  text-transform:uppercase;letter-spacing:.4px;
  margin-bottom:12px;padding-bottom:8px;
  border-bottom:0.5px solid var(--b3)
}

/* ── 폼 요소 ── */
.field{margin-bottom:11px}
.field:last-child{margin-bottom:0}
.field label{font-size:12px;color:var(--t2);display:block;margin-bottom:4px;font-weight:500}
.req{color:var(--td);margin-left:2px}
/* 16px 이상으로 iOS 자동확대 방지 */
.field input,.field select,.field textarea{
  width:100%;font-size:16px;padding:11px 12px;
  border:0.5px solid var(--b2);border-radius:var(--r1);
  background:var(--bg2);color:var(--t1);outline:none;
  -webkit-appearance:none;font-family:var(--font);
  transition:border-color .15s
}
.field input:focus,.field select:focus,.field textarea:focus{
  border-color:var(--bi);background:var(--bg1)
}
.field textarea{height:88px;resize:none;line-height:1.5}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}

/* ── 저장 버튼 ── */
.save-btn{
  display:block;width:calc(100% - 24px);margin:12px 12px 0;
  background:var(--ti);color:#fff;border:none;
  padding:15px;font-size:16px;font-weight:600;
  border-radius:var(--r2);cursor:pointer;
  font-family:var(--font);letter-spacing:.2px;
  box-shadow:0 4px 12px rgba(24,95,165,.2);
  transition:opacity .15s
}
.save-btn:active{opacity:.85}
.save-btn:disabled{background:var(--t3);box-shadow:none;cursor:not-allowed}

/* ── TM 기록 목록 ── */

.lc{

.lco{font-size:13px;font-weight:500;color:var(--t1)}
.lb{display:flex;gap:4px;flex-shrink:0;flex-wrap:wrap;align-items:center}
.pill{font-size:10px;padding:2px 8px;border-radius:99px;display:inline-block;white-space:nowrap}
.pill.응답{background:var(--bgs);color:var(--ts)}
.pill.부재{background:var(--bgw);color:var(--tw)}
.pill.거절{background:var(--bgd);color:var(--td)}
.pill.콜백요청{background:var(--bgi);color:var(--ti)}
.pill.종결{background:var(--bg2);color:var(--t2)}
.pill.추가상담{background:var(--bgi);color:var(--ti)}
.lmg{display:grid;grid-template-columns:1fr 1fr;gap:3px 10px;margin-bottom:5px}
.lmi{font-size:11px;color:var(--t2)}
.lmi strong{color:var(--t1);font-weight:500}
.lcons{font-size:12px;color:var(--t1);background:var(--bg2);border-radius:var(--r1);padding:7px 9px;margin-bottom:4px;line-height:1.5;white-space:pre-wrap}
.lap{font-size:11px;color:var(--ti)}
.del-btn{background:none;border:none;color:var(--t3);font-size:14px;cursor:pointer;padding:1px 3px;line-height:1}
.del-btn:active{color:var(--td)}
.empty-log{text-align:center;padding:20px;font-size:13px;color:var(--t2)}

/* ── 토스트 ── */
.toast{

.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.err{background:var(--td)}
</style>

<script>

const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpuZGJjbXpxdW9hYXZzZm9qaGh6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAzNTE5MzYsImV4cCI6MjA5NTkyNzkzNn0.5lI7H6QR5e-fJGBgQQu4Zwk4G_l3EZ4Dc8wM1cvokGs'
// ════════════════════════════════════════════

const EAST = ['백현석','심재천','이동성','정승상','박재환','손혜령','권성은','김다진']
const WEST = ['임현묵','최용','조인호','박민국','강탄','우수민','조용준','장길평','박찬혜']

let sb = null

// ════════════════ 카카오 로그인 게이트 (신청 → 관리자 승인 방식) ════════════════

function _siteRedirect(){ return location.origin + location.pathname }

async function kakaoLogin(){
  const { error } = await sb.auth.signInWithOAuth({
    provider: 'kakao',
    options: { redirectTo: _siteRedirect() }
  })
  if(error) alert('로그인 실패: ' + error.message)
}

async function appLogout(){
  await sb.auth.signOut()
  location.reload()
}

function _showGate(msg, sub){
  const g = document.getElementById('kakao-gate')
  if(msg) document.getElementById('kakao-gate-msg').textContent = msg
  document.getElementById('kakao-gate-sub').innerHTML = sub || ''
  g.style.display = 'flex'
  const lo = document.getElementById('kakao-logout'); if(lo) lo.style.display = 'none'
}
function _hideGate(){
  document.getElementById('kakao-gate').style.display = 'none'
  const lo = document.getElementById('kakao-logout'); if(lo) lo.style.display = 'block'
}

// 로그인 사용자 상태 확인 + 최초 로그인 시 가입 신청(app_users 테이블)
// 반환 status: 'approved' | 'pending' | 'rejected' | 'no-email' | 'error'
async function _checkUser(user){
  const email = (user.email || '').toLowerCase()
  if(!email) return { status:'no-email' }
  let { data, error } = await sb.from('app_users').select('status,role,ma_name,name').eq('email', email).maybeSingle()
  if(error){ console.error('app_users 조회 오류', error); return { status:'error' } }
  if(!data){
    // 최초 로그인 → 승인 대기(pending) 신청 행 생성
    const name = user.user_metadata?.name || user.user_metadata?.full_name || ''
    const ins = await sb.from('app_users').insert({ email, name, status:'pending', role:'ma' }).select('status,role,ma_name,name').maybeSingle()
    if(ins.error){ console.error('가입 신청 오류', ins.error); return { status:'error' } }
    data = ins.data || { status:'pending' }
  }
  return data
}

// 핵심: 세션 확인 → 승인된 사용자만 onPass() 실행
async function gateAuth(onPass){
  const { data: { session } } = await sb.auth.getSession()
  if(!session){ _showGate('로그인이 필요합니다.'); return }
  const u = await _checkUser(session.user)
  const logout = '<br><a href="#" onclick="appLogout();return false" style="color:#888">로그아웃</a>'
  if(u.status === 'approved'){
    _hideGate()
    // 카카오 신원 → 대시보드 이름 자동 설정 (app_users.ma_name 우선, 없으면 카카오 닉네임)
    const nick = session.user.user_metadata?.name || session.user.user_metadata?.full_name || ''
    onPass({ name: u.ma_name || u.name || nick, role: u.role || 'ma' })
  } else if(u.status === 'pending'){
    _showGate('가입 신청이 접수되었습니다.', '관리자 승인 후 이용할 수 있습니다. 승인되면 새로고침해 주세요.' + logout)
  } else if(u.status === 'rejected'){
    _showGate('접근이 거부된 계정입니다.', '관리자에게 문의하세요.' + logout)
  } else if(u.status === 'no-email'){
    _showGate('이메일 정보가 필요합니다.', '카카오 로그인 동의 항목에서 이메일을 허용해야 합니다.' + logout)
  } else {
    _showGate('확인 중 오류가 발생했습니다.', '잠시 후 다시 시도해 주세요.' + logout)
  }
}

// 캠페인 설정 (PC와 동일, localStorage 공유)
const CAMPAIGN_START = (function(){
  try{ return localStorage.getItem('campaign_start') || '2026-06-05' }catch(e){ return '2026-06-05' }
})()
const CUSTOM_OFF_DAYS = (function(){
  try{ return JSON.parse(localStorage.getItem('custom_off_days')||'[]') }catch(e){ return [] }

const KR_HOLIDAYS_M = new Set([
  '2025-01-01','2025-03-01','2025-05-05','2025-06-06','2025-08-15','2025-10-03','2025-10-09','2025-12-25',
  '2026-01-01','2026-03-01','2026-05-05','2026-06-06','2026-08-15','2026-10-03','2026-10-09','2026-12-25',
  '2026-02-16','2026-02-17','2026-02-18','2026-09-24','2026-09-25','2026-09-26',
  '2027-01-01','2027-03-01','2027-05-05','2027-06-06','2027-08-15','2027-10-03','2027-10-09','2027-12-25'
])
function isWorkdayM(ds){
  if(ds <= CAMPAIGN_START) return false
  if(CUSTOM_OFF_DAYS.indexOf(ds)>=0) return false
  const dt=new Date(ds+'T00:00:00'), d=dt.getDay()
  return d!==0 && d!==6 && !KR_HOLIDAYS_M.has(ds)
}

// 모바일용 헬퍼 (PC와 동일 로직)
function calcPhaseM(b){ return b>=10?1:b>=5?2:3 }

// ── 조직(사업부>팀>구성원) 로드: Supabase app_config('app_snapshot') 우선 → localStorage 폴백 ──
let MORG = null
function _orgFromLocal(){ try{ return JSON.parse(localStorage.getItem('org_structure_v1')||'null') }catch(e){ return null } }
async function loadOrgM(){
  try{
    const { data } = await sb.from('app_config').select('value').eq('key','app_snapshot').maybeSingle()
    if(data && data.value && data.value.org && (data.value.org.divisions||[]).length) MORG = data.value.org
  }catch(e){ console.error('조직 스냅샷 로드 실패', e) }
  if(!MORG) MORG = _orgFromLocal()
  if(MORG){ try{ localStorage.setItem('org_structure_v1', JSON.stringify(MORG)) }catch(e){} }
  rebuildNameSelect()
}
function allTeamsM(){
  const org = MORG || _orgFromLocal()
  const arr = []
  if(org && org.divisions) org.divisions.forEach(function(d){
    (d.teams||[]).forEach(function(t){ arr.push({ id:t.id, name:t.name, members:t.members||[], divName:d.name }) })
  })
  return arr
}
function maTeamM(ma){
  const t = allTeamsM().find(function(t){ return t.members.indexOf(ma)>=0 })
  if(t) return t.id
  // 폴백: 초기 EAST/WEST 배열
  return EAST.indexOf(ma)>=0 ? 'east' : 'west'
}
function teamNameM(tid){
  const t = allTeamsM().find(function(t){ return t.id===tid })
  return t ? t.name : (tid==='east' ? '동부팀' : tid==='west' ? '서부팀' : (tid||''))
}
function maDivisionM(ma){
  const tid = maTeamM(ma)
  const t = allTeamsM().find(function(t){ return t.id===tid })
  return t ? t.divName : null
}
// 이름 선택 목록을 조직 기준으로 재구성 (조직 정보 없으면 하드코딩 목록 유지)
function rebuildNameSelect(){
  const sel = document.getElementById('m-ma'); if(!sel) return
  const teams = allTeamsM(); if(!teams.length) return
  const cur = sel.value
  let h = '<option value="">선택</option>'
  teams.forEach(function(t){
    h += '<optgroup label="'+escHtml((t.divName ? t.divName+' · ' : '')+t.name)+'">'
      + t.members.map(function(m){ return '<option'+(m===cur?' selected':'')+'>'+escHtml(m)+'</option>' }).join('')
      + '</optgroup>'
  })
  sel.innerHTML = h
  if(cur) sel.value = cur
}
function _workdaysBetweenM(startExcl, endIncl){
  const arr=[]
  const p=startExcl.split('-').map(Number)
  const d=new Date(p[0],p[1]-1,p[2]); d.setDate(d.getDate()+1)
  const end=new Date(endIncl+'T00:00:00')
  while(d<=end){
    const ds=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')
    if(isWorkdayM(ds)) arr.push(ds)
    d.setDate(d.getDate()+1)
  }
  return arr
}
function _dbForWorkdayM(list, idx){
  if(!list.length) return null
  const sorted=[...list].sort((a,b)=>(b.branches||0)-(a.branches||0))
  return sorted[idx % sorted.length]
}
// PC의 getAssignedForDate와 동일 로직 (모바일판)
function getAssignedForDateM(ma, targetDate){
  const allAssigned = DB_ALL.filter(r=>r.assign1===ma && r.is_target!==false)
  if(!allAssigned.length) return { today:[], carryover:[], total:[] }
  const workdays = _workdaysBetweenM(CAMPAIGN_START, targetDate)
  const performed = new Set(MY_LOGS_ALL.filter(l=>l.ma_name===ma).map(l=>l.company))
  const todayIdx = workdays.indexOf(targetDate)
  if(todayIdx<0) return { today:[], carryover:[], total:[] }
  const carryover=[]
  for(let i=0;i<todayIdx;i++){
    const wd=workdays[i]
    const a=_dbForWorkdayM(allAssigned,i)
    if(a && !performed.has(a.name)) carryover.push({...a, _dueDate:wd})
  }
  const todayDb=_dbForWorkdayM(allAssigned,todayIdx)
  const today = todayDb ? [todayDb] : []
  const carryNames=new Set(carryover.map(r=>r.name))
  const todayFinal=today.filter(r=>!carryNames.has(r.name))
  return { today:todayFinal, carryover, total:carryover.concat(todayFinal) }
}

// index.html의 td()와 동일한 방식
// 로컬 시간 기준 YYYY-MM-DD (타임존 안전 — toISOString은 UTC라 한국시간에서 하루 밀림)
function ymd(d){
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), dd=String(d.getDate()).padStart(2,'0')
  return y+'-'+m+'-'+dd
}
function td(){ return ymd(new Date()) }

// 휴대폰번호 가운데 마스킹 (표시용 — DB 원본은 그대로 유지)
function maskPhone(v){
  if(v==null) return v
  return String(v).replace(/\b(01[0-9])[- ]?(\d{3,4})[- ]?(\d{4})\b/g, function(m,a,b,c){ return a+'-****-'+c })
}

function escHtml(s){
  return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')
}

// 현 거래업체 구분: 대기업 5개 + 그외(직접입력), 지역중상은 자유입력
const BIG_PARTNERS = ['삼성웰스토리','동원홈푸드','SPC','현대그린푸드','사조']
function partnerFieldHtml(prefix, type, val){
  val = val || ''
  if(type === '대기업'){
    const isOther = !!val && BIG_PARTNERS.indexOf(val) < 0
    let opts = '<option value="">선택</option>'
      + BIG_PARTNERS.map(function(b){ return '<option'+(val===b?' selected':'')+'>'+b+'</option>' }).join('')
      + '<option value="__other"'+(isOther?' selected':'')+'>그외(직접입력)</option>'
    return '<select id="'+prefix+'-cp-sel" onchange="onBigPartner(\''+prefix+'\')">'+opts+'</select>'
      + '<input type="text" id="'+prefix+'-cp" placeholder="업체명 직접입력" value="'+(isOther?escHtml(val):'')+'" style="margin-top:6px;display:'+(isOther?'block':'none')+'">'
  } else if(type === '지역중상'){
    return '<input type="text" id="'+prefix+'-cp" placeholder="업체명 입력" value="'+escHtml(val)+'">'
  }
  return '<input type="text" id="'+prefix+'-cp" placeholder="KG이니시스" value="'+escHtml(val)+'">'
}
function onPartnerType(prefix){
  const type = (document.getElementById(prefix+'-ptype')||{}).value || ''
  const wrap = document.getElementById(prefix+'-cp-wrap')
  if(!wrap) return
  const cur = (document.getElementById(prefix+'-cp')||{}).value || ''
  wrap.innerHTML = partnerFieldHtml(prefix, type, cur)
}
function onBigPartner(prefix){
  const sel = document.getElementById(prefix+'-cp-sel')
  const txt = document.getElementById(prefix+'-cp')
  if(!sel || !txt) return
  if(sel.value === '__other'){ txt.style.display='block'; txt.value=''; txt.focus() }

}

}

  const co = document.getElementById('m-co').value.trim()
  const rs = document.getElementById('m-rs').value
  const cd = document.getElementById('m-cd').value.trim()

  if(!ma){ showToast('이름을 선택해주세요', true); return }
  if(!co){ showToast('고객사명을 입력해주세요', true); return }
  if(!ct){ showToast('연락처를 입력해주세요', true); return }
  if(!rs){ showToast('통화결과를 선택해주세요', true); return }
  if(!cd){ showToast('상담내역을 입력해주세요', true); return }
  if(!cr){ showToast('상담결과를 선택해주세요', true); return }

  // DB 검증: 없으면 신규 등록, 제외(N)면 차단
  if(DB_ALL.length){
    const dbMatch = DB_ALL.find(function(r){ return r.name===co })
    if(!dbMatch){
      const added = await promptAddNewCompanyM(co, ma)
      if(!added) return   // 취소
    } else if(dbMatch.is_target===false){
      showToast('"'+co+'"은(는) TM 제외 거래처입니다. 관리자에게 문의해주세요.', true)
      return
    }
  }

  const btn = document.getElementById('btn-submit')

  btn.textContent = '저장 중...'

  const rec = {
    log_date: CUR_DATE,         // index.html td()와 동일 방식
    ma_name: ma,
    team: maTeamM(ma),
    division: maDivisionM(ma),
    company: co,

// 모바일: DB에 없는 거래처 신규 등록 (PC의 promptAddNewCompany와 동일)
async function promptAddNewCompanyM(name, ma){
  const ok = confirm('"'+name+'"은(는) DB에 없는 거래처입니다.\n\n신규로 등록하고 TM 기록을 진행하시겠습니까?\n(본인 담당으로 배정됩니다)')

  if(bInput===null) return null
  const branches = parseInt(bInput) || 0

  const myTeam = maTeamM(ma)
  const phase = calcPhaseM(branches)

  const newRow = {
    name: name,
    branches: branches,
    region: myTeam,
    is_target: true,
    phase: phase,
    phase_approved: true,
    assign1: ma,
    assign2: null,
    r2_enabled: false,
    source: 'ma_added'
  }

  const { data, error } = await sb.from('company_db').insert(newRow).select().single()
  if(error){
    // source 컬럼 없을 때 재시도
    if(String(error.message||'').toLowerCase().includes('source')){
      delete newRow.source
      const retry = await sb.from('company_db').insert(newRow).select().single()
      if(retry.error){ showToast('등록 실패: '+retry.error.message, true); return null }
      DB_ALL.push(retry.data)
      DB_LIST = DB_ALL.filter(function(r){ return r.is_target!==false })
      buildCompanyDatalist()
      return retry.data
    }
    showToast('등록 실패: '+error.message, true)
    return null
  }
  DB_ALL.push(data)
  DB_LIST = DB_ALL.filter(function(r){ return r.is_target!==false })
  buildCompanyDatalist()
  showToast('✓ "'+name+'" DB 등록 완료')
  return data
}

function showToast(msg, isErr){
  const t = document.getElementById('toast')
  t.textContent = msg
  t.className = 'toast' + (isErr ? ' err' : '')
  t.classList.add('show')
  setTimeout(function(){ t.classList.remove('show') }, 2500)
}

// 초기화
window.addEventListener('DOMContentLoaded', function(){
  function initSb(){
    if(typeof supabase !== 'undefined'){
      const { createClient } = supabase
      sb = createClient(SUPABASE_URL, SUPABASE_KEY, {
        auth: {
          // 브라우저를 닫으면 세션이 사라져 → 다시 켤 때 재로그인 필요
          storage: window.sessionStorage,
          persistSession: true,
          autoRefreshToken: true,
          detectSessionInUrl: true
        }
      })
      let _booted = false
      async function _boot(id){
        if(_booted) return
        _booted = true
        // 조직(사업부·팀) 스냅샷 로드 → 이름 목록 재구성 (이름 설정 전에 완료 필요)
        await loadOrgM()
        // DB 거래처 목록 로드 (가맹점수 표시용)
        loadDB()
        // 카카오 신원 이름 우선, 없으면 저장된 이름
        const sel = document.getElementById('m-ma')
        const role = (id && id.role) ? id.role : 'ma'
        const canPick = (role === 'admin' || role === 'leader')  // 리더/관리자만 타인 선택 가능
        let nm = (id && id.name) ? id.name : (localStorage.getItem('my_ma_name') || '')
        let setOk = false
        if(nm){
          const exists = Array.prototype.some.call(sel.options, function(o){ return o.value===nm })
          if(exists){
            sel.value = nm
            localStorage.setItem('my_ma_name', nm)
            updateHeader()
            loadMyLogs()
            setOk = true
          }
        }
        // 일반 구성원은 본인 이름 고정(타인 선택 불가)
        if(!canPick && setOk) sel.disabled = true
        updateDateDisplay()
      }
      gateAuth(_boot)
      sb.auth.onAuthStateChange(function(){ gateAuth(_boot) })
    } else {
      setTimeout(initSb, 50)
    }
  }
  initSb()
})
</script>
