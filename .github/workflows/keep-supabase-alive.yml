name: Keep Supabase Alive

on:
  schedule:
    # 매주 월·목 오전 9시 (KST = UTC+9, 즉 UTC 00:00) 실행
    - cron: '0 0 * * 1,4'
  workflow_dispatch:  # 수동 실행 버튼도 활성화

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          echo "Supabase 핑 전송 중..."
          
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" \
            -X GET \
            "${{ secrets.SUPABASE_URL }}/rest/v1/tm_logs?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}")
          
          echo "응답 코드: $RESPONSE"
          
          if [ "$RESPONSE" = "200" ] || [ "$RESPONSE" = "206" ]; then
            echo "✅ Supabase 연결 정상"
          else
            echo "⚠️ 응답 코드 $RESPONSE — 확인 필요"
            exit 1
          fi

      - name: 결과 요약
        if: always()
        run: |
          echo "실행 시각: $(TZ=Asia/Seoul date)"
          echo "프로젝트: ${{ secrets.SUPABASE_URL }}"
