async function saveEditLog(id){
  const r = CACHE.logs.find(function(l){ return String(l.id)===String(id) })
  if(!r) return
  const cd = document.getElementById('el-cd')?.value?.trim()
  const cr = document.getElementById('el-cr')?.value
  if(!cd || !cr){ alert('통화결과와 상담내역은 필수입니다.'); return }

  const now = new Date().toISOString()
  const updates = {
    current_partner: document.getElementById('el-cp')?.value?.trim() || null,
    fee_rate:        document.getElementById('el-fr')?.value?.trim() || null,
    ceo_contact:     document.getElementById('el-ct')?.value?.trim() || null,
    call_result:     cr,
    consult_detail:  cd,
    consult_result:  document.getElementById('el-rs')?.value || null,

    is_edited:       true,

// tm_logs UPDATE 공통 처리
// · 선택 컬럼(is_edited/updated_at/edited_by/edited_by_role)이 없는 DB에서도 재시도로 동작
// · .select()로 실제 갱신 행 수 확인 → RLS가 막으면 에러 없이 0행이므로 무음 실패를 감지
async function applyLogUpdate(id, updates){
  const OPTIONAL = ['is_edited','updated_at','edited_by','edited_by_role']
  const u = Object.assign({}, updates)
  let { data, error } = await sb.from('tm_logs').update(u).eq('id', id).select()
  if(error && /column/i.test(error.message||'')){
    OPTIONAL.forEach(function(k){ delete u[k] })
    const retry = await sb.from('tm_logs').update(u).eq('id', id).select()
    data = retry.data; error = retry.error
  }
  if(error){ alert('저장 실패: '+error.message); return false }
  if(!data || !data.length){
    alert('저장되지 않았습니다. (DB 권한/RLS 정책이 이 기록의 수정을 막고 있습니다)')
    return false
  }
  return true
}

async function decideTransfer(id, approve){
  if(!hasPerm('transfer_approve')){ alert('승인 권한이 없습니다.'); return }
  const { data: reqs } = await sb.from('transfer_requests').select('*').eq('id', id).limit(1)
  const req = reqs && reqs[0]
  if(!req || req.status!=='pending'){ alert('이미 처리됐거나 찾을 수 없는 요청입니다.'); loadTransferReqs(); return }
  const isEx = req.req_type === 'exclude'
  const _summary = isEx ? (req.company+' → 대상 제외(N)') : (req.company+' : '+(req.from_ma||'미지정')+' → '+req.to_ma)
  if(!confirm((approve?'승인':'거절')+'하시겠습니까?\n\n'+_summary+(isEx&&approve?'\n(제외 시 다음 할당처가 자동으로 채워집니다)':''))) return
  if(approve){
    const patch = isEx ? { is_target:false } : { assign1: req.to_ma }
    const { data: upd, error } = await sb.from('company_db').update(patch).eq('name', req.company).select()
    if(error){ alert((isEx?'제외':'배정 변경')+' 실패: '+error.message); return }
    if(!upd || !upd.length){
      if(!confirm('DB에서 거래처 "'+req.company+'"을(를) 찾지 못했습니다.\n요청만 승인 처리할까요?')) return
    } else {
      upd.forEach(function(u){ const c = CACHE.db.find(function(x){ return x.id===u.id }); if(c) Object.assign(c, patch) })
    }
  }
  await sb.from('transfer_requests').update({
    status: approve?'approved':'rejected',
    decided_by: (REAL_USER && REAL_USER.name) || (CURRENT_USER && CURRENT_USER.name) || '',
    decided_at: new Date().toISOString()
  }).eq('id', id)
  loadTransferReqs()
  if(approve) reRenderActive()
}

// TM 내역 토글박스(셀렉트)로 통화결과/상담결과 인라인 변경 — 본인 또는 리더 이상
async function changeLogField(id, field, value, el){
  const r = CACHE.logs.find(function(l){ return String(l.id)===String(id) })
  if(!r){ alert('기록을 찾을 수 없습니다.'); return }
  if(field==='call_result' && (value==='담당자변경' || value==='제외요청')){   // 통화결과 값이 아니라 요청 워크플로 진입
    if(el) el.value = r.call_result || ''
    if(value==='제외요청') openExcludeModal(r.company||'', r.ma_name||'')
    else openTransferModal(r.company||'', r.ma_name||'')
    return
  }
  if(!hasPerm('tm_edit_others') && CURRENT_USER?.name !== r.ma_name){
    alert('본인의 TM 기록만 변경할 수 있습니다.')
    if(el) el.value = r[field] || ''
    return
  }
  if(!value){ if(el) el.value = r[field] || ''; return }
  if(value === r[field]) return
  const updates = {}
  updates[field] = value
  updates.is_edited = true
  updates.updated_at = new Date().toISOString()
  updates.edited_by = (REAL_USER && REAL_USER.name) ? REAL_USER.name : (CURRENT_USER && CURRENT_USER.name) || ''
  updates.edited_by_role = (REAL_USER && REAL_USER.role) ? REAL_USER.role : (CURRENT_USER && CURRENT_USER.role) || ''
  const ok = await applyLogUpdate(id, updates)
  if(!ok){ if(el) el.value = r[field] || ''; return }   // 실패(RLS 등) 시 원래 값 복원
  Object.assign(r, updates)
  refreshOpenMAModal()
  reRenderActive()
}

  const canEdit = hasPerm('tm_edit_others') || CURRENT_USER?.name === r.ma_name
  const cur = r[field] || ''

    const cls = field==='consult_result' ? (cur==='종결'?'pill 종결':'pill 추가상담') : 'pill '+cur
    return '<span class="'+cls+'">'+escHtml(cur)+'</span>'
  }

const _CR_CYCLE = ['보류','종결','추가상담']
async function quickChangeResult(id, ev){
  if(ev && ev.stopPropagation) ev.stopPropagation()   // 카드 클릭 등 상위 이벤트 전파 차단
  const r = CACHE.logs.find(function(l){ return String(l.id)===String(id) })

  if(!hasPerm('tm_edit_others') && CURRENT_USER?.name !== r.ma_name){
    alert('본인의 TM 기록만 변경할 수 있습니다.'); return
  }
  const cur = r.consult_result || '보류'
  const idx = _CR_CYCLE.indexOf(cur)
  const next = _CR_CYCLE[(idx+1) % _CR_CYCLE.length]
  if(!confirm('상담결과를 변경할까요?\n\n'+(r.company||'')+' · '+(r.ma_name||'')+'\n['+cur+'] → ['+next+']')) return

  const updates = {
    consult_result: next,
    is_edited: true,
    updated_at: new Date().toISOString(),
    edited_by: (REAL_USER && REAL_USER.name) ? REAL_USER.name : (CURRENT_USER && CURRENT_USER.name) || '',
    edited_by_role: (REAL_USER && REAL_USER.role) ? REAL_USER.role : (CURRENT_USER && CURRENT_USER.role) || ''
  }
  const ok = await applyLogUpdate(id, updates)
  if(!ok) return
  Object.assign(r, updates)
  refreshOpenMAModal()
  reRenderActive()
}

// ══════════ 팔로우업(+5일) 규칙 ══════════
// 상담결과가 '보류' 또는 '추가상담'인 기록은 기록일 +5일(달력일) 내 후속 TM(재통화 기록)이 필요.
// 완료 판정: 같은 고객사의 이후 TM 기록 존재 (담당자 무관, 기록일이 더 늦거나 같은 날이면 작성시각이 더 늦은 것)
// 추후 알림톡 연동 대비: fuOpenListFor(ma)가 '이번주 팔로우업 고객사' 데이터 소스가 됨
const FU_DAYS = 5
function fuDueDate(d){ const dt = new Date(d+'T00:00:00'); dt.setDate(dt.getDate()+FU_DAYS); return fnYmd(dt) }
function buildFuIndex(){
  const byCo = {}
  CACHE.logs.forEach(function(l){ if(!l.company) return; (byCo[l.company] || (byCo[l.company]=[])).push(l) })
  Object.keys(byCo).forEach(function(k){
    byCo[k].sort(function(x,y){ return (x.log_date+'|'+(x.created_at||'')).localeCompare(y.log_date+'|'+(y.created_at||'')) })
  })
  return byCo
}
// 반환: null(대상 아님) 또는 { due, state:'done'|'doneLate'|'wait'|'over', doneDate?, dLeft?, overDays? }
function fuStatus(r, byCo){
  if(r.consult_result!=='보류' && r.consult_result!=='추가상담') return null
  const due = fuDueDate(r.log_date)
  const list = (byCo && byCo[r.company]) || []
  const later = list.find(function(l){
    if(String(l.id)===String(r.id)) return false
    return l.log_date > r.log_date || (l.log_date===r.log_date && (l.created_at||'') > (r.created_at||''))
  })
  if(later) return { due, state: later.log_date <= due ? 'done' : 'doneLate', doneDate: later.log_date }
  const diff = Math.round((new Date(due+'T00:00:00') - new Date(CUR_DATE+'T00:00:00'))/86400000)
  if(diff < 0) return { due, state:'over', overDays:-diff }
  return { due, state:'wait', dLeft:diff }
}
// 팔로우업 상태 배지 HTML
function fuBadge(st){
  if(!st) return ''
  const base = 'display:inline-block;font-size:9px;font-weight:700;padding:1px 6px;border-radius:99px;margin-top:3px;white-space:nowrap;'
  if(st.state==='done')     return '<span style="'+base+'background:var(--bgs);color:var(--ts)" title="팔로우업 완료: '+st.doneDate+'">✓F/U '+st.doneDate.slice(5)+'</span>'
  if(st.state==='doneLate') return '<span style="'+base+'background:var(--bg2);color:var(--t2)" title="기한('+st.due+') 이후 팔로우업: '+st.doneDate+'">✓F/U 지연완료</span>'
  if(st.state==='over')     return '<span style="'+base+'background:var(--bgd);color:var(--td)" title="팔로우업 기한 초과: '+st.due+' (+'+st.overDays+'일)">F/U 지연 +'+st.overDays+'일</span>'
  return '<span style="'+base+'background:var(--bgi);color:var(--ti)" title="팔로우업 기한: '+st.due+'">F/U D-'+st.dLeft+'</span>'
}
// 해당 MA의 미완료 팔로우업 목록 (지연 + 기한 임박순) — 알림톡 '이번주 팔로우업' 데이터 소스
function fuOpenListFor(ma){
  const byCo = buildFuIndex()
  const out = []
  CACHE.logs.forEach(function(r){
    if(r.ma_name !== ma) return
    const st = fuStatus(r, byCo)
    if(st && (st.state==='wait' || st.state==='over')) out.push({ r:r, st:st })
  })
  out.sort(function(a,b){ return a.st.due.localeCompare(b.st.due) })
  return out
}

function getAllRows(){
  return [...CACHE.logs].sort((a,b)=>b.log_date.localeCompare(a.log_date)||b.created_at.localeCompare(a.created_at))
    .map(l=>{
      const tid = resolveRowTeamId(l)          // 조직 기준 팀 id (여러 폴백)
      const t = tid ? teamById(tid) : null
      return {...l,
        team_id: tid,
        team: t ? t.name : (teamName(l.team) || l.team || '—'),        // 표시용 팀명
        division: (t && t.divName) ? t.divName : (l.division || null)   // 표시용 사업부명
      }
    })
}
// 기록 1건의 팀 id를 최대한 정확히 해석 (하드코딩 배열에 의존하지 않음)
//  1) 현재 조직(ORG)에서 담당 MA의 소속 팀
//  2) 기록에 저장된 team 값이 실제 팀 id면 그대로
//  3) 기록에 저장된 team 값이 팀 '이름'이면 이름으로 팀 매칭
//  4) 그래도 없으면 null → 표시 시 저장값/— 로 폴백 (임의 팀 지정 금지)
function resolveRowTeamId(l){
  const byMa = maTeam(l.ma_name)
  if(byMa) return byMa
  if(l.team){
    if(teamById(l.team)) return l.team                 // team 값이 id
    const byName = allTeams().find(function(t){ return t.name===l.team })
    if(byName) return byName.id                        // team 값이 이름
  }
  return null
}
function hlText(t,kw){if(!kw||!t)return t||'';const e=kw.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');return t.replace(new RegExp(e,'gi'),m=>`<span class="hl">${m}</span>`)}

// TM 내역 열람 범위: 구성원=본인, 리더=본인 팀, 사업부장=본인 사업부, 그 외 직책=전체
function canViewTM(r){
  const role = CURRENT_USER?.role
  if(seesAllDivisions()) return true
  if((role === 'division_head' || role === 'support_lead')){
    const recDiv = (teamById(recTeamId(r))||{}).divId
    return recDiv === myDivisionId()
  }
  if(role === 'leader'){
    return recTeamId(r) === myTeamId()
  }
  return isMe(r.ma_name)
}
function tmScopeLabel(){
  const role = CURRENT_USER?.role
  if(seesAllDivisions()) return '전체 열람'
  if((role === 'division_head' || role === 'support_lead')) return '사업부 열람'
  if(role === 'leader') return '팀 열람'
  return '내 TM만 표시'
}

// ── 피드백 (다회차 누적, 덮어쓰기 없음) ──
// tm_logs.feedbacks(jsonb 배열)에 {text, by, role, at} 누적. 기존 단일 feedback 값은 1차로 자동 승계.
// 관리자·팀장 등 여러 사람이 각자 회차를 추가할 수 있고, 같은 사람도 여러 번 남길 수 있음.
function fbEntriesOf(r){
  if(Array.isArray(r.feedbacks) && r.feedbacks.length) return r.feedbacks
  if(r.feedback) return [{ text:r.feedback, by:r.feedback_by||'', role:r.feedback_role||'', at:r.feedback_at||'' }]
  return []
}
// 피드백 회차 삭제 — 본인이 작성한 회차 또는 관리자만 가능
async function deleteFeedback(id, idx){
  const r = CACHE.logs.find(function(x){ return String(x.id)===String(id) })
  if(!r){ alert('기록을 찾을 수 없습니다.'); return }
  const entries = fbEntriesOf(r).slice()
  const f = entries[idx]
  if(!f){ alert('피드백 회차를 찾을 수 없습니다.'); return }
  const me = (REAL_USER && REAL_USER.name) || (CURRENT_USER && CURRENT_USER.name) || ''
  if(!isRealAdmin() && (!f.by || f.by !== me)){
    alert('본인이 작성한 피드백만 삭제할 수 있습니다. (관리자는 전체 삭제 가능)'); return
  }
  if(!confirm((idx+1)+'차 피드백을 삭제하시겠습니까?\n\n"'+(f.text||'')+'"\n\n이후 회차 번호가 앞당겨집니다.')) return
  entries.splice(idx, 1)
  const { data, error } = await sb.from('tm_logs').update({ feedbacks: entries }).eq('id', r.id).select()
  if(error){ alert('피드백 삭제 실패: '+error.message); return }
  if(!data || !data.length){ alert('저장되지 않았습니다. (RLS 권한 확인 필요)'); return }
  r.feedbacks = entries
  // 레거시 단일 피드백만 있던 기록의 경우 새 배열 스키마로 전환됨(원본 컬럼은 그대로 두되 표시는 배열 우선)
  renderTMResults()
}

async function addFeedback(id){
  if(!isLeader()){ alert('피드백은 팀장(리더) 이상 권한에서 작성할 수 있습니다.'); return }
  const r = CACHE.logs.find(x=>String(x.id)===String(id)); if(!r) return
  const input = document.getElementById('fb-in-'+id)
  const text = (input?.value || '').trim()
  if(!text){ alert('피드백 내용을 입력해주세요.'); return }
  const who = (REAL_USER && REAL_USER.name) ? REAL_USER.name : (CURRENT_USER && CURRENT_USER.name) || ''
  const role = (REAL_USER && REAL_USER.role) ? REAL_USER.role : (CURRENT_USER && CURRENT_USER.role) || ''
  const entries = fbEntriesOf(r).slice()   // 기존(레거시 포함) 회차 보존
  entries.push({ text: text, by: who, role: role, at: new Date().toISOString() })
  const { data, error } = await sb.from('tm_logs').update({ feedbacks: entries }).eq('id', r.id).select()
  if(error){
    if(/column|feedbacks|schema cache/i.test(error.message||'')){
      alert('피드백 회차 저장을 위해 Supabase SQL Editor에서 아래를 실행해주세요:\n\nalter table tm_logs add column if not exists feedbacks jsonb;')
    } else alert('피드백 저장 실패: '+error.message)
    return
  }
  if(!data || !data.length){ alert('저장되지 않았습니다. (RLS 권한 확인 필요)'); return }
  r.feedbacks = entries
  renderTMResults()
}

function getFiltered(){
  const all=getAllRows(),tf=document.getElementById('tl-team')?.value||'',mf=document.getElementById('tl-ma')?.value||'',cf=document.getElementById('tl-call')?.value||'',crf=document.getElementById('tl-cr')?.value||'',ff=document.getElementById('tl-from')?.value||'',tf2=document.getElementById('tl-to')?.value||'',kl=(document.getElementById('tl-kw')?.value||'').trim().toLowerCase()
  const fuf=document.getElementById('tl-fu')?.value||''
  const _fuIdx=fuf?buildFuIndex():null
  return all.filter(r=>{
    if(tf&&recTeamId(r)!==tf)return false;if(mf&&r.ma_name!==mf)return false;if(cf&&r.call_result!==cf)return false;if(crf&&r.consult_result!==crf)return false;if(ff&&r.log_date<ff)return false;if(tf2&&r.log_date>tf2)return false
    if(fuf){const st=fuStatus(r,_fuIdx);if(!st)return false
      if(fuf==='done'){if(st.state!=='done'&&st.state!=='doneLate')return false}
      else if(st.state!==fuf)return false}
    if(kl){
      const field=(document.getElementById('tl-field')?.value||'')
      let searchStr
      if(field==='company')       searchStr=(r.company||'').toLowerCase()
      else if(field==='ma')       searchStr=(r.ma_name||'').toLowerCase()
      else if(field==='partner')  searchStr=(r.current_partner||'').toLowerCase()
      else if(field==='detail')   searchStr=((r.consult_detail||'')+(r.consult_result||'')).toLowerCase()
      else if(field==='action')   searchStr=(r.action_plan||'').toLowerCase()
      else searchStr=[r.company,r.current_partner,r.ceo_contact,r.consult_detail,r.action_plan,r.ma_name,r.call_result].join(' ').toLowerCase()
      if(!searchStr.includes(kl))return false
    }
    return true
  })
}

function renderDBTab() {

  bindFileInput()
  // 차수 승인 신청 상태 로드 (승인대기 배지 표시용) — 최초 1회 이후엔 변경 시 갱신
  if(!window._phaseReqLoaded){

  }
  // tbody가 실제로 DOM에 붙을 때까지 재시도 (최대 10회)
  let tries = 0
  function tryRefresh(){
    const tbody = document.getElementById('db-tbody')
    if(tbody){

    }
  }

  // 필터 행

    + '<select id="db-fp" onchange="refreshDBTable()"><option value="">1·2·3차 전체</option><option value="1">1차(10개↑)</option><option value="2">2차(5~9개)</option><option value="3">3차(4개↓)</option></select>'
    + '<select id="db-fs" onchange="refreshDBTable()"><option value="">전체 상태</option><option value="u">미할당</option><option value="a1">1차 할당</option><option value="a2">2차 할당</option></select>'
    + '<select id="db-ft" onchange="refreshDBTable()"><option value="">대상 전체</option><option value="y">대상(Y)</option><option value="n">제외(N)</option></select>'
    + '<select id="db-fd" onchange="refreshDBTable()"><option value="">완료여부 전체</option><option value="done">TM완료</option><option value="pending">미완료</option></select>'
    + '<select id="db-fsrc" onchange="refreshDBTable()"><option value="">등록경로 전체</option><option value="ma">MA등록분</option></select>'
    + '<input type="text" id="db-sk" placeholder="거래처명 검색" oncompositionend="dbSkChange(event)" oninput="dbSkChange(event)" style="max-width:130px">'
    + '</div>'

  // 테이블
  h += '<div id="db-page-ctrl"></div>'
  h += '<div class="dbtw"><table class="dbt">'
    + '<colgroup><col style="width:13%"><col style="width:13%"><col style="width:6%"><col style="width:8%"><col style="width:8%"><col style="width:6%"><col style="width:9%"><col style="width:13%"><col style="width:11%"><col style="width:13%"></colgroup>'
    + '<thead><tr>'
    + '<th>상호</th><th>영업표지</th><th>가맹점</th><th>사업부</th><th>권역</th><th>차수</th><th>대상</th><th>1차 담당</th><th>2차 담당</th><th>관리</th>'
    + '</tr></thead><tbody id="db-tbody"></tbody></table></div>'

  h += '</div>'
  return h
}

// DB관리 열람 범위: 권한자=전체, 사업부장=본인 사업부, 팀장=본인 팀 배정분만
function dbCanSee(r){
  if(seesAllDivisions()) return true
  const role = CURRENT_USER?.role
  if((role === 'division_head' || role === 'support_lead')){
    return (teamById(r.region)||{}).divId === myDivisionId()
  }
  if(role === 'leader'){
    return r.region === myTeamId()
  }
  return true
}
function refreshDBTable(){
  const tbody = document.getElementById('db-tbody')
  if(!tbody) return

  // 페이지 리셋 (setDbPage 호출 시는 유지)
  if(window._DB_PAGE === undefined) window._DB_PAGE = 0
  if(!window._DB_PAGE_KEEP) window._DB_PAGE = 0
  window._DB_PAGE_KEEP = false

  // CACHE 미로드 시 대기 메시지
  if(!CACHE.db || !CACHE.db.length){
    tbody.innerHTML = '<tr><td colspan="9" style="text-align:center;padding:2rem;color:var(--t2)">' + (CACHE.loaded ? 'DB가 비어있습니다.' : '데이터 로딩 중...') + '</td></tr>'
    return
  }

  // 필터 값 수집
  const selDiv = window.DB_DIV_TAB || 'all'
  const selRegion = window.DB_REGION_TAB || 'all'
  const fp = document.getElementById('db-fp')?.value || ''
  const sf = document.getElementById('db-fs')?.value || ''
  const tf = document.getElementById('db-ft')?.value || ''
  const fd = document.getElementById('db-fd')?.value || ''
  const kw = (document.getElementById('db-sk')?.value || '').trim().toLowerCase()
  const fsrc = document.getElementById('db-fsrc')?.value || ''

  // 필터링
  const rows = CACHE.db.filter(function(r){
    if(!dbCanSee(r)) return false   // 권한 범위(팀장=본인 팀 배정분만)
    if(selDiv !== 'all' && rowDivision(r) !== selDiv.replace('사업부','')) return false
    if(selRegion !== 'all' && r.region !== selRegion) return false
    if(kw && !r.name.toLowerCase().includes(kw)) return false
    const st = r.assign2 ? 'a2' : r.assign1 ? 'a1' : 'u'
    if(sf && st !== sf) return false
    if(tf === 'y' && r.is_target === false) return false
    if(tf === 'n' && r.is_target !== false) return false
    const ph = calcPhase(r.branches || 0)
    if(fp && ph !== parseInt(fp)) return false
    const done = CACHE.logs.some(function(l){ return l.company === r.name })
    if(fd === 'done' && !done) return false
    if(fd === 'pending' && done) return false
    if(fsrc === 'ma' && r.source !== 'ma_added') return false
    return true
  })

  // 총계 표시
  const statEl = document.getElementById('db-total-stat')
  if(statEl) statEl.textContent = '총 ' + rows.length + '건'

  // 페이지네이션
  const PAGE_SIZE = window._DB_PAGE_SIZE || 50
  const isAll = window._DB_PAGE === -1
  let dbPage = isAll ? 0 : Math.max(0, parseInt(window._DB_PAGE || '0'))
  const totalPages = Math.ceil(rows.length / PAGE_SIZE) || 1
  if(!isAll && dbPage >= totalPages) dbPage = 0
  const pageRows = isAll ? rows : rows.slice(dbPage * PAGE_SIZE, (dbPage + 1) * PAGE_SIZE)

  // tbody 렌더 (pageCtrl 갱신 후 참조가 stale될 수 있어 다시 가져옴)
  const tbodyNow = document.getElementById('db-tbody') || tbody
  try {
  console.log('[DB] 렌더 시작: rows='+rows.length+', pageRows='+pageRows.length+', page='+window._DB_PAGE)
  tbodyNow.innerHTML = pageRows.map(function(r){
    const ph = calcPhase(r.branches||0)
    const phLabel = ph===1?'1차':ph===2?'2차':'3차'
    const phCol = ph===1?'var(--bgi)':ph===2?'var(--bgw)':'var(--bgd)'
    const phTxt = ph===1?'var(--ti)':ph===2?'var(--tw)':'var(--td)'
    const done = CACHE.logs.some(function(l){return l.company===r.name})
    const isTarget = r.is_target!==false
    const rowStyle = isTarget ? '' : 'opacity:.4;'
    const doneBadge = done ? '<span style="font-size:9px;color:var(--ts);margin-left:2px">✓</span>' : ''
    const histBadge = r.has_tm_history ? '<span class="tm-hist-tag" data-name="'+escHtml(r.name)+'" onclick="showTmHistory(this.dataset.name)" style="font-size:9px;padding:1px 5px;border-radius:99px;background:var(--bgi);color:var(--ti);margin-left:3px;cursor:pointer">TM이력</span>' : ''

    // 배정 후보: 전체 팀(남부·중부)의 활성 인원 모두 (타 사업부·타 팀 이관 가능)
    const allActiveMA = allTeams().reduce((a,t)=>a.concat(t.members),[]).filter(m=>isActiveMa(m))
    const _maT = function(m){ const t=teamById(maTeam(m)); return t?t.name.replace('팀',''):'' }
    const a1Opts = (r.assign1 ? allActiveMA.filter(m=>m!==r.assign1) : allActiveMA)
      .map(m=>`<option value="${m}">${m}(${_maT(m)})</option>`).join('')
    const a1Html = r.assign1
      ? `<span style="font-size:12px;font-weight:500">${r.assign1}</span> <select style="font-size:11px;padding:2px 4px;border-radius:6px;max-width:96px;background:var(--bgi);color:var(--ti);border:0.5px solid var(--bi);cursor:pointer" onchange="changeAssign1(${r.id},this.value)" title="담당자 변경"><option value="">🔄 변경 ▾</option>${a1Opts}</select>`
      : `<select style="font-size:11px;padding:3px 6px;border-radius:6px;max-width:112px;background:var(--bgi);color:var(--ti);border:0.5px solid var(--bi);cursor:pointer" onchange="changeAssign1(${r.id},this.value)" title="담당자 배정"><option value="">＋ 배정 ▾</option>${a1Opts}</select>`

    const a2h = r.assign2
      ? `<span style="font-size:12px;color:var(--ti)">${r.assign2}</span> <select style="font-size:11px;padding:2px 4px;border-radius:6px;max-width:96px;background:var(--bg1);color:var(--t2);border:0.5px solid var(--b2);cursor:pointer" onchange="setAssign2(${r.id},this.value)" title="2차 담당 변경"><option value="">🔄 변경 ▾</option>${allActiveMA.filter(m=>m!==r.assign2).map(m=>`<option value="${m}">${m}(${_maT(m)})</option>`).join('')}</select>`
      : r.r2_enabled
        ? `<select style="font-size:11px;padding:2px 4px" onchange="setAssign2(${r.id},this.value)"><option value="">＋ 배정 ▾</option>${allActiveMA.filter(m=>m!==r.assign1).map(m=>`<option value="${m}">${m}(${_maT(m)})</option>`).join('')}</select>`
        : '<span style="font-size:11px;color:var(--t3)">—</span>'

    // 대상 Y/N 토글
    const targetToggle = `<span style="font-size:11px;padding:2px 7px;border-radius:99px;background:${isTarget?'var(--bgs)':'var(--bgd)'};color:${isTarget?'var(--ts)':'var(--td)'};">${isTarget?'Y':'N'}</span> <button class="btn s" onclick="toggleTarget(${r.id},${isTarget})" style="padding:1px 6px;font-size:10px">${isTarget?'제외':'포함'}</button>`

    const st=r.assign2?'a2':r.assign1?'a1':'u'
    const stL=r.assign2?'2차할당':r.assign1?'1차할당':'미할당'
    return `<tr style="${rowStyle}">`
      + `<td title="${escHtml(r.brand_name||'')}" style="font-size:11px;color:var(--t2);max-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${r.brand_name?escHtml(r.brand_name):'<span style="color:var(--t3)">—</span>'}</td>`
      + `<td title="${r.name}" style="font-weight:500">${isAdmin()
          ? `<span style="cursor:pointer;border-bottom:1px dashed var(--b2)" onclick="renameCompany(${r.id})" title="클릭하여 영업표지 수정">${escHtml(r.name)}</span>`
          : escHtml(r.name)}${doneBadge}${histBadge}</td>`
      + `<td>${isLeader()
          ? `<span style="cursor:pointer;border-bottom:1px dashed var(--b2)" onclick="editBranches(${r.id})" title="클릭하여 수정">${(r.branches||0).toLocaleString()}</span>`
          : '<span style="color:var(--t3)">●●</span>'}</td>`
      + `<td>${isAdmin()
          ? `<select onchange="changeDivision(${r.id},this.value)" style="font-size:10px;padding:2px 3px;border-radius:6px;border:0.5px solid var(--b2);background:var(--bg1);color:var(--t2);max-width:60px" title="사업부 이관">${['남부','중부'].map(function(d){return '<option value="'+d+'"'+(rowDivision(r)===d?' selected':'')+'>'+d+'</option>'}).join('')}</select>`
          : `<span style="font-size:10px;padding:1px 5px;border-radius:99px;background:var(--bg2);color:var(--t2);border:0.5px solid var(--b2)">${escHtml(rowDivision(r))}</span>`}</td>`
      + `<td>${isAdmin()
          ? `<select onchange="changeRegion(${r.id},this.value)" style="font-size:10px;padding:2px 3px;border-radius:6px;border:0.5px solid ${teamColor(r.region)};background:var(--bg1);color:${teamColor(r.region)};max-width:78px" title="권역(팀) 이관"><option value="">미배정</option>${allTeams().map(function(t){return '<option value="'+t.id+'"'+(r.region===t.id?' selected':'')+'>'+escHtml(t.name.replace('팀',''))+'</option>'}).join('')}</select>`
          : `<span style="font-size:10px;padding:1px 5px;border-radius:99px;background:var(--bg2);color:${teamColor(r.region)};border:0.5px solid ${teamColor(r.region)}">${(teamName(r.region)||'—').replace('팀','')}</span>`}</td>`
      + `<td><span style="font-size:10px;padding:1px 5px;border-radius:99px;background:${phCol};color:${phTxt}">${phLabel}</span></td>`
      + `<td>${targetToggle}</td>`
      + `<td>${a1Html}</td>`
      + `<td>${a2h}</td>`
      + `<td><div style="display:flex;gap:3px;flex-wrap:wrap;align-items:center">`
      + `<span class="bdg ${st}" style="font-size:10px">${stL}</span>`
      + (!r.r2_enabled&&r.assign1&&!r.assign2?`<button class="btn s" onclick="enableR2(${r.id})" style="padding:2px 5px;font-size:10px;color:var(--ti)">2차</button>`:'')
      + `<button class="btn s" onclick="deleteDBRow(${r.id})" style="padding:2px 5px;font-size:10px;color:var(--td)">삭제</button>`
      + `</div></td></tr>`
  }).join('')
  console.log('[DB] 렌더 완료, tbody 길이:', tbodyNow.innerHTML.length)
  } catch(renderErr) {
    console.error('[DB] 렌더 에러:', renderErr.message, renderErr.stack)
    tbodyNow.innerHTML = '<tr><td colspan="10" style="text-align:center;padding:1rem;color:var(--td)">렌더 오류: '+renderErr.message+'</td></tr>'
  }

  // 페이지 컨트롤 렌더
  const pageCtrl = document.getElementById('db-page-ctrl')
  if(pageCtrl){
    const btnStyle = function(active){ return 'font-size:11px;padding:3px 9px;border-radius:var(--r1);border:0.5px solid '+(active?'var(--ti)':'var(--b2)')+';background:'+(active?'var(--ti)':'transparent')+';color:'+(active?'#fff':'var(--t2)')+';cursor:pointer' }
    const pbtn = function(p, label, active, disabled){
      if(disabled) return '<button disabled style="font-size:11px;padding:3px 9px;border-radius:var(--r1);border:0.5px solid var(--b3);background:transparent;color:var(--t3);cursor:default">'+label+'</button>'
      return '<button onclick="setDbPage('+p+')" style="'+btnStyle(active)+'">'+label+'</button>'
    }
    let pc = '<div style="display:flex;align-items:center;gap:6px;margin:8px 0 4px;flex-wrap:wrap">'
      + '<span style="font-size:12px;color:var(--t2)">총 ' + rows.length + '건</span>'
      + '<span style="font-size:11px;color:var(--t2);margin-left:6px">페이지당</span>'
      + '<select onchange="setDbPageSize(this.value)" style="font-size:11px;padding:3px 5px;border:0.5px solid var(--b2);border-radius:6px;background:var(--bg1);color:var(--t1)">'
      + [30,50,150].map(function(n){ return '<option value="'+n+'"'+(PAGE_SIZE===n?' selected':'')+'>'+n+'개</option>' }).join('')
      + '</select>'
      + '<div style="margin-left:auto;display:flex;gap:3px;flex-wrap:wrap;align-items:center">'
    if(!isAll && totalPages>1){
      pc += pbtn(dbPage-1, '‹', false, dbPage<=0)
      const win=2
      let start=Math.max(0,dbPage-win), end=Math.min(totalPages-1,dbPage+win)
      if(start>0){ pc += pbtn(0,'1',false,false); if(start>1) pc += '<span style="font-size:11px;color:var(--t3);padding:0 2px">…</span>' }
      for(let p=start;p<=end;p++) pc += pbtn(p, String(p+1), p===dbPage, false)
      if(end<totalPages-1){ if(end<totalPages-2) pc += '<span style="font-size:11px;color:var(--t3);padding:0 2px">…</span>'; pc += pbtn(totalPages-1, String(totalPages), false, false) }
      pc += pbtn(dbPage+1, '›', false, dbPage>=totalPages-1)
    }
    pc += '<button onclick="setDbPage(-1)" style="'+btnStyle(isAll)+'">전체</button>'
    pc += '</div></div>'
    pageCtrl.innerHTML = pc
  }

}
async function setAssign2(id,ma){
  if(!ma)return
  await sb.from('company_db').update({assign2:ma}).eq('id',id)
  const r=CACHE.db.find(x=>x.id===id);if(r)r.assign2=ma
  refreshDBTable()
}

async function toggleTarget(id, currentIsTarget){
  if(!hasPerm('db_exclude')){ alert('대상 Y/N(제외) 변경 권한이 없습니다. (기본: 사업부장 이상)'); return }
  const r = CACHE.db.find(x=>x.id===id)
  if(!r) return
  const newVal = !currentIsTarget
  const label = newVal ? '대상(Y)으로 변경' : '제외(N)로 변경'
  if(!confirm('"'+r.name+'"을 '+label+'하시겠습니까?')) return
  await sb.from('company_db').update({is_target: newVal}).eq('id', id)
  r.is_target = newVal
  refreshDBTable()
  renderAll()
}

// 사업부 이관 (남부↔중부). 현재 팀이 새 사업부 소속이 아니면 팀·담당 해제
async function changeDivision(id, val){
  if(!isAdmin()){ alert('사업부 이관은 관리자만 가능합니다.'); return }
  const r = CACHE.db.find(x=>x.id===id); if(!r) return
  if(rowDivision(r)===val){ return }
  const patch = { division: val }
  let clearMsg = ''
  if(r.region){
    const d = (ORG.divisions||[]).find(function(dv){ return dv.name===val || dv.name.indexOf(val)>=0 })
    const belongs = d && d.teams.some(function(t){ return t.id===r.region })
    if(!belongs){
      patch.region=''; patch.assign1=null; patch.assign2=null; patch.r2_enabled=false
      clearMsg = '\n(현재 팀이 '+val+' 소속이 아니므로 팀·담당 배정이 해제됩니다)'
    }
  }
  if(!confirm('"'+r.name+'"을(를) '+val+'사업부로 이관합니다.'+clearMsg)) { refreshDBTable(); return }
  const { error } = await sb.from('company_db').update(patch).eq('id', id)
  if(error){ alert('이관 실패: '+error.message); refreshDBTable(); return }
  Object.assign(r, patch)
  refreshDBTable(); if(typeof renderAll==='function') renderAll()
}

// 권역(팀) 이관. 팀 변경 시 담당 배정 해제(새 팀에서 재배정)
async function changeRegion(id, teamId){
  if(!isAdmin()){ alert('권역 이관은 관리자만 가능합니다.'); return }
  const r = CACHE.db.find(x=>x.id===id); if(!r) return
  if((r.region||'')===teamId){ return }
  const patch = { region: teamId }
  // 팀이 속한 사업부로 division 자동 정렬
  if(teamId){
    const d = (ORG.divisions||[]).find(function(dv){ return dv.teams.some(function(t){ return t.id===teamId }) })
    if(d){ patch.division = (d.name.indexOf('중부')>=0?'중부':d.name.indexOf('남부')>=0?'남부':d.name) }
  }
  // 기존 담당 해제 (새 팀에서 재배정)
  if(r.assign1 || r.assign2){ patch.assign1=null; patch.assign2=null; patch.r2_enabled=false }
  const toName = teamId ? (teamName(teamId)||'') : '미배정'
  if(!confirm('"'+r.name+'"을(를) ['+toName+'](으)로 이관합니다.'+((r.assign1||r.assign2)?'\n(기존 담당 배정은 해제됩니다 → 새 팀에서 재배정)':''))){ refreshDBTable(); return }
  const { error } = await sb.from('company_db').update(patch).eq('id', id)
  if(error){ alert('이관 실패: '+error.message); refreshDBTable(); return }
  Object.assign(r, patch)
  refreshDBTable(); if(typeof renderAll==='function') renderAll()
}

async function changeAssign1(id,ma){
  if(!ma)return
  const r=CACHE.db.find(x=>x.id===id)
  const prev = r&&r.assign1 ? r.assign1 : '미배정'
  // 즉시 저장 (드롭다운 선택 즉시 반영 — 별도 확인 불필요)
  await sb.from('company_db').update({assign1:ma}).eq('id',id)
  if(r)r.assign1=ma
  refreshDBTable()
  renderAll()
  // 하단에 작은 피드백 (alert 대신)
  const msg=document.getElementById('reassign-msg')
  if(msg){msg.style.color='var(--ts)';msg.textContent='✓ '+r.name+': '+prev+' → '+ma; setTimeout(()=>{if(msg.textContent.includes(r.name))msg.textContent=''},3000)}
}

// 담당 DB를 같은 팀의 활성 팀원들에게 균등 분배 (라운드로빈)
async function redistributeDBWithinTeam(ma, teamId){
  teamId = teamId || maTeam(ma)
  const team = teamId ? teamById(teamId) : null
  const a1rows = CACHE.db.filter(function(r){ return r.assign1===ma && r.is_target!==false })
  const a2rows = CACHE.db.filter(function(r){ return r.assign2===ma && r.is_target!==false })
  const total = a1rows.length + a2rows.length
  if(!total){ return 0 }
  const mates = (team ? team.members : []).filter(function(m){ return m!==ma && isActiveMa(m) })
  if(!mates.length){
    alert(ma+'님 담당 DB '+total+'건을 분배할 같은 팀의 활성 팀원이 없습니다.\n[DB관리] 탭에서 수동으로 이관해 주세요.')
    return 0
  }
  if(!confirm(ma+'님 담당 DB '+total+'건을 같은 팀원 '+mates.length+'명에게 균등 분배할까요?\n(1차 '+a1rows.length+'건 · 2차 '+a2rows.length+'건)\n\n특정 1명에게 몰아주려면 [취소] 후 DB관리 > 담당 MA 일괄 변경을 사용하세요.')) return 0
  let done=0
  for(let i=0;i<a1rows.length;i++){
    const to = mates[i % mates.length]
    try{ await sb.from('company_db').update({assign1:to}).eq('id',a1rows[i].id); a1rows[i].assign1=to; done++ }catch(e){}
  }
  for(let i=0;i<a2rows.length;i++){
    let cand = mates.filter(function(m){ return m!==a2rows[i].assign1 }) // 2차는 1차 담당과 다른 사람
    if(!cand.length) cand = mates
    const to = cand[i % cand.length]
    try{ await sb.from('company_db').update({assign2:to}).eq('id',a2rows[i].id); a2rows[i].assign2=to; done++ }catch(e){}
  }
  refreshDBTable(); if(typeof renderAll==='function') renderAll()
  alert('✓ '+ma+'님 담당 DB '+done+'건을 팀원 '+mates.length+'명에게 분배 완료')
  return done
}

function bindFileInput(){const inp=document.getElementById('csv-input');if(inp)inp.onchange=handleFile}
function handleFile(e){
  const file = e.target.files[0]; if(!file) return
  const ext = file.name.split('.').pop().toLowerCase()

  if(ext==='xlsx' || ext==='xls'){
    // ── 엑셀 파일 처리 (SheetJS) ──
    const reader = new FileReader()
    reader.onload = async function(ev){
      try{
        const data = new Uint8Array(ev.target.result)
        const wb = XLSX.read(data, {type:'array'})
        // 데이터 시트 자동 선택: '영업표지' 헤더가 있는 시트 우선 (전체목록 등), 없으면 최다행 시트
        function headerHas(sheetName, keys){
          const arr = XLSX.utils.sheet_to_json(wb.Sheets[sheetName], {header:1, defval:''})
          if(!arr.length) return false
          const hdr = arr[0].map(function(h){ return String(h).trim() })
          return keys.some(function(k){ return hdr.indexOf(k)>=0 })
        }
        let sheetName = wb.SheetNames.find(function(n){ return headerHas(n, ['영업표지','상호']) })
        if(!sheetName){
          // 헤더 매칭 실패 시: 행이 가장 많은 시트
          sheetName = wb.SheetNames.slice().sort(function(a,b){
            return (XLSX.utils.sheet_to_json(wb.Sheets[b],{header:1}).length) - (XLSX.utils.sheet_to_json(wb.Sheets[a],{header:1}).length)
          })[0] || wb.SheetNames[0]
        }
        const ws = wb.Sheets[sheetName]
        if(wb.SheetNames.length>1) console.log('[DB업로드] 선택 시트:', sheetName)
        // 1행=헤더, 2행부터 데이터 (header:1 = 배열 형태, 직접 row객체로 변환)
        const raw = XLSX.utils.sheet_to_json(ws, {header:1, defval:''})
        if(raw.length < 2){ alert('데이터가 없습니다. (2행부터 데이터가 있어야 합니다)'); return }
        const headers = raw[0].map(function(h){ return String(h).trim() })
        const dataRows = raw.slice(1)  // 2행부터
        const rowObjs = dataRows.map(function(row){
          const obj={}
          headers.forEach(function(h,i){ obj[h]=row[i]!==undefined?row[i]:'' })
          return obj
        })
        await processDBRows(rowObjs)
      }catch(err){ alert('엑셀 파싱 실패: '+err.message) }
    }
    reader.readAsArrayBuffer(file)
  } else {
    // ── CSV 파일 처리 (PapaParse) ──
    const reader = new FileReader()
    reader.onload = async function(ev){
      Papa.parse(ev.target.result, {header:true, skipEmptyLines:true, complete:async function(res){
        await processDBRows(res.data)
      }})
    }
    reader.readAsText(file, 'UTF-8')
  }
  // input 초기화 (같은 파일 재업로드 가능하게)
  e.target.value = ''
}

// CSV/엑셀 공통 파싱 로직
async function processDBRows(rawData){
  const rows = rawData.map(function(row){
    // 새 양식: 상호 | 영업표지 | 업종 | 제외여부 | 권역(사업부) | 권역(팀) | 가맹점수(업로딩) ...
    const brand = (row['상호']||row['본사명']||'').toString().trim()
    const name = (row['영업표지']||row['고객처(영업표지)']||row['고객처']||row['name']||brand||'').toString().trim()
    const industry = (row['업종']||row['업태']||'').toString().trim()
    const branches = parseInt(row['가맹점수(업로딩)']||row['가맹점수(업로딩 )']||row['가맹점수']||row['가맹점']||row['매장수']||0)
    const division = normDivision(row['권역(사업부)']||row['관할사업부']||row['사업부']||'')
    const regionTxt = (row['권역(팀)']||row['관할구역']||row['관할지역']||row['권역']||'').toString().trim()
    // 제외여부: 값이 있으면(Y/제외/O/1) 제외. 없으면 대상. (구 '대상' 컬럼도 호환: N이면 제외)
    let is_target = true
    if(row['제외여부']!==undefined && String(row['제외여부']).trim()!==''){
      const ex = String(row['제외여부']).trim().toUpperCase()
      is_target = !(ex==='Y'||ex==='제외'||ex==='O'||ex==='1'||ex==='TRUE'||ex==='있음')
    } else if(row['대상(Y/N)']!==undefined || row['대상']!==undefined){
      const t = String(row['대상(Y/N)']||row['대상']||'Y').trim().toUpperCase()
      is_target = (t==='Y'||t==='')
    }
    const r = regionTxt ? matchRegionToTeam(regionTxt) : ''  // 팀 미지정이면 빈값(나중에 배정)
    const b = isNaN(branches) ? 0 : branches
    const phase = calcPhase(b)
    return name ? {name, brand_name:brand||null, industry:industry||null, category:industry||null,
      branches:b, division, region:r, is_target, phase,
      phase_approved: phase===1,
      assign1:null, assign2:null, r2_enabled:false} : null
  }).filter(Boolean)

  if(!rows.length){ alert('유효한 데이터가 없습니다.\n헤더행(1행)과 데이터행(2행~)을 확인해주세요.'); return }

  // 기존 거래처 제외(N) 처리 보존
  const existingExcluded = new Set(
    CACHE.db.filter(function(r){ return r.is_target===false }).map(function(r){ return r.name })
  )
  // 영업표지(name) 기준 기존 거래처 맵
  const existingByName = new Map()
  CACHE.db.forEach(function(r){ if(!existingByName.has(r.name)) existingByName.set(r.name, r) })

  const updates = []   // 기존 거래처: 가맹점수/상호/업종 최신화 (담당자·이력 불변)
  const inserts = []   // 신규 거래처
  let unchangedCnt = 0
  rows.forEach(function(r){
    const ex = existingByName.get(r.name)
    if(ex){
      const patch = {}
      if((ex.branches||0) !== r.branches){ patch.branches = r.branches; patch.phase = calcPhase(r.branches) }
      if(r.brand_name && ex.brand_name !== r.brand_name) patch.brand_name = r.brand_name
      if(r.industry && ex.industry !== r.industry) patch.industry = r.industry
      if(Object.keys(patch).length){ updates.push({ id: ex.id, patch: patch, ref: ex }) }
      else unchangedCnt++
    } else {
      // 신규 → 기존 제외목록에 있던 이름이면 제외 유지
      if(existingExcluded.has(r.name)) r.is_target = false
      inserts.push(r)
    }
  })

  if(!updates.length && !inserts.length){
    alert('업로드할 변경 사항이 없습니다.\n(모든 거래처의 가맹점수·상호·업종이 기존과 동일)')
    return
  }

  // 1) 기존 거래처: 가맹점수·상호·업종만 최신화 (assign1/assign2/is_target/승인/이력 미변경)
  const _msg = document.getElementById('db-add-msg')
  const _prog = function(t){ if(_msg){ _msg.style.color='var(--t2)'; _msg.textContent=t } }
  let updatedCnt = 0
  const UB = 25
  for(let i=0;i<updates.length;i+=UB){
    const chunk = updates.slice(i,i+UB)
    _prog('기존 거래처 최신화 중... '+Math.min(i+UB,updates.length)+' / '+updates.length)
    const res = await Promise.all(chunk.map(function(u){
      return sb.from('company_db').update(u.patch).eq('id', u.id).then(function(r){ return {u:u, error:r.error} })
    }))
    res.forEach(function(x){ if(!x.error){ Object.assign(x.u.ref, x.u.patch); updatedCnt++ } else console.error('최신화 실패', x.u.id, x.error.message) })
  }

  // 2) 신규 거래처 삽입 (500건씩 청크 → 대용량 안전)
  let insertedCnt = 0
  const IB = 500
  for(let i=0;i<inserts.length;i+=IB){
    const chunk = inserts.slice(i,i+IB)
    _prog('신규 거래처 추가 중... '+Math.min(i+IB,inserts.length)+' / '+inserts.length)
    const { data, error } = await sb.from('company_db').insert(chunk).select()
    if(error){ alert('신규 거래처 업로드 중 오류(부분 반영됨): '+error.message+'\n('+insertedCnt+'건까지 추가됨)'); break }
    CACHE.db = [...CACHE.db, ...(data||[])]
    insertedCnt += (data||[]).length
  }
  if(_msg) _msg.textContent=''

  CACHE.db.sort(function(a,b){ return b.branches-a.branches })
  alert('업로드 완료\n\n· 신규 추가: '+insertedCnt+'건\n· 가맹점수 최신화: '+updatedCnt+'건\n· 변동 없음: '+unchangedCnt+'건\n\n※ 기존 거래처의 담당자·상담이력은 그대로 유지됩니다.')
  renderDBTab()
  renderAll()
}

// 배열 셔플 (Fisher-Yates)
function shuffle(arr){
  const a=[...arr]
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]] }
  return a
}

// 1차(가맹점 5개 이상) / 2차(미만) 할당 — 1차 우선
async function doAutoAssign(){
  const teams = allTeams()
  // 완료된 거래처 set (재배정 시 제외)
  const completedNames = new Set(CACHE.logs.map(function(l){ return l.company }))
  const poolFor = function(teamId, ph){
    return CACHE.db.filter(function(r){
      return r.region===teamId
        && !r.assign1          // 미배정
        && r.is_target!==false // 대상
        && calcPhase(r.branches||0)===ph
        && !completedNames.has(r.name)  // TM 미완료
    })
  }
  // 재배정 전용: assign1 있어도 TM 미완료면 재배정 풀에 포함
  const rePoolFor = function(teamId, ph){
    return CACHE.db.filter(function(r){
      return r.region===teamId
        && r.is_target!==false
        && calcPhase(r.branches||0)===ph
        && !completedNames.has(r.name)  // TM 미완료만
    })
  }
  // 업종 우선 정렬: MA의 주업종에 해당하는 브랜드를 앞으로
  const sortByCategory = function(pool, ma){
    const cats = getMaCategories(ma)
    if(!cats.length) return pool
    return pool.slice().sort(function(a,b){
      const aMatch = cats.indexOf(a.category||'') >= 0
      const bMatch = cats.indexOf(b.category||'') >= 0
      if(aMatch && !bMatch) return -1
      if(!aMatch && bMatch) return 1
      return 0
    })
  }

  // 차수별 미배정 존재 여부 (전체 팀 합산)
  const hasPhase = function(ph){ return teams.some(function(t){ return poolFor(t.id,ph).length>0 }) }
  const has1=hasPhase(1), has2=hasPhase(2), has3=hasPhase(3)
  if(!has1&&!has2&&!has3){ alert('할당할 미배정 대상이 없습니다.'); return }

  const p1=getPhaseProgress(1), p2=getPhaseProgress(2), p3=getPhaseProgress(3)

  // 할당할 차수 결정: 1차 우선, 그다음 승인된 팀이 하나라도 있는 차수
  const anyApproved = function(ph){ return teams.some(function(t){ return isPhaseApprovedByRegion(ph,t.id) }) }
  let targetPhase = 0
  if(has1) targetPhase=1
  else if(has2 && anyApproved(2)) targetPhase=2
  else if(has3 && anyApproved(3)) targetPhase=3

  let msg='📋 DB 할당 현황\n─────────────────\n'
  msg+='1차(10개↑): 전체 '+p1.total+'건 · TM완료 '+p1.done+'건 ('+p1.pct+'%)'+(p1.pct===100?' ✅':'')+'\n'
  msg+='2차(5~9개): 전체 '+p2.total+'건 · TM완료 '+p2.done+'건 ('+p2.pct+'%)'+(p2.pct===100?' ✅':'')+'\n'
  msg+='3차(4개↓): 전체 '+p3.total+'건 · TM완료 '+p3.done+'건 ('+p3.pct+'%)'+(p3.pct===100?' ✅':'')+'\n'
  msg+='─────────────────\n\n'

  if(targetPhase===0){
    const nextPh = !has1&&has2?2:3
    msg+='⚠ '+nextPh+'차 대상 할당은 팀별 승인이 필요합니다.\n진행현황 바에서 각 팀 "승인" 버튼을 먼저 눌러주세요.'
    alert(msg); return
  }

  // 팀별로 (1차는 무조건, 2·3차는 승인된 팀만) 풀 구성
  const teamPools = teams.map(function(t){
    const approved = (targetPhase===1) || isPhaseApprovedByRegion(targetPhase, t.id)
    const pool = approved ? poolFor(t.id, targetPhase) : []
    const active = t.members.filter(function(m){ return isActiveMa(m) })
    return { team:t, pool, active }
  }).filter(function(x){ return x.pool.length>0 })

  if(!teamPools.length){
    alert(targetPhase+'차 대상 중 승인되어 할당 가능한 건이 없습니다.\n팀별 승인 상태를 확인해주세요.')
    return
  }

  const totalCnt = teamPools.reduce(function(s,x){ return s+x.pool.length },0)
  msg+='→ '+targetPhase+'차 대상 '+totalCnt+'건을 랜덤 할당합니다.\n'
  msg+=teamPools.map(function(x){ return '  '+x.team.name+' '+x.pool.length+'건' }).join('\n')
  if(!confirm(msg)) return

  const updates=[]
  let skipNoMember=0
  teamPools.forEach(function(x){
    if(!x.active.length){ skipNoMember+=x.pool.length; return }  // 재직 MA 없는 팀은 건너뜀
    const sortedPool = sortByCategory(x.pool, x.active[0]||'')
    // 상호(brand_name)별로 묶어 한 명이 같은 상호의 영업표지를 모두 맡도록 배정
    const byBrand = new Map()
    const brandOrder = []
    shuffle(sortedPool).forEach(function(r){
      const key = (r.brand_name && r.brand_name.trim()) ? ('B:'+r.brand_name.trim()) : ('N:'+r.name)
      if(!byBrand.has(key)){ byBrand.set(key, []); brandOrder.push(key) }
      byBrand.get(key).push(r)
    })
    brandOrder.forEach(function(key, gi){
      const assignee = x.active[gi % x.active.length]
      byBrand.get(key).forEach(function(r){
        r.assign1 = assignee
        r.phase = targetPhase
        r.phase_approved = true
        updates.push({id:r.id, assign1:assignee, phase:targetPhase, phase_approved:true})
      })
    })
  })

  // 화면 즉시 반영 (CACHE 객체를 직접 갱신했으므로) → 저장은 병렬 배치로
  renderDBTab()
  const _msg = document.getElementById('db-add-msg')
  let saved=0
  const AB=25
  for(let i=0;i<updates.length;i+=AB){
    const chunk=updates.slice(i,i+AB)
    if(_msg){ _msg.style.color='var(--t2)'; _msg.textContent='배정 저장 중... '+Math.min(i+AB,updates.length)+' / '+updates.length }
    const res=await Promise.all(chunk.map(function(u){
      return sb.from('company_db').update({assign1:u.assign1,phase:u.phase,phase_approved:u.phase_approved}).eq('id',u.id).then(function(r){return r.error})
    }))
    res.forEach(function(e){ if(!e) saved++; else console.error('배정 저장 실패', e.message) })
  }
  if(_msg) _msg.textContent=''
  let done = targetPhase+'차 할당 완료: 총 '+updates.length+'건 (저장 '+saved+'건)\n'
    + teamPools.filter(function(x){return x.active.length}).map(function(x){ return x.team.name+' '+x.pool.length+'건' }).join(' · ')
  if(skipNoMember>0) done += '\n\n※ 재직 MA가 없는 팀의 '+skipNoMember+'건은 할당되지 않았습니다.'
  alert(done)
  renderDBTab()
  renderAll()
}

// 1차 대상 거래처의 TM 수행 완료 여부 (해당 거래처로 TM 기록이 1건 이상)

}

// 1차 완료율 계산 (하위호환 유지)
function getPhase1Progress(){ return getPhaseProgress(1) }

// 특정 차수 진행률 계산
function getPhaseProgress(ph){
  const list = CACHE.db.filter(r=>r.is_target!==false && calcPhase(r.branches||0)===ph)
  const done = list.filter(r=>_isPhase1Done(r)).length
  return {total:list.length, done, pct: list.length>0?Math.round(done/list.length*100):0}
}

function calcPhase(b){ return b>=10 ? 1 : b>=5 ? 2 : 3 }

// TM 내역에는 있으나 company_db에 없는 거래처 일괄 복구
async function recoverMissingCompanies(){
  // tm_logs의 거래처명 중 company_db에 없는 것 추출
  const dbNames = new Set(CACHE.db.map(function(r){ return r.name }))
  const logCompanies = {}
  CACHE.logs.forEach(function(l){
    if(l.company && !dbNames.has(l.company)){
      // 가장 최근 로그의 MA를 담당으로
      if(!logCompanies[l.company]) logCompanies[l.company] = l.ma_name
    }
  })
  const missing = Object.keys(logCompanies)
  if(!missing.length){ alert('복구할 누락 거래처가 없습니다.\nTM 내역의 모든 거래처가 DB에 존재합니다.'); return }

  if(!confirm('TM 내역에는 있으나 DB에 없는 거래처 '+missing.length+'건을 발견했습니다.\n\n'+missing.slice(0,10).join(', ')+(missing.length>10?' 외 '+(missing.length-10)+'건':'')+'\n\nDB에 복구하시겠습니까?')) return

  let success=0, fail=0
  for(const name of missing){
    const ma = logCompanies[name]
    const myTeam = maTeam(ma) || (allTeams()[0] && allTeams()[0].id) || 'east'
    const minRow = { name:name, branches:0, region:myTeam, is_target:true, assign1:ma }
    // 선택 컬럼 추가 시도
    const fullRow = Object.assign({}, minRow, { phase:3, phase_approved:true, source:'recovered', has_tm_history:true })
    let res = await sb.from('company_db').insert(fullRow).select().single()
    if(res.error){
      res = await sb.from('company_db').insert(minRow).select().single()
    }
    if(res.error){ fail++; console.error('[복구실패]', name, res.error.message) }
    else { CACHE.db.push(res.data); success++ }
  }
  alert('복구 완료\n성공: '+success+'건'+(fail>0?'\n실패: '+fail+'건 (콘솔 확인)':''))
  refreshDBTable()
}

// 제외(N) 처리 거래처 엑셀 추출
function exportExcluded(){
  const excluded = CACHE.db.filter(function(r){ return r.is_target===false })
  if(!excluded.length){ alert('제외(N) 처리된 거래처가 없습니다.'); return }
  // CSV 생성
  const headers = ['거래처명','가맹점수','관할구역','차수','1차담당','비고']
  const rows = excluded.map(function(r){
    const ph = calcPhase(r.branches||0)
    const phLabel = ph===1?'1차':ph===2?'2차':'3차'
    const region = teamName(r.region)||r.region||''
    return [
      '"'+(r.name||'').replace(/"/g,'""')+'"',
      r.branches||0,
      '"'+region+'"',
      phLabel,
      '"'+(r.assign1||'')+'"',
      '"제외(N)"'
    ].join(',')
  })
  const bom = '﻿'
  const csv = bom + headers.join(',') + '\n' + rows.join('\n')
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8'})
  const url = URL.createObjectURL(blob)
  const a = document.createElement('a')
  a.href = url
  a.download = 'TM_제외처리_거래처_'+new Date().toISOString().slice(0,10)+'.csv'
  a.click()
  URL.revokeObjectURL(url)
  alert('제외 거래처 '+excluded.length+'건 내보내기 완료')
}

// 가맹점수 기준으로 모든 거래처의 차수(phase) 재계산 + 저장
async function recalcPhases(){
  if(!isAdmin()){ alert('차수 재계산은 관리자 권한이 필요합니다.'); return }
  let changed=0
  const counts={1:0,2:0,3:0}
  for(const r of CACHE.db){
    const correct=calcPhase(r.branches||0)
    counts[correct]++
    if(r.phase!==correct){
      r.phase=correct
      await sb.from('company_db').update({phase:correct}).eq('id',r.id)
      changed++
    }
  }
  alert('차수 재계산 완료\n\n'
    +'1차(10개↑): '+counts[1]+'건\n'
    +'2차(5~9개): '+counts[2]+'건\n'
    +'3차(4개↓): '+counts[3]+'건\n\n'
    +'수정된 항목: '+changed+'건')
  renderDBTab()
  renderAll()
}

// 가맹점 수 수정 (관리자) — 수정 시 차수도 자동 재계산
// 거래처명(영업표지) 수정 — DB와 TM 이력의 고객사명을 함께 갱신 (담당자·상담내용 유지)
async function renameCompany(id){
  if(!isAdmin()){ alert('거래처명 변경은 관리자 권한이 필요합니다.'); return }
  const r = CACHE.db.find(x=>x.id===id); if(!r) return
  const nv = prompt('거래처명(영업표지)을 수정합니다.\n\n현재: '+r.name+'\n\n새 이름 입력:', r.name)
  if(nv===null) return
  const newName = nv.trim()
  if(!newName || newName===r.name) return
  if(CACHE.db.some(x=>x.id!==id && x.name===newName)){
    if(!confirm('"'+newName+'"은(는) 이미 있는 거래처명입니다. 그래도 변경하시겠습니까?')) return
  }
  const oldName = r.name
  const logCnt = CACHE.logs.filter(l=>l.company===oldName).length
  if(!confirm('"'+oldName+'"\n→ "'+newName+'"\n\n연결된 TM 이력 '+logCnt+'건의 고객사명도 함께 갱신됩니다.\n(담당자·상담내용은 그대로 유지)')) return
  const { error } = await sb.from('company_db').update({name:newName}).eq('id',id)
  if(error){ alert('변경 실패: '+error.message); return }
  r.name = newName
  if(logCnt>0){
    const { error:e2 } = await sb.from('tm_logs').update({company:newName}).eq('company',oldName)
    if(e2){ alert('DB 이름은 변경됐으나 TM 이력 갱신 실패: '+e2.message) }
    else CACHE.logs.forEach(l=>{ if(l.company===oldName) l.company=newName })
  }
  refreshDBTable(); if(typeof renderAll==='function') renderAll()
  alert('✓ 거래처명 변경 완료 (TM 이력 '+logCnt+'건 갱신)')
}

async function editBranches(id){
  if(!isAdmin()){ alert('가맹점 수 수정은 관리자 권한이 필요합니다.'); return }
  const r = CACHE.db.find(x=>x.id===id)
  if(!r) return
  const input = prompt('"'+r.name+'"의 가맹점 수를 입력하세요.', r.branches||0)
  if(input===null) return
  const n = parseInt(input)
  if(isNaN(n) || n<0){ alert('0 이상의 숫자를 입력해주세요.'); return }
  const newPhase = calcPhase(n)
  const phaseChanged = newPhase !== r.phase
  await sb.from('company_db').update({branches:n, phase:newPhase}).eq('id',id)
  r.branches = n
  r.phase = newPhase
  refreshDBTable()
  renderDBTab()
  renderAll()
  if(phaseChanged){
    const phLbl={1:'1차(10개↑)',2:'2차(5~9개)',3:'3차(4개↓)'}
    setTimeout(function(){ alert('가맹점 수 '+n+'개로 변경 → '+phLbl[newPhase]+'로 자동 분류되었습니다.') }, 100)
  }
}

// MA가 DB에 없는 거래처를 TM한 경우, 신규 등록 + 본인 배정
// 반환: 추가된 DB 레코드 | null(취소)
async function promptAddNewCompany(name, ma){
  const ok = confirm('"'+name+'"은(는) DB에 없는 거래처입니다.\n\n신규 거래처로 등록하고 TM 기록을 진행하시겠습니까?\n(등록 후 본인 담당으로 배정됩니다)')
  if(!ok) return null

  // 가맹점 수 입력 (선택 — 모르면 0)
  const bInput = prompt('"'+name+'"의 가맹점 수를 입력하세요.\n(모르면 비워두거나 0 입력 — 나중에 관리자가 수정 가능)', '')
  if(bInput===null) return null
  const branches = parseInt(bInput) || 0

  // 권역(팀) 선택 — 본인 팀으로 기본 배정
  const myTeam = maTeam(ma) || (allTeams()[0] && allTeams()[0].id) || 'east'
  const phase = calcPhase(branches)

  const newRow = {
    name: name,
    branches: branches,
    region: myTeam,
    is_target: true,
    phase: phase,
    phase_approved: true,   // 본인이 이미 접촉했으므로 승인 처리
    assign1: ma,            // 본인 담당으로 배정
    assign2: null,
    r2_enabled: false,
    source: 'ma_added'      // MA가 추가했음을 표시 (관리자 검수용)
  }

  let { data, error } = await sb.from('company_db').insert(newRow).select().single()

  // 컬럼 누락 등으로 실패 시: 핵심 컬럼만으로 단계적 재시도
  if(error){
    console.warn('[신규등록] 1차 실패:', error.message)
    // 선택적 컬럼들을 하나씩 제거하며 재시도
    const optionalCols = ['source','phase','phase_approved','r2_enabled','assign2']
    let retryRow = Object.assign({}, newRow)
    optionalCols.forEach(function(c){ delete retryRow[c] })
    const retry = await sb.from('company_db').insert(retryRow).select().single()
    if(retry.error){
      // 최소 컬럼(name, branches, region, is_target, assign1)만으로 최종 재시도
      const minRow = { name:name, branches:branches, region:myTeam, is_target:true, assign1:ma }
      const last = await sb.from('company_db').insert(minRow).select().single()
      if(last.error){ alert('등록 실패: '+last.error.message); return null }
      CACHE.db.push(last.data)
      return last.data
    }
    CACHE.db.push(retry.data)
    return retry.data
  }
  CACHE.db.push(data)
  return data
}

// 해당 차수 승인 여부 (phase_approved 또는 1차는 기본 true)
function isPhaseApproved(ph){

  return CACHE.db.some(r=>r.is_target!==false && calcPhase(r.branches||0)===ph && r.phase_approved===true)

// transfer_requests 테이블 재사용: req_type='phase', company='ph|teamId' 형태로 저장
let PHASE_REQS = []   // 대기 중인 차수 승인 신청 캐시
function _pendingPhaseReq(ph, region){

async function loadPhaseReqs(){

async function requestPhase(ph, region){
  const t = teamById(region)
  const phLabel = {1:'1차(10개↑)',2:'2차(5~9개)',3:'3차(4개↓)'}
  const prevPh = ph-1
  const prevProg = prevPh>=1 ? getPhaseProgressByRegion(prevPh, region) : {done:0,total:0,pct:100}
  let msg = '📋 ['+(t?t.name:region)+'] '+phLabel[ph]+' 승인 신청\n\n'
  if(prevPh>=1){
    msg += phLabel[prevPh]+' 진행률: '+prevProg.done+'/'+prevProg.total+'건 ('+prevProg.pct+'%)\n'
    msg += prevProg.pct<100 ? '⚠ 이전 차수가 완료되지 않았습니다.\n' : '✅ 이전 차수 완료\n'
  }
  msg += '\n관리자에게 승인을 신청합니다. 승인 후 배정이 가능합니다.'
  if(!confirm(msg)) return
  const { error } = await sb.from('transfer_requests').insert({
    req_type:'phase',
    company: 'phase:'+ph+'|'+region,
    from_ma: (t?t.name:region), to_ma: ph+'차 승인',
    reason: (prevPh>=1 ? (phLabel[prevPh]+' 진행률 '+prevProg.pct+'%') : '1차 승인 신청'),
    requested_by: (REAL_USER && REAL_USER.name) || (CURRENT_USER && CURRENT_USER.name) || ''
  })
  if(error){ alert('신청 실패: '+error.message); return }
  await loadPhaseReqs()
  alert('차수 승인 신청이 접수되었습니다. 관리자 승인 후 반영됩니다.')
  renderDBTab()
}
// 승인 취소(원복): 해당 권역·차수를 미승인 상태로 되돌림
async function revertPhase(ph, region){
  if(!isRealAdmin()){ alert('승인 취소는 관리자만 가능합니다.'); return }
  const t = teamById(region)
  const label = (t?t.name:region)+' '+ph+'차'
  const list = CACHE.db.filter(function(r){
    if(r.is_target===false) return false
    if(calcPhase(r.branches||0)!==ph) return false
    if(region!=='all' && r.region!==region) return false
    return true
  })
  if(!confirm('['+label+'] 승인을 취소하고 미승인 상태로 되돌립니다.\n\n대상 '+list.length+'건\n※ 이미 배정된 담당자와 TM 기록은 그대로 유지되며, 추가 배정만 차단됩니다.\n계속할까요?')) return
  let fail = 0
  for(const r of list){
    const { error } = await sb.from('company_db').update({ phase_approved:false }).eq('id', r.id)
    if(error) fail++; else r.phase_approved = false
  }
  alert('['+label+'] 승인 취소 완료 ('+(list.length-fail)+'건'+(fail?' / 실패 '+fail:'')+')')
  renderDBTab()
}
// 관리자: 차수 승인 신청 처리
async function decidePhaseReq(id, approve){
  if(!isRealAdmin()){ alert('관리자만 처리할 수 있습니다.'); return }
  const req = PHASE_REQS.find(function(r){ return String(r.id)===String(id) })
  if(!req || req.status!=='pending'){ alert('이미 처리된 신청입니다.'); await loadPhaseReqs(); renderAdminTab(); return }
  const parts = String(req.company||'').replace('phase:','').split('|')
  const ph = parseInt(parts[0],10), region = parts[1]
  if(!confirm((approve?'승인':'거절')+'하시겠습니까?\n\n'+(req.from_ma||region)+' '+ph+'차')) return
  if(approve){
    const list = CACHE.db.filter(function(r){
      if(r.is_target===false) return false
      if(calcPhase(r.branches||0)!==ph) return false
      if(region!=='all' && r.region!==region) return false
      return true
    })
    for(const r of list){
      await sb.from('company_db').update({ phase:ph, phase_approved:true }).eq('id', r.id)
      r.phase = ph; r.phase_approved = true
    }
  }
  await sb.from('transfer_requests').update({

    decided_by: (REAL_USER && REAL_USER.name) || (CURRENT_USER && CURRENT_USER.name) || '',
    decided_at: new Date().toISOString()
  }).eq('id', id)

  renderAdminTab()
  if(approve) reRenderActive()
}

async function approvePhase(ph, region){
  if(!region) region='all'
  const phLabel = {1:'1차(10개↑)',2:'2차(5~9개)',3:'3차(4개↓)'}
  const regionLabel = region==='east'?'동부':region==='west'?'서부':'전체'
  const prevPh = ph-1

  // 이전 차수 진행률 (같은 권역)
  const prevProg = prevPh>=1 ? getPhaseProgressByRegion(prevPh, region) : {done:0,total:0,pct:100}
  // 승인할 대상 목록
  const thisList = CACHE.db.filter(function(r){
    if(r.is_target===false) return false
    if(calcPhase(r.branches||0)!==ph) return false
    if(region!=='all' && r.region!==region) return false
    return true
  })

  let msg='📋 ['+regionLabel+'] '+phLabel[ph]+' TM 승인\n\n'
  if(prevPh>=1){
    msg+=phLabel[prevPh]+' 진행률('+regionLabel+'): '
      +prevProg.done+'/'+prevProg.total+'건 ('+prevProg.pct+'%)\n'
    msg+= prevProg.pct<100 ? '⚠ 이전 단계가 완료되지 않았습니다.\n' : '✅ 이전 단계 완료!\n'
  }
  msg+='\n['+regionLabel+'] '+phLabel[ph]+' 대상 총 '+thisList.length+'건을 TM 진행 승인합니다.'
  if(!confirm(msg)) return

  const updates = thisList.map(function(r){ return {id:r.id, phase:ph, phase_approved:true} })
  for(const u of updates){
    await sb.from('company_db').update({phase:u.phase, phase_approved:true}).eq('id',u.id)
    const r=CACHE.db.find(function(x){return x.id===u.id})
    if(r){r.phase=u.phase; r.phase_approved=true}
  }
  // 동일 권역·차수의 대기 신청이 있으면 함께 승인 처리
  const _pr = PHASE_REQS.find(function(r){ return r.status==='pending' && r.company===('phase:'+ph+'|'+region) })
  if(_pr){
    await sb.from('transfer_requests').update({ status:'approved',
      decided_by:(REAL_USER&&REAL_USER.name)||(CURRENT_USER&&CURRENT_USER.name)||'', decided_at:new Date().toISOString() }).eq('id',_pr.id)
    await loadPhaseReqs()
  }
  alert('['+regionLabel+'] '+ph+'차 TM 승인 완료! ('+updates.length+'건)\n이제 랜덤 할당 버튼으로 MA에게 배분하세요.')
  renderDBTab()
}

// 권역별 차수 진행률
function getPhaseProgressByRegion(ph, region){
  const list = CACHE.db.filter(function(r){
    if(r.is_target===false) return false
    if(calcPhase(r.branches||0)!==ph) return false
    if(region!=='all' && r.region!==region) return false
    return true
  })
  const done = list.filter(function(r){ return _isPhase1Done(r) }).length
  return {total:list.length, done, pct:list.length>0?Math.round(done/list.length*100):0}
}

// 권역별 승인 여부
function isPhaseApprovedByRegion(ph, region){
  if(ph===1) return true
  return CACHE.db.some(function(r){
    if(r.is_target===false) return false
    if(calcPhase(r.branches||0)!==ph) return false
    if(region!=='all' && r.region!==region) return false
    return r.phase_approved===true
  })
}

// ── 누적 현황 ──
// ══════════ 기간별 TM 퍼널 요약 (일/주/월 × MA/팀/사업부 단위 × MA 단독 × 달력) ══════════
// 열: TM건수 → 응답·부재·거절 → 응답률 → 종결·보류·추가상담 → 종결률 → 제안서
// · '문자' 통화결과는 TM건수에만 포함 · 주 = 월~금 근무일 주 · 팀 판정 = 조직 기준(resolveRowTeamId)
// · 단위(직급 게이트): MA=팀장 이상(리더는 본인 팀만 펼침) / 팀=전 직급 / 사업부=전체 열람 권한
// · MA 단독 선택 시 해당 MA 한 행만 표시 · 날짜는 달력(date input)으로 직접 지정 가능
function fnYmd(dt){ return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0') }
function funnelRange(){
  const mode = window.CUM_FN_MODE || 'day'
  const a = window.CUM_FN_ANCHOR || CUR_DATE
  const dt = new Date(a+'T00:00:00')
  if(mode==='range'){
    let f = window.CUM_FN_FROM || a, t = window.CUM_FN_TO || a
    if(f > t){ const tmp=f; f=t; t=tmp }   // 순서 뒤집힘 보정
    const fd = new Date(f+'T00:00:00'), td = new Date(t+'T00:00:00')
    return { from:f, to:t, label:(fd.getMonth()+1)+'/'+fd.getDate()+' ~ '+(td.getMonth()+1)+'/'+td.getDate() }
  }
  if(mode==='day') return { from:a, to:a, label: fmtD(a) }
  if(mode==='week'){
    const dow = dt.getDay()
    const mon = new Date(dt); mon.setDate(dt.getDate() + (dow===0 ? -6 : 1-dow))
    const fri = new Date(mon); fri.setDate(mon.getDate()+4)
    return { from: fnYmd(mon), to: fnYmd(fri),
      label: (mon.getMonth()+1)+'/'+mon.getDate()+'(월) ~ '+(fri.getMonth()+1)+'/'+fri.getDate()+'(금)' }
  }
  const ym = a.slice(0,7), y = +ym.split('-')[0], m = +ym.split('-')[1]
  const last = new Date(y, m, 0).getDate()
  return { from: ym+'-01', to: ym+'-'+String(last).padStart(2,'0'), label: y+'년 '+m+'월' }
}
// 퍼널 기준일의 월을 상단 월 선택(그래프 포함)에 동기 — 캠페인 월 목록에 있는 달만
function _syncCumMonthToFunnel(){
  const mode = window.CUM_FN_MODE || 'day'
  if(mode==='range') return   // 임의 구간은 월 개념이 없으므로 유지
  const ym = (window.CUM_FN_ANCHOR || CUR_DATE).slice(0,7)
  if(window.CUM_MONTH !== ym && campaignMonths().indexOf(ym) >= 0) window.CUM_MONTH = ym
}
function setCumFnMode(m){
  window.CUM_FN_MODE = m
  if(m==='range'){   // 기간 모드 진입 시 기본 범위: 기준일 포함 최근 7일
    const a = window.CUM_FN_ANCHOR || CUR_DATE
    if(!window.CUM_FN_TO) window.CUM_FN_TO = a
    if(!window.CUM_FN_FROM){ const d=new Date(a+'T00:00:00'); d.setDate(d.getDate()-6); window.CUM_FN_FROM = fnYmd(d) }
  }
  _syncCumMonthToFunnel()
  renderCum()
}
function setCumFnUnit(u){ window.CUM_FN_UNIT = u; renderCum() }
function setCumFnMa(v){ window.CUM_FN_MA = v; renderCum() }
function setCumFnAnchor(v){ if(v) window.CUM_FN_ANCHOR = v; _syncCumMonthToFunnel(); renderCum() }
function setCumFnFrom(v){ if(v) window.CUM_FN_FROM = v; renderCum() }
function setCumFnTo(v){ if(v) window.CUM_FN_TO = v; renderCum() }
function shiftCumFn(dir){
  const mode = window.CUM_FN_MODE || 'day'
  if(mode==='range'){   // 범위 길이만큼 앞뒤 이동
    const rg = funnelRange()
    const len = Math.round((new Date(rg.to+'T00:00:00')-new Date(rg.from+'T00:00:00'))/86400000)+1
    const f = new Date(rg.from+'T00:00:00'); f.setDate(f.getDate()+len*dir)
    const t = new Date(rg.to+'T00:00:00');   t.setDate(t.getDate()+len*dir)
    window.CUM_FN_FROM = fnYmd(f); window.CUM_FN_TO = fnYmd(t)
    renderCum(); return
  }
  const dt = new Date((window.CUM_FN_ANCHOR || CUR_DATE)+'T00:00:00')
  if(mode==='day'){ do{ dt.setDate(dt.getDate()+dir) }while(dt.getDay()===0 || dt.getDay()===6) }
  else if(mode==='week'){ dt.setDate(dt.getDate()+7*dir) }
  else { dt.setDate(1); dt.setMonth(dt.getMonth()+dir) }
  window.CUM_FN_ANCHOR = fnYmd(dt)
  _syncCumMonthToFunnel()
  renderCum()
}

function renderCum(){
  const allMonths = campaignMonths()       // 캠페인 시작월~현재월
  const years = campaignYears()

  // 기본 선택월: 현재월(캠페인 범위 내), 없으면 마지막 달
  if(!window.CUM_MONTH || allMonths.indexOf(window.CUM_MONTH)<0){
    const cur = mo(CUR_DATE)
    window.CUM_MONTH = allMonths.indexOf(cur)>=0 ? cur : allMonths[allMonths.length-1]
  }
  const selMonth = window.CUM_MONTH
  const selYear = selMonth.split('-')[0]

  // ── 그래프 범위 선택 (전체 / 사업부별) ──
  const _visDivs = cumBaseDivisions()

    })
    h += '</div>'
  }
  h += renderPeriodFunnel()   // 기간별 TM 퍼널 요약 (일/주/월 × 단위 × MA단독 × 달력)
  h += renderDailyChart(monthDates, selMonth, selTeam)

    dv.teams.forEach(function(t){
    const code=t.id, label=t.name, members=t.members
    h += '<div style="font-size:13px;font-weight:500;color:var(--t1);margin-bottom:.6rem;padding-bottom:.4rem;border-bottom:0.5px solid var(--b3)">'+label+' ('+members.length+'명)</div>'
    h += '<div class="cug" style="margin-bottom:1.25rem">'
    // 소속 사업부 TM 시작일 (시작일 이전 날짜는 집계·표시에서 '대상 아님' 처리)
    const _divStart = dv.startDate || null
    members.forEach(function(m){
      let total=0,ach=0,workDays=0
      monthDates.forEach(function(d){
        if(_divStart && d < _divStart) return   // 사업부 시작일 이전 → 집계 제외
        const q=mq(m,d); if(q===0) return
        workDays++; const c=logs4(m,d).length; total+=c; if(c>=q) ach++
      })
      const r2cnt=CACHE.db.filter(function(r){return r.assign2===m}).length
      const dots=monthDates.map(function(d){
        if(_divStart && d < _divStart) return '<span class="sd" style="background:transparent;border:0.5px dashed var(--b3);opacity:.55" title="'+d+': 시작일('+_divStart+') 이전"></span>'
        const q=mq(m,d)

        const c=logs4(m,d).length
        const col=c>q?'#F59E0B':c>=q?'#1D9E75':c>0?'#BA7517':'rgba(0,0,0,.15)'

        + '<div class="cut">'+teamName(code)+'</div>'
        + '<div class="cus"><div class="cu"><div class="cuv">'+total+'</div><div class="cul">누적 TM</div></div>'
        + '<div class="cu"><div class="cuv">'+ach+'/'+workDays+'</div><div class="cul">달성일수</div></div>'
        + '<div class="cu"><div class="cuv">'+(workDays>0?Math.round(ach/workDays*100):0)+'%</div><div class="cul">달성률</div></div></div>'
        + '<div class="sw">'+dots+'</div></div>'
    })

    })

  document.getElementById('tab-cum').innerHTML=h
  // innerHTML로 삽입된 SVG는 인라인 이벤트가 동작 안함

// 해당 월(YYYY-MM)의 평일(근무일) 목록
function workdaysOfMonth(ym){
  const [y,m] = ym.split('-').map(Number)
  const dim = new Date(y, m, 0).getDate()
  const arr = []
  for(let d=1; d<=dim; d++){
    const ds = y+'-'+String(m).padStart(2,'0')+'-'+String(d).padStart(2,'0')
    if(isWorkday(ds)) arr.push(ds)
  }
  return arr
}

// 캠페인 시작월 (이 월 이전은 누적현황에서 제외)
function campaignStartMonth(){
  return mo(CAMPAIGN_START)  // 예: '2026-06'
}

// 캠페인 시작월부터 현재월까지의 YYYY-MM 배열 (과거→현재순)
function campaignMonths(){
  const start = campaignStartMonth()          // '2026-06'
  const [sy,sm] = start.split('-').map(Number)
  const now = new Date(CUR_DATE+'T00:00:00')
  const ey = now.getFullYear(), em = now.getMonth()+1
  const arr = []
  let y=sy, m=sm
  while(y<ey || (y===ey && m<=em)){
    arr.push(y+'-'+String(m).padStart(2,'0'))
    m++; if(m>12){ m=1; y++ }
  }
  return arr
}

// 캠페인 기간에 포함된 연도 목록
function campaignYears(){
  const months = campaignMonths()
  const years = []
  months.forEach(function(ym){
    const y = ym.split('-')[0]
    if(years.indexOf(y)<0) years.push(y)
  })
  return years
}

// 일자별 TM 막대 그래프 (동부/서부 스택 + 할당 목표선)
function renderDailyChart(dates, ym, scope){
  if(!scope) scope='all'
  if(!dates.length){
    return '<div class="chart-wrap"><div class="chart-empty">'+parseInt(ym.split('-')[1])+'월에는 캠페인 근무일이 없습니다.</div></div>'
  }
  const allVis = cumBaseDivisions()
  // 표시할 팀: 전체=모든 보이는 사업부의 팀, 특정 사업부=그 사업부의 팀
  const teams=[]
  allVis.forEach(function(d){
    if(scope!=='all' && d.id!==scope) return
    d.teams.forEach(function(t){ teams.push({id:t.id, name:t.name, divId:d.id, div:d}) })
  })
  const palette = ['#3B82C4','#E8943A','#16a34a','#9333ea','#dc2626','#0891b2','#ca8a04','#db2777']
  const teamColorMap = {}
  teams.forEach(function(t,i){ teamColorMap[t.id]=palette[i%palette.length] })
  const dowKr=['일','월','화','수','목','금','토']
  // 일자별 팀별 집계 (시작 전 사업부 팀은 0)
  const daily = dates.map(function(d){
    const per={}; let tot=0, totQ=0
    teams.forEach(function(t){
      if(!divStarted(t.div,d)){ per[t.id]=0; return }
      let c=0
      teamMembers(t.id).forEach(function(m){ const q=mq(m,d); if(q>0){ c+=logs4(m,d).length; totQ+=q } })
      per[t.id]=c; tot+=c
    })
    return { d, per, tot, totQ }
  })
  const monTot = daily.reduce(function(s,x){return s+x.tot},0)
  const monQ   = daily.reduce(function(s,x){return s+x.totQ},0)
  const rate   = monQ>0?Math.round(monTot/monQ*100):0
  const W=680, H=200, padL=32, padR=12, padT=16, padB=40
  const gW=W-padL-padR, gH=H-padT-padB
  const n=daily.length
  let maxVal=1
  daily.forEach(function(x){ teams.forEach(function(t){ maxVal=Math.max(maxVal,x.per[t.id]||0) }) })
  function px(i){ return padL+(n<=1?gW/2:(i/(n-1))*gW) }
  function py(v){ return padT+gH-(v/maxVal)*gH }
  const yMid=Math.ceil(maxVal/2)
  let svgAxes=[0,yMid,maxVal].map(function(v){
    const y=py(v)
    return '<line x1="'+padL+'" y1="'+y+'" x2="'+(W-padR)+'" y2="'+y+'" stroke="var(--b3)" stroke-width="0.5" stroke-dasharray="3,3"/>'
           +'<text x="'+(padL-4)+'" y="'+(y+4)+'" font-size="9" fill="var(--t2)" text-anchor="end">'+v+'</text>'
  }).join('')
  let weekLines=''
  daily.forEach(function(x,i){
    const dt=new Date(x.d+'T00:00:00')
    if(dt.getDay()===1 && i>0){ const wx=px(i); weekLines+='<line x1="'+wx+'" y1="'+padT+'" x2="'+wx+'" y2="'+(padT+gH)+'" stroke="var(--b2)" stroke-width="1" stroke-dasharray="4,2" opacity="0.6"/>' }
  })
  let xLabels=''
  daily.forEach(function(x,i){
    const dt=new Date(x.d+'T00:00:00'),dow=dt.getDay()
    const col=dow===0?'#c0392b':dow===6?'#2980b9':'var(--t2)'
    xLabels+='<text x="'+px(i)+'" y="'+(H-20)+'" font-size="8" fill="'+col+'" text-anchor="middle">'+dt.getDate()+'</text>'
             +'<text x="'+px(i)+'" y="'+(H-10)+'" font-size="7" fill="'+col+'" text-anchor="middle">('+dowKr[dow]+')</text>'
  })
  function bd(i){ return teams.map(function(t){ return t.name+':'+(daily[i].per[t.id]||0) }).join('|') }
  function makeLine(tid, color){
    const values=daily.map(function(x){ return x.per[tid]||0 })
    if(!values.some(function(v){return v>0})) return ''
    const pts=values.map(function(v,i){return px(i)+','+py(v)}).join(' ')
    const dots=values.map(function(v,i){
      const dt=new Date(daily[i].d+'T00:00:00')
      return '<circle class="chart-dot" cx="'+px(i)+'" cy="'+py(v)+'" r="5" fill="'+color+'"'
             +' data-label="'+daily[i].d+' ('+dowKr[dt.getDay()]+')"'
             +' data-breakdown="'+bd(i)+'" data-tot="'+daily[i].tot+'"'
             +' style="cursor:pointer"/>'
    }).join('')
    return '<polyline points="'+pts+'" fill="none" stroke="'+color+'" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" opacity="0.9"/>'+dots
  }
  let lines='', legendHtml=''
  teams.forEach(function(t){ lines+=makeLine(t.id, teamColorMap[t.id]); legendHtml+='<span><span class="lgd-box" style="background:'+teamColorMap[t.id]+'"></span>'+escHtml(t.name)+'</span>' })
  const teamLabel = scope==='all' ? '전체' : ((allVis.find(function(d){return d.id===scope})||{}).name||'전체')
  const svgChart='<div style="position:relative">'
    +'<svg viewBox="0 0 '+W+' '+H+'" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:220px;overflow:visible">'
    +svgAxes+weekLines+lines+xLabels+'</svg>'
    +'<div id="chart-tooltip" style="display:none;position:fixed;background:var(--bg1);border:0.5px solid var(--b2);border-radius:var(--r1);padding:8px 12px;font-size:12px;box-shadow:0 4px 12px rgba(0,0,0,.15);pointer-events:none;z-index:9999;min-width:130px"></div>'
    +'</div>'
  return '<div class="chart-wrap">'
    +'<div class="chart-title">'
    +'<span>📈 '+parseInt(ym.split('-')[1])+'월 일자별 TM 실적 · '+teamLabel+'</span>'
    +'<span class="chart-legend">'+legendHtml+'</span>'
    +'</div>'
    +svgChart
    +'<div class="chart-summary">'
    +'<div><b>'+monTot+'</b><span class="lbl">월 누적 TM</span></div>'
    +'<div><b>'+monQ+'</b><span class="lbl">월 누적 목표</span></div>'
    +'<div><b>'+rate+'%</b><span class="lbl">월 달성률</span></div>'
    +'<div><b>'+dates.length+'</b><span class="lbl">근무일수</span></div>'
    +'</div>'
    +'</div>'
}


// SVG innerHTML 삽입 후 chart-dot에 이벤트 직접 바인딩
function bindChartDots(){
  const dots = document.querySelectorAll('.chart-dot')
  if(!dots.length) return
  dots.forEach(function(el){
    // 기존 리스너 중복 방지
    el.removeEventListener('mouseenter', _chartDotEnter)
    el.removeEventListener('mouseleave', _chartDotLeave)
    el.addEventListener('mouseenter', _chartDotEnter)
    el.addEventListener('mouseleave', _chartDotLeave)
    // 모바일: touchstart
    el.removeEventListener('touchstart', _chartDotTouch)
    el.addEventListener('touchstart', _chartDotTouch, {passive:true})
  })
}
function _chartDotEnter(e){ showChartTip(e, this) }
function _chartDotLeave(){ hideChartTip() }
function _chartDotTouch(e){
  e.preventDefault && e.preventDefault()
  showChartTip(e.touches?e.touches[0]:e, this)
  setTimeout(hideChartTip, 2000)
}

// 그래프 툴팁 표시/숨김
function showChartTip(e, el){
  const tip=document.getElementById('chart-tooltip'); if(!tip) return
  const label=el.getAttribute('data-label')
  const breakdown=(el.getAttribute('data-breakdown')||'')
  const tot=el.getAttribute('data-tot')
  let html='<div style="font-weight:600;color:var(--t1);margin-bottom:4px">'+label+'</div>'
  breakdown.split('|').filter(Boolean).forEach(function(seg){
    const kv=seg.split(':'); html+='<div style="color:var(--t2)">'+kv[0]+': '+(kv[1]||'0')+'건</div>'
  })
  html+='<div style="border-top:0.5px solid var(--b3);margin-top:4px;padding-top:4px;font-weight:600;color:var(--t1)">합계: '+tot+'건</div>'
  tip.innerHTML=html
  tip.style.display='block'
  const x=e.clientX, y=e.clientY
  const iw=window.innerWidth
  tip.style.left=(x+140>iw?(x-150):(x+12))+'px'
  tip.style.top=(y-10)+'px'
}
function hideChartTip(){
  const tip=document.getElementById('chart-tooltip'); if(tip) tip.style.display='none'
}

function promptCustomMQModal() {
  const val = prompt('할당할 TM 건수를 입력하세요 (1~999):', '4');
  if(val === null) return;
  const num = parseInt(val, 10);
  if(isNaN(num) || num < 1 || num > 999) {
    alert('1에서 999 사이의 숫자를 입력해주세요.');
    return;
  }
  setMQModal(num);
}

async function setMQModal(v){
  const date=CUR_DATE
  const existing=CACHE.quotas.find(q=>q.ma_name===mMA&&q.quota_date===date)
  // 휴무 토글: 이미 휴무면 1건으로 복구
  if(v===0 && existing && existing.quota===0) v=1
  if(existing){
    await sb.from('ma_quotas').update({quota:v}).eq('ma_name',mMA).eq('quota_date',date)
    existing.quota=v
  }else{
    const{data}=await sb.from('ma_quotas').insert({ma_name:mMA,quota_date:date,quota:v}).select().single()
    if(data)CACHE.quotas.push(data)
  }
  renderTeam((mMA && maTeam(mMA)) || (allTeams()[0]||{}).id || 'west')
}

function renderEL(logs){
  const el=document.getElementById('el');if(!el)return
  if(!logs.length){el.innerHTML='';return}
  let h=`<div style="border-top:0.5px solid var(--b3);margin:.75rem 0;padding-top:.75rem"><div style="font-size:12px;color:var(--t2);margin-bottom:8px">기록된 TM (${logs.length}건)</div>`
  logs.forEach(function(l,i){
    const crCls=l.consult_result==='종결'?'종결':'추가상담'
    const callBadge = l.call_result ? '<span class="pill '+l.call_result+'">'+l.call_result+'</span>' : ''
    const crBadge = l.consult_result ? '<span class="pill '+crCls+'" title="클릭하면 상담결과를 변경합니다" style="cursor:pointer" onclick="quickChangeResult(&apos;'+l.id+'&apos;,event)">'+(l.consult_result==='추가상담'?'추가상담':l.consult_result)+'</span>' : '<span class="pill 추가상담" title="클릭하면 상담결과를 지정합니다" style="cursor:pointer;opacity:.55" onclick="quickChangeResult(&apos;'+l.id+'&apos;,event)">결과지정</span>'
    const consultDiv = l.consult_detail ? '<div class="lcons">'+l.consult_detail+'</div>' : ''
    const actionDiv = l.action_plan ? '<div class="lap">→ '+l.action_plan+'</div>' : ''
    h+='<div class="lc '+crCls+'">'
      +'<div class="lh"><span class="lco">'+(l.company||'—')+'</span>'
      +'<div class="lb">'+callBadge+' '+crBadge
      +'<button onclick="openEditLog(&apos;'+l.id+'&apos;)" style="font-size:11px;padding:2px 9px;border-radius:99px;border:0.5px solid var(--b2);background:transparent;color:var(--t2);cursor:pointer;font-family:var(--font);font-weight:500">수정</button>'
      +'<button onclick="delLog(&apos;'+l.id+'&apos;)" style="font-size:11px;padding:2px 9px;border-radius:99px;border:1px solid var(--td);background:transparent;color:var(--td);cursor:pointer;font-family:var(--font);font-weight:500">기록 삭제</button></div></div>'
      +'<div class="lmg">'
      +'<div class="lmi">거래업체 <strong>'+(l.current_partner||'—')+'</strong></div>'
      +'<div class="lmi">수수료율 <strong>'+(l.fee_rate||'—')+'</strong></div>'
      +'<div class="lmi">연락처 <strong>'+(maskPhone(l.ceo_contact)||'—')+'</strong></div>'
      +'</div>'+consultDiv+actionDiv+'</div>'
  })
  h+=`</div>`;el.innerHTML=h
}

async function delLog(id){
  await sb.from('tm_logs').delete().eq('id',id)
  CACHE.logs=CACHE.logs.filter(l=>l.id!==id)
  renderEL(logs4(mMA,CUR_DATE))
  reRenderActive()
}

async function saveLog(){
  const co=document.getElementById('f-co').value.trim(),cp=document.getElementById('f-cp').value.trim(),fr=document.getElementById('f-fr').value.trim(),ct=document.getElementById('f-ct').value.trim(),rs=document.getElementById('f-rs').value,cd=document.getElementById('f-cd').value.trim(),cr=document.getElementById('f-cr').value
  if(!co||!ct||!rs||!cd||!cr){alert('고객사명, 연락처, 통화결과, 상담내역, 상담결과는 필수입니다.');return}
  let _dbMatch=CACHE.db.find(r=>r.name===co)
  if(!_dbMatch){
    const _added = await promptAddNewCompany(co, mMA)  // ma → mMA (모달의 현재 MA)
    if(!_added) return
    _dbMatch = _added
  } else if(_dbMatch.is_target===false){
    alert('"'+co+'"은(는) TM 제외(N) 처리된 거래처입니다. 관리자에게 문의해주세요.'); return
  }
  const _tmSeq = await getTmSeqForCompany(co)
  const rec={log_date:CUR_DATE,ma_name:mMA,team:maTeam(mMA)||null,division:maDivisionName(mMA),company:co,current_partner:cp,partner_type:document.getElementById('f-ptype')?.value||null,fee_rate:fr,ceo_contact:ct,call_result:rs,consult_detail:cd,consult_result:cr,proposal_sent:document.getElementById('f-ps')?.checked||false,action_plan:document.getElementById('f-ac').value.trim(),recontract_at:document.getElementById('f-recontract')?.value||null,tm_seq:_tmSeq}
  const{data,error}=await insertTmLog(rec)
  if(error){alert('저장 실패: '+error.message);return}
  CACHE.logs.unshift(data)
  ;['f-co','f-cp','f-fr','f-ct','f-ac','f-cd'].forEach(id=>document.getElementById(id).value='')
  document.getElementById('f-rs').value='';document.getElementById('f-cr').value=''
  const _rc=document.getElementById('f-recontract'); if(_rc) _rc.value=''
  const _pt=document.getElementById('f-ptype'); if(_pt) _pt.value=''
  const _ps=document.getElementById('f-ps'); if(_ps) _ps.checked=false
  if(typeof onPartnerType==='function') onPartnerType('f')
  renderEL(logs4(mMA,CUR_DATE));reRenderActive()
}

function setDivStartDate(divId, val){
  if(!isAdmin()){ alert('조직 관리는 관리자 권한이 필요합니다.'); return }
  const div = ORG.divisions.find(function(d){return d.id===divId}); if(!div) return
  div.startDate = val || ''
  saveOrg(); refreshOrgDerived()
}
// 인력 상태 관리 사업부 토글
function setStaffDiv(v){ window.STAFF_DIV = v; renderStaff() }
// 팀장 지정
function setTeamLeader(divId, teamId, name){
  if(!isAdmin()){ alert('조직 관리는 관리자 권한이 필요합니다.'); return }
  const div = ORG.divisions.find(function(d){return d.id===divId}); if(!div) return
  const t = div.teams.find(function(tm){return tm.id===teamId}); if(!t) return
  t.leader = name || ''
  saveOrg(); refreshOrgDerived(); renderStaff()
}
function addDivision(){
  if(!isAdmin()){ alert('조직 관리는 관리자 권한이 필요합니다.'); return }
  const name = prompt('새 사업부 이름을 입력하세요.')
  if(!name||!name.trim()) return
  ORG.divisions.push({ id:'div_'+Date.now(), name:name.trim(), teams:[] })
  saveOrg(); refreshOrgDerived(); renderStaff()
}
function renameDivision(divId){
  const div = ORG.divisions.find(function(d){return d.id===divId}); if(!div) return
  const name = prompt('사업부 이름 변경', div.name)
  if(!name||!name.trim()) return
  div.name = name.trim(); saveOrg(); renderStaff()
}
function deleteDivision(divId){
  const div = ORG.divisions.find(function(d){return d.id===divId}); if(!div) return
  const maCount = div.teams.reduce(function(s,t){return s+t.members.length},0)
  if(!confirm('"'+div.name+'" 사업부를 삭제하시겠습니까?\n소속 '+div.teams.length+'팀 · '+maCount+'명도 함께 제거됩니다.\n(TM 기록은 보존됩니다)')) return
  ORG.divisions = ORG.divisions.filter(function(d){return d.id!==divId})
