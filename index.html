function addMember(divId,teamId){
  if(!isAdmin()){ alert('조직 관리는 관리자 권한이 필요합니다.'); return }
  const name = prompt('추가할 영업사원(MA) 이름을 입력하세요.')
  if(!name||!name.trim()) return
  const nm = name.trim()
  if(allTeams().some(function(t){return t.members.indexOf(nm)>=0})){
    alert('"'+nm+'"은 이미 등록된 MA입니다.'); return
  }
  ORG.divisions.forEach(function(d){ d.teams.forEach(function(t){ if(t.id===teamId) t.members.push(nm) }) })
  saveOrg(); refreshOrgDerived(); renderStaff()
}
function removeMember(divId,teamId,ma){
  const r = prompt('"'+ma+'" 처리 사유를 선택하세요.\n\n1 = 부서이동\n2 = 퇴직\n3 = 완전 삭제(조직에서만 제거, 상태 미기록)\n\n번호 입력:')
  if(r===null) return
  const today = (new Date()).toISOString().slice(0,10)
  if(r==='1'){ MA_STATUS[ma]={ status:'transferred', date:today, note:(MA_STATUS[ma]&&MA_STATUS[ma].note)||'부서이동' } }
  else if(r==='2'){ MA_STATUS[ma]={ status:'resigned', date:today, note:(MA_STATUS[ma]&&MA_STATUS[ma].note)||'퇴직' } }
  else if(r==='3'){ if(MA_STATUS[ma]) delete MA_STATUS[ma] }
  else { alert('1, 2, 3 중에서 입력해주세요.'); return }
  // 조직 멤버에서 제거 (TM 이력·상태는 보존 → 필터에 "(부서이동)/(퇴직)/(이력)"로 표시)
  ORG.divisions.forEach(function(d){ d.teams.forEach(function(t){ if(t.id===teamId) t.members=t.members.filter(function(m){return m!==ma}) }) })
  saveOrg(); saveMaStatus(); refreshOrgDerived(); renderStaff()
  // 담당 DB 팀 내 분배 제안 (제거 전 팀 기준)
  const hasDb = CACHE.db.some(function(x){ return (x.assign1===ma||x.assign2===ma) && x.is_target!==false })
  if(hasDb && (r==='1'||r==='2')) redistributeDBWithinTeam(ma, teamId)
}
function moveMemberPrompt(ma){
  const teams = allTeams()
  const cur = maTeam(ma)
  const opts = teams.filter(function(t){return t.id!==cur}).map(function(t,i){ return (i+1)+'. '+t.divName+' > '+t.name })
  if(!opts.length){ alert('이동할 다른 팀이 없습니다.'); return }
  const sel = prompt(ma+'을(를) 이동할 팀 번호를 입력하세요.\n\n'+opts.join('\n'))
  if(sel===null) return
  const idx = parseInt(sel)-1
  const targetTeams = teams.filter(function(t){return t.id!==cur})
  if(isNaN(idx)||idx<0||idx>=targetTeams.length){ alert('올바른 번호를 입력해주세요.'); return }
  const target = targetTeams[idx]
  // 현재 팀에서 제거 후 대상 팀에 추가
  ORG.divisions.forEach(function(d){ d.teams.forEach(function(t){
    t.members = t.members.filter(function(m){return m!==ma})
    if(t.id===target.id) t.members.push(ma)
  })})
  saveOrg(); refreshOrgDerived(); renderStaff()
}

// ── 팀 표시 진단 & 복구 (관리자) ──
// TM 내역에서 팀이 잘못 보이는 원인을 진단하고, 저장된 team 값을 조직 기준으로 일괄 복구
function teamDiagPanelHtml(){
  const logs = CACHE.logs || []
  // 담당 MA 이름이 어느 팀에도 속하지 않는 기록 (조직에 그 사람이 없음)
  const orphan = new Set()
  // 저장된 team 값이 조직상 소속 팀과 다른 기록 수 (DB 복구 대상)
  let mismatch = 0
  logs.forEach(function(l){
    const tid = maTeam(l.ma_name)
    if(!tid){ if(l.ma_name) orphan.add(l.ma_name); return }
    if(l.team !== tid) mismatch++
  })
  const teamList = allTeams().map(function(t){ return t.name+'('+(t.members||[]).length+')' }).join(', ') || '없음'
  const orphanList = Array.from(orphan)
  let h = '<div class="pn" style="margin-bottom:1.5rem;border:0.5px solid var(--b2)">'
  h += '<div class="pnt"><i class="ti ti-stethoscope" style="font-size:15px"></i>팀 표시 진단</div>'
  h += '<div style="font-size:12px;color:var(--t2);line-height:1.7">'
  h += '현재 조직 팀: <strong style="color:var(--t1)">'+escHtml(teamList)+'</strong><br>'
  h += 'TM 기록 총 '+logs.length+'건 중 저장된 팀 값이 조직과 다른 기록: <strong style="color:'+(mismatch?'#BA7517':'#1D9E75')+'">'+mismatch+'건</strong>'
  h += '</div>'
  if(orphanList.length){
    h += '<div style="font-size:12px;color:#A32D2D;background:#FBEAEA;padding:8px 10px;border-radius:var(--r1);margin-top:8px;line-height:1.6">'
      + '⚠ 조직 어느 팀에도 없는 담당자 '+orphanList.length+'명 → 이 사람들의 기록은 팀이 정확히 표시되지 않습니다.<br>'
      + '<strong>해결:</strong> 아래 조직 관리에서 해당 팀에 이 이름들을 구성원으로 추가한 뒤 저장하세요.<br>'
      + '대상: '+orphanList.map(escHtml).join(', ')
      + '</div>'
  }
  if(mismatch){
    h += '<div style="margin-top:10px"><button class="btn s p" onclick="repairLogTeams()">'
      + '저장된 팀 값 '+mismatch+'건 조직 기준으로 복구</button>'
      + '<span style="font-size:11px;color:var(--t2);margin-left:8px">TM 내역 표시는 이미 조직 기준으로 자동 계산되지만, DB 값도 맞추려면 실행하세요.</span></div>'
  }
  h += '</div>'
  return h
}
async function repairLogTeams(){
  if(!isRealAdmin()){ alert('관리자만 실행할 수 있습니다.'); return }
  const targets = (CACHE.logs||[]).filter(function(l){
    const tid = maTeam(l.ma_name)
    return tid && l.team !== tid
  })
  if(!targets.length){ alert('복구할 기록이 없습니다.'); return }
  if(!confirm(targets.length+'건의 team 값을 조직 기준으로 일괄 업데이트합니다.\n계속할까요?')) return
  let okCnt = 0, fail = 0
  for(const l of targets){
    const tid = maTeam(l.ma_name)
    const { error } = await sb.from('tm_logs').update({ team: tid }).eq('id', l.id)
    if(error){ fail++; console.error('복구 실패 id=', l.id, error.message) }
    else { l.team = tid; okCnt++ }
  }
  alert('복구 완료: '+okCnt+'건 성공'+(fail?(' / '+fail+'건 실패(권한/RLS 확인)'):''))
  reRenderActive()
}

  const note   = document.getElementById(`st-note-${ma}`)?.value || ''
  MA_STATUS[ma] = { status, date, note }
  saveMaStatus()
  renderStaff()
  if(status !== 'active'){
    const dbAssigned = CACHE.db.filter(r=>(r.assign1===ma||r.assign2===ma)&&r.is_target!==false)
    if(dbAssigned.length>0){
      if(confirm(`${ma}님 담당 본사 DB가 ${dbAssigned.length}건 있습니다.\n같은 팀원에게 균등 분배할까요?\n\n[취소] 시 DB관리 탭에서 직접 변경하거나 인수인계 버튼을 사용하세요.`)){
        redistributeDBWithinTeam(ma, maTeam(ma))
      }
    }
  }
}

function openHandover(fromMA, team){
  const followUps = CACHE.logs.filter(l=>l.ma_name===fromMA&&l.consult_result==='추가상담')
  const dbAssigned = CACHE.db.filter(r=>r.assign1===fromMA||r.assign2===fromMA)
  const activeMembers = teamMembers(team).filter(m=>m!==fromMA&&isActiveMa(m))

  let h=`<div class="mot">인수인계 — ${fromMA}</div>
  <div class="mos" style="margin-bottom:1rem">추가 상담진행 ${followUps.length}건 · 배정 DB ${dbAssigned.length}건</div>

  <div style="background:var(--bgi);border-radius:var(--r1);padding:10px 12px;margin-bottom:12px;font-size:12px;color:var(--ti)">
    📋 TM 기록은 삭제되지 않고 <strong>${fromMA}</strong> 이름으로 영구 보존됩니다.<br>
    인수인계는 <strong>배정 DB 담당자 변경</strong>과 <strong>추가상담 메모 이전</strong>만 진행합니다.
  </div>

  <div class="fs"><div class="fst">인수 담당자 선택</div>
  <div class="frow"><label class="flbl">인계받을 MA <span class="req">*</span></label>
    <select id="hv-to" style="width:100%">
      <option value="">선택하세요</option>
      ${activeMembers.map(m=>`<option value="${m}">${m}</option>`).join('')}
      ${allTeams().reduce((a,t)=>a.concat(t.members),[]).filter(m=>m!==fromMA&&isActiveMa(m)&&!activeMembers.includes(m)).map(m=>`<option value="${m}">${m} (타팀)</option>`).join('')}
    </select>
  </div></div>

  <div class="fs"><div class="fst">추가 상담진행 건 (${followUps.length}건)</div>`

  if(followUps.length>0){
    followUps.slice(0,10).forEach(l=>{
      h+=`<div style="display:flex;align-items:center;gap:8px;padding:4px 0;border-bottom:0.5px solid var(--b3)">
        <input type="checkbox" id="hv-log-${l.id}" checked style="width:14px;height:14px;flex-shrink:0">
        <div style="flex:1;min-width:0">
          <div style="font-size:12px;font-weight:500">${l.company}</div>
          <div style="font-size:11px;color:var(--t2)">${l.log_date} · ${l.consult_detail?.slice(0,40)||''}${(l.consult_detail?.length||0)>40?'...':''}</div>
        </div>
      </div>`
    })
    if(followUps.length>10) h+=`<div style="font-size:11px;color:var(--t2);padding:4px 0">+${followUps.length-10}건 더...</div>`
  } else {
    h+=`<div style="font-size:12px;color:var(--t2)">추가 상담진행 건이 없습니다.</div>`
  }
  h+=`</div>`

  if(dbAssigned.length>0){
    h+=`<div class="fs"><div class="fst">배정 DB (${dbAssigned.length}건) — 담당자도 함께 변경</div>
    <div style="display:flex;align-items:center;gap:6px;margin-bottom:6px">
      <input type="checkbox" id="hv-db-all" checked style="width:14px;height:14px">
      <label for="hv-db-all" style="font-size:12px;color:var(--t2)">전체 DB 담당자 변경</label>
    </div>`
    dbAssigned.slice(0,5).forEach(r=>{
      h+=`<div style="font-size:12px;color:var(--t2);padding:2px 0">${r.name} (${r.branches}개점) · ${r.assign1===fromMA?'1차':'2차'} 담당</div>`
    })
    if(dbAssigned.length>5) h+=`<div style="font-size:11px;color:var(--t2)">+${dbAssigned.length-5}건 더</div>`
    h+=`</div>`
  }

  h+=`<div class="fa">
    <button class="btn" onclick="closeModal()">취소</button>
    <button class="btn p" onclick="execHandover('${fromMA}','${team}')">인수인계 실행</button>
  </div>`

  document.getElementById('moc').innerHTML=h
  document.getElementById('mov').classList.add('open')
}

async function execHandover(fromMA, team){
  const toMA = document.getElementById('hv-to')?.value
  if(!toMA){ alert('인계받을 MA를 선택해주세요.'); return }
  if(!confirm(`${fromMA} → ${toMA} 인수인계를 진행하시겠습니까?`)) return

  let done=0, errors=[]

  const doDbChange = document.getElementById('hv-db-all')?.checked
  if(doDbChange){
    const dbAssigned = CACHE.db.filter(r=>r.assign1===fromMA||r.assign2===fromMA)
    for(const r of dbAssigned){
      try{
        if(r.assign1===fromMA){
          await sb.from('company_db').update({assign1:toMA}).eq('id',r.id)
          r.assign1=toMA
        }
        if(r.assign2===fromMA){
          await sb.from('company_db').update({assign2:toMA}).eq('id',r.id)
          r.assign2=toMA
        }
        done++
      }catch(e){ errors.push(r.name) }
    }
  }

  closeModal()
  alert('인수인계 완료!\nDB 담당자 변경: '+done+'건'+(errors.length>0?'\n실패: '+errors.join(', '):''))
  renderStaff()
  renderAll()
}

// ── 실시간 구독 (다른 사람이 저장하면 자동 반영) ──
function setupRealtime(){
  sb.channel('tm-realtime')
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'tm_logs'},payload=>{
      if(!CACHE.logs.find(l=>l.id===payload.new.id))CACHE.logs.unshift(payload.new)
      setSyncBadge('ok','✓ 실시간 동기화')
      reRenderActive()
    })
    .on('postgres_changes',{event:'DELETE',schema:'public',table:'tm_logs'},payload=>{
      CACHE.logs=CACHE.logs.filter(l=>l.id!==payload.old.id)
      reRenderActive()
    })
    .subscribe()
}

// 페이지 로드 완료 후 Supabase 초기화 및 데이터 로드
document.addEventListener("DOMContentLoaded", function(){
  loadMaStatus()
  // 저장된 내 이름 복원
  try{ window.MY_MA_NAME = localStorage.getItem('my_ma_name') || '' }catch(e){ window.MY_MA_NAME='' }
  if(window.MY_MA_NAME) window.LAST_QUICK_MA = window.MY_MA_NAME
  function initSb(){
    if(typeof supabase !== 'undefined'){
      const { createClient } = supabase
      sb = createClient(SUPABASE_URL, SUPABASE_KEY, {
        auth: {
          // 브라우저를 닫으면 세션이 사라져 → 다시 켤 때 재로그인 필요
          storage: window.sessionStorage,
          persistSession: true,
          autoRefreshToken: true,
          detectSessionInUrl: true
        }
      })
      let _booted = false
      function _boot(id){
        if(_booted) return
        _booted = true
        loadAll().then(function(){
          applyKakaoIdentity(id)
          setupRealtime()
        })
      }
      // 이미 로그인된 경우 + 카카오에서 막 돌아온 경우 모두 처리
      gateAuth(_boot)
      sb.auth.onAuthStateChange(function(){ gateAuth(_boot) })
    } else {
      setTimeout(initSb, 50)
    }
  }
  initSb()
})
</script>
