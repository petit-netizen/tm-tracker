function isWorkday(ds){const dt=new Date(ds+'T00:00:00'),d=dt.getDay();return d!==0&&d!==6&&!KR_HOLIDAYS.has(ds)}
function hName(ds){return HNAMES[ds]||null}

// ── 핵심 유틸 함수 (변수 선언 전에 위치) ──
function td(){return new Date().toISOString().slice(0,10)}
function mo(d){return d.slice(0,7)}

// ── 캐시 (매 페이지에서 DB 재조회 최소화) ──
let CACHE = { logs: [], quotas: [], db: [], loaded: false }
let CUR_DATE = td()
let CAL_MONTH = { all: mo(td()), east: mo(td()), west: mo(td()) }
function fmtD(d){const dt=new Date(d+'T00:00:00');return `${dt.getMonth()+1}월 ${dt.getDate()}일 (${['일','월','화','수','목','금','토'][dt.getDay()]})`}
function fmtM(ym){const[y,m]=ym.split('-');return `${y}년 ${parseInt(m)}월`}

function setSyncBadge(state, msg){
  const el=document.getElementById('sync-badge')
  el.className='sync-status '+state
  el.textContent=msg
}

// ── Supabase 데이터 로드 ──
async function loadAll(){
  setSyncBadge('loading','불러오는 중...')
  try{
    const [logsRes, quotasRes, dbRes] = await Promise.all([
      sb.from('tm_logs').select('*').order('log_date',{ascending:false}),
      sb.from('ma_quotas').select('*'),
      sb.from('company_db').select('*').order('branches',{ascending:false})
    ])
    if(logsRes.error||quotasRes.error||dbRes.error) throw new Error('조회 오류')
    CACHE.logs = logsRes.data || []
    CACHE.quotas = quotasRes.data || []
    CACHE.db = dbRes.data || []
    CACHE.loaded = true
    setSyncBadge('ok','✓ 연결됨')
    reRenderActive()
  }catch(e){
    setSyncBadge('err','⚠ 연결 실패 — Supabase Key를 확인하세요')
    console.error(e)
    reRenderActive()  // 실패해도 UI는 표시
  }
}

function reRenderActive(){
  const active=document.querySelector('.tb.active')?.textContent
  if(active==='전체')renderAll()
  else if(active==='동부팀')renderTeam('east')
  else if(active==='서부팀')renderTeam('west')
  else if(active==='누적 현황')renderCum()
  else if(active==='TM 내역')renderTMLog()
}

// ── 캐시 헬퍼 ──
function logs4(ma,date){return CACHE.logs.filter(l=>l.ma_name===ma&&l.log_date===date)}
function mq(ma,date){const q=CACHE.quotas.find(q=>q.ma_name===ma&&q.quota_date===date);return q?q.quota:1}
function teamMembers(t){return t==='east'?EAST:WEST}
function tdAch(team,date){return teamMembers(team).filter(m=>logs4(m,date).length>=mq(m,date)).length}
function tdTot(team){return teamMembers(team).length}

function showTab(t){
  document.querySelectorAll('.tb').forEach((b,i)=>b.classList.toggle('active',['all','east','west','cum','tmlog'][i]===t))
  document.querySelectorAll('.sec').forEach(s=>s.classList.remove('active'))
  document.getElementById('tab-'+t).classList.add('active')
  if(t==='all')renderAll()
  if(t==='east')renderTeam('east')
  if(t==='west')renderTeam('west')
  if(t==='cum')renderCum()
  if(t==='tmlog')renderTMLog()
}

// ── 달력 HTML ──
function calHtml(team,selDate){
  if(!CAL_MONTH||!CAL_MONTH[team]){if(!CAL_MONTH)CAL_MONTH={all:mo(td()),east:mo(td()),west:mo(td())};else CAL_MONTH[team]=mo(td());}
  const ym=CAL_MONTH[team],[yr,mo2]=ym.split('-').map(Number)
  const dim=new Date(yr,mo2,0).getDate(),today=td()
  // 1일의 요일 (0=일 ~ 6=토) → 월 기준 offset (월=0)
  const firstDow=new Date(yr,mo2-1,1).getDay() // 0=일,1=월,...,6=토
  const offsetMon=firstDow===0?6:firstDow-1    // 월요일 기준 앞 빈칸 수
  const workdayCount=[...Array(dim)].filter((_,i)=>{
    const ds=`${yr}-${String(mo2).padStart(2,'0')}-${String(i+1).padStart(2,'0')}`
    return isWorkday(ds)
  }).length
  let h=`<div class="cs"><div class="ch">
    <button class="db" onclick="chgCalMo('${team}',-1)">&#8249;</button>
    <span class="ct">${fmtM(ym)} <span style="font-size:11px;color:var(--t2);font-weight:400">평일 ${workdayCount}일</span></span>
    <button class="db" onclick="chgCalMo('${team}',1)">&#8250;</button>
  </div><div class="cg7">`
  // 요일 헤더 월~일
  ['월','화','수','목','금','토','일'].forEach(d=>{
    const isSun=d==='일',isSat=d==='토'
    h+=`<div class="cdw" style="${isSun?'color:#A32D2D':isSat?'color:#185FA5':''}">${d}</div>`
  })
  // 1일 전 빈칸
  for(let i=0;i<offsetMon;i++) h+=`<div class="cl empty"></div>`
  // 모든 날짜 순회
  for(let d=1;d<=dim;d++){
    const ds=`${yr}-${String(mo2).padStart(2,'0')}-${String(d).padStart(2,'0')}`
    const dt=new Date(ds+'T00:00:00'),dow=dt.getDay() // 0=일,6=토
    const isWeekend=dow===0||dow===6
    const isHol=KR_HOLIDAYS.has(ds)
    const isOff=isWeekend||isHol
    const hn=hName(ds)
    const isSun=dow===0,isSat=dow===6
    if(isOff){
      // 공석 셀 — 날짜만 흐리게, 내용 없음
      let offStyle='background:var(--bg2);border-color:transparent;cursor:default;'
      let dayColor=isSun?'color:#f09595':isSat?'color:#85b7eb':'color:#f09595'
      h+=`<div class="cl" style="${offStyle}">
        <div class="cd" style="opacity:.5;${dayColor}">${d}</div>
        ${hn?`<div class="hl-lbl" style="opacity:.7">${hn}</div>`:''}
      </div>`
    } else {
      // 평일 셀
      const isToday=ds===today,isSel=ds===selDate
      const eA=tdAch('east',ds),eT=tdTot('east'),wA=tdAch('west',ds),wT=tdTot('west')
      const eR=eA/eT,wR=wA/wT
      const eDot=eA>0?(eA>=eT?'#1D9E75':eR>.5?'#5DCAA5':'#BA7517'):'rgba(0,0,0,.18)'
      const wDot=wA>0?(wA>=wT?'#1D9E75':wR>.5?'#5DCAA5':'#BA7517'):'rgba(0,0,0,.18)'
      const eVC=eA>=eT?'#1D9E75':eA>0?'#BA7517':'var(--t2)'
      const wVC=wA>=wT?'#1D9E75':wA>0?'#BA7517':'var(--t2)'
      h+=`<div class="cl${isToday?' today':''}${isSel?' sel':''}" onclick="selDate('${ds}','${team}')">
        <div class="cd">${d}</div>${hn?`<div class="hl-lbl">${hn}</div>`:''}
        <div class="ctr">
          <div class="ctrow"><div class="ctd" style="background:${eDot}"></div><span class="ctl">동부</span><span class="ctv" style="color:${eVC}">${eA}/${eT}</span></div>
          <div class="ctrow"><div class="ctd" style="background:${wDot}"></div><span class="ctl">서부</span><span class="ctv" style="color:${wVC}">${wA}/${wT}</span></div>
        </div></div>`
    }
  }
  h+=`</div><div class="cl-leg"><span><div class="ds" style="background:#1D9E75"></div>전원</span><span><div class="ds" style="background:#5DCAA5"></div>과반</span><span><div class="ds" style="background:#BA7517"></div>일부</span><span><div class="ds" style="background:rgba(0,0,0,.18)"></div>미시작</span><span style="color:var(--t2)">▪ 흐린 셀: 주말/공휴일</span></div></div>`
  return h
}

  ;['east','west'].forEach(team=>{
    const tms=teamMembers(team);let tQ2=0,tD=0,tF=0
    tms.forEach(m=>{const q=mq(m,date),c=logs4(m,date).length;tQ2+=q;tD+=Math.min(c,q);if(c>=q)tF++})

    tms.forEach(m=>{const q=mq(m,date),c=logs4(m,date).length,pct=Math.min(c/q,1);const bc=c>=q?'#1D9E75':c>0?'#BA7517':'var(--b3)';h+=`<div style="display:flex;align-items:center;gap:8px;padding:3px 0"><span style="font-size:12px;width:52px;flex-shrink:0">${m}</span><div class="pw" style="flex:1"><div class="pp" style="width:${Math.round(pct*100)}%;background:${bc}"></div></div><span style="font-size:11px;color:var(--t2);width:30px;text-align:right">${c}/${q}</span></div>`})
    h+=`</div>`
  })
  h+=`</div>`+dbPanelHtml()
  document.getElementById('tab-all').innerHTML=h
  bindFileInput()
}

// ── 팀 탭 ──
function renderTeam(team){
  const date=CUR_DATE,members=teamMembers(team);let tQ=0,tD=0,tF=0
  members.forEach(m=>{const q=mq(m,date),c=logs4(m,date).length;tQ+=q;tD+=Math.min(c,q);if(c>=q)tF++})
  const isH=!isWorkday(date)
  let h=`<div class="dn"><button class="db" onclick="chgDate(-1,'${team}')">&#8249;</button><span class="dl">${fmtD(date)}${isH?` <span style="font-size:11px;color:var(--td)">${hName(date)||'주말/공휴일'}</span>`:''}</span><button class="db" onclick="chgDate(1,'${team}')">&#8250;</button></div>
  <div class="sr"><div class="sc"><div class="sl">팀 할당</div><div class="sv">${tQ}건</div></div><div class="sc"><div class="sl">달성 TM</div><div class="sv">${tD}건</div></div><div class="sc"><div class="sl">달성 MA</div><div class="sv">${tF}명</div></div><div class="sc"><div class="sl">달성률</div><div class="sv">${tQ>0?Math.round(tD/tQ*100):0}%</div></div></div>`
  h+=calHtml(team,date)
  h+=`<div class="stl">${team==='east'?'동부팀 (8명)':'서부팀 (9명)'} MA 현황</div><div class="mg">`
  members.forEach(m=>{
    const q=mq(m,date),cnt=logs4(m,date).length,pct=Math.min(cnt/q,1)
    const bc=cnt>=q?'#1D9E75':cnt>0?'#BA7517':'var(--b3)',sc=cnt>=q?'done':cnt>0?'partial':'none'
    const assigned=CACHE.db.filter(r=>r.assign1===m||r.assign2===m),r2cnt=CACHE.db.filter(r=>r.assign2===m).length
    h+=`<div class="mc ${sc}" onclick="openModal('${m}','${team}')">
      <div class="mn">${m}${r2cnt>0?`<span class="t2nd">2차 ${r2cnt}</span>`:''}</div>
      <div class="ms">${cnt}/${q}건 ${cnt>=q?'✓ 완료':cnt>0?'진행중':'미시작'}</div>
      <div class="pw"><div class="pp" style="width:${Math.round(pct*100)}%;background:${bc}"></div></div>
      <div class="mp">${Math.round(pct*100)}%</div>
      <div class="qr" onclick="event.stopPropagation()"><span class="ql">할당량</span><div class="qt"><button class="qtb ${q===1?'on':''}" onclick="setQtBtn('${m}','${date}',1,'${team}')">1건</button><button class="qtb ${q===3?'on':''}" onclick="setQtBtn('${m}','${date}',3,'${team}')">3건</button></div></div>
      ${assigned.length>0?`<div style="margin-top:6px">${assigned.slice(0,3).map(r=>`<div class="ai ${r.assign2===m?'r2':''}">${r.assign2===m?'[2차] ':''}<i class="ti ti-building" style="font-size:11px"></i> ${r.name}</div>`).join('')}${assigned.length>3?`<div class="ai">+${assigned.length-3}건 더</div>`:''}</div>`:''}
    </div>`
  })
  h+=`</div>`;document.getElementById('tab-'+team).innerHTML=h
}

async function setQtBtn(ma,date,v,team){
  const existing=CACHE.quotas.find(q=>q.ma_name===ma&&q.quota_date===date)
  if(existing){
    await sb.from('ma_quotas').update({quota:v}).eq('ma_name',ma).eq('quota_date',date)
    existing.quota=v
  }else{
    const{data}=await sb.from('ma_quotas').insert({ma_name:ma,quota_date:date,quota:v}).select().single()
    if(data)CACHE.quotas.push(data)
  }
  renderTeam(team)
}

async function enableR2(id){
  await sb.from('company_db').update({r2_enabled:true}).eq('id',id)

function bindFileInput(){const inp=document.getElementById('csv-input');if(inp)inp.onchange=handleFile}
function handleFile(e){
  const file=e.target.files[0];if(!file)return
  const reader=new FileReader()
  reader.onload=async ev=>{
    Papa.parse(ev.target.result,{header:true,skipEmptyLines:true,complete:async res=>{
      const rows=res.data.map(row=>{
        const name=(row['본사명']||row['name']||'').trim(),branches=parseInt(row['가맹점수']||row['가맹점']||0),region=(row['권역']||'').trim()
        const r=region.includes('서')||region.toLowerCase().includes('west')?'west':'east'
        return name?{name,branches:isNaN(branches)?0:branches,region:r,assign1:null,assign2:null,r2_enabled:false}:null
      }).filter(Boolean)
      if(!rows.length){alert('유효한 데이터가 없습니다.');return}
      const{data,error}=await sb.from('company_db').insert(rows).select()
      if(error){alert('업로드 실패: '+error.message);return}
      CACHE.db=[...CACHE.db,...(data||[])]
      alert(`${rows.length}건 업로드 완료`);renderAll()
    }})
  }
  reader.readAsText(file,'UTF-8')
}
async function doAutoAssign(){
  const eDB=CACHE.db.filter(r=>r.region==='east'&&!r.assign1).sort((a,b)=>b.branches-a.branches)
  const wDB=CACHE.db.filter(r=>r.region==='west'&&!r.assign1).sort((a,b)=>b.branches-a.branches)
  const updates=[]
  eDB.forEach((r,i)=>{r.assign1=EAST[i%EAST.length];updates.push({id:r.id,assign1:r.assign1})})
  wDB.forEach((r,i)=>{r.assign1=WEST[i%WEST.length];updates.push({id:r.id,assign1:r.assign1})})
  for(const u of updates) await sb.from('company_db').update({assign1:u.assign1}).eq('id',u.id)
  renderAll()
}
async function resetDB(){
  if(!confirm('DB를 초기화하시겠습니까?'))return
  await sb.from('company_db').delete().neq('id',0)
  CACHE.db=[];renderAll()
}

async function saveLog(){
  const co=document.getElementById('f-co').value.trim(),cp=document.getElementById('f-cp').value.trim(),fr=document.getElementById('f-fr').value.trim(),ct=document.getElementById('f-ct').value.trim(),rs=document.getElementById('f-rs').value,cd=document.getElementById('f-cd').value.trim(),cr=document.getElementById('f-cr').value
  if(!co||!cp||!fr||!ct||!rs||!cd||!cr){alert('필수 항목을 모두 입력해주세요.');return}
  const rec={log_date:CUR_DATE,ma_name:mMA,team:EAST.includes(mMA)?'east':'west',company:co,current_partner:cp,fee_rate:fr,ceo_contact:ct,call_result:rs,consult_detail:cd,consult_result:cr,action_plan:document.getElementById('f-ac').value.trim()}
  const{data,error}=await sb.from('tm_logs').insert(rec).select().single()
  if(error){alert('저장 실패: '+error.message);return}
  CACHE.logs.unshift(data)
  ;['f-co','f-cp','f-fr','f-ct','f-ac','f-cd'].forEach(id=>document.getElementById(id).value='')
  document.getElementById('f-rs').value='';document.getElementById('f-cr').value=''
  renderEL(logs4(mMA,CUR_DATE));reRenderActive()
}
function closeModal(){document.getElementById('mov').classList.remove('open')}
function closeModalBg(e){if(e.target===document.getElementById('mov'))closeModal()}

// ── 실시간 구독 (다른 사람이 저장하면 자동 반영) ──
function setupRealtime(){
  sb.channel('tm-realtime')
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'tm_logs'},payload=>{
      if(!CACHE.logs.find(l=>l.id===payload.new.id))CACHE.logs.unshift(payload.new)
      setSyncBadge('ok','✓ 실시간 동기화')
      reRenderActive()
    })
    .on('postgres_changes',{event:'DELETE',schema:'public',table:'tm_logs'},payload=>{
      CACHE.logs=CACHE.logs.filter(l=>l.id!==payload.old.id)
      reRenderActive()
    })
    .subscribe()
}

// 페이지 로드 완료 후 Supabase 초기화 및 데이터 로드
document.addEventListener("DOMContentLoaded", function(){
  if(typeof supabase !== 'undefined'){
    const { createClient } = supabase
    sb = createClient(SUPABASE_URL, SUPABASE_KEY)
    loadAll().then(setupRealtime)
  } else {
    // CDN 로드 대기 후 재시도
    function waitForSupabase(){
      if(typeof supabase !== 'undefined'){
        const { createClient } = supabase
        sb = createClient(SUPABASE_URL, SUPABASE_KEY)
        loadAll().then(setupRealtime)
      } else {
        setTimeout(waitForSupabase, 50)
      }
    }
    waitForSupabase()
  }
})
</script>
