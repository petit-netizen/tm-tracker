<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TM 활동 관리 대시보드</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
/* ── CSS 변수 ── */
:root{
  --bg1:#ffffff;--bg2:#f5f5f4;--bg3:#f0ede8;--bgi:#e6f1fb;--bgs:#eaf3de;--bgw:#faeeda;--bgd:#fcebeb;
  --t1:#1a1a18;--t2:#6b6b67;--t3:#9c9c97;--ti:#185fa5;--ts:#3b6d11;--tw:#854f0b;--td:#a32d2d;
  --b1:rgba(0,0,0,.4);--b2:rgba(0,0,0,.3);--b3:rgba(0,0,0,.15);--bi:#378add;
  --r1:8px;--r2:12px;--font:-apple-system,BlinkMacSystemFont,'Segoe UI','Apple SD Gothic Neo','Noto Sans KR',sans-serif
}
@media(prefers-color-scheme:dark){:root{
  --bg1:#1e1e1c;--bg2:#2a2a28;--bg3:#242422;--bgi:#0c2540;--bgs:#162808;--bgw:#2a1800;--bgd:#280f0f;
  --t1:#f0ede8;--t2:#a8a8a3;--t3:#6b6b67;--ti:#85b7eb;--ts:#97c459;--tw:#ef9f27;--td:#f09595;
  --b1:rgba(255,255,255,.4);--b2:rgba(255,255,255,.3);--b3:rgba(255,255,255,.15)
}}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:var(--bg3);color:var(--t1);min-height:100vh}
.wrap{max-width:1120px;margin:0 auto;padding:1.5rem 1rem}
.ph{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.25rem;flex-wrap:wrap;gap:10px}
.pt{font-size:18px;font-weight:500}.ps{font-size:12px;color:var(--t2);margin-top:2px}
.sync-status{font-size:11px;padding:4px 10px;border-radius:99px;border:0.5px solid var(--b3)}
.sync-status.ok{background:var(--bgs);color:var(--ts)}.sync-status.err{background:var(--bgd);color:var(--td)}.sync-status.loading{background:var(--bg2);color:var(--t2)}
.card{background:var(--bg1);border:0.5px solid var(--b3);border-radius:var(--r2);padding:1.25rem 1.5rem}
.tabs{display:flex;gap:5px;margin-bottom:1.25rem;flex-wrap:wrap}
.tb{padding:7px 16px;border:0.5px solid var(--b2);border-radius:var(--r1);background:transparent;font-size:13px;cursor:pointer;color:var(--t2);font-family:var(--font);transition:all .15s}
.tb:hover{background:var(--bg2)}.tb.active{background:var(--bgi);color:var(--ti);border-color:transparent;font-weight:500}
.sec{display:none}.sec.active{display:block}
.sr{display:grid;grid-template-columns:repeat(auto-fit,minmax(105px,1fr));gap:8px;margin-bottom:1.25rem}
.sc{background:var(--bg2);border-radius:var(--r1);padding:11px 13px}
.sl{font-size:11px;color:var(--t2);margin-bottom:3px}.sv{font-size:20px;font-weight:500;color:var(--t1)}
.dn{display:flex;align-items:center;gap:8px;margin-bottom:1rem}
.db{background:transparent;border:0.5px solid var(--b2);width:32px;height:32px;border-radius:var(--r1);cursor:pointer;font-size:18px;color:var(--t1);display:flex;align-items:center;justify-content:center;font-family:var(--font);user-select:none}
.db:hover{background:var(--bg2)}.dl{font-size:14px;font-weight:500;color:var(--t1)}
.mg{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:9px;margin-bottom:1.25rem}
.mc{background:var(--bg1);border:0.5px solid var(--b3);border-radius:var(--r2);padding:11px 13px;cursor:pointer;transition:border-color .15s}
.mc:hover{border-color:var(--b1)}.mc.done{border-left:3px solid #1D9E75}.mc.partial{border-left:3px solid #BA7517}.mc.none{border-left:3px solid var(--b3)}
.mn{font-size:13px;font-weight:500;color:var(--t1);margin-bottom:2px}
.ms{font-size:11px;color:var(--t2);margin-bottom:6px}
.pw{height:4px;background:var(--bg2);border-radius:99px;margin-bottom:4px}
.pp{height:100%;border-radius:99px;transition:width .3s}.mp{font-size:11px;color:var(--t2);text-align:right;margin-bottom:6px}
.qr{display:flex;align-items:center;justify-content:space-between;padding-top:6px;border-top:0.5px solid var(--b3)}
.ql{font-size:11px;color:var(--t2)}.qt{display:flex;gap:3px;align-items:center}
.qtb{padding:2px 7px;font-size:11px;border:0.5px solid var(--b2);border-radius:var(--r1);background:transparent;cursor:pointer;color:var(--t2);font-family:var(--font)}
.qtb.on{background:var(--bgi);color:var(--ti);border-color:transparent;font-weight:500}
.ai{font-size:11px;color:var(--t2);padding:1px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ai.r2{color:var(--ti)}.stl{font-size:14px;font-weight:500;color:var(--t1);margin-bottom:.75rem}
/* 달력 */
.cs{margin-bottom:1.5rem}.ch{display:flex;align-items:center;gap:8px;margin-bottom:.6rem}
.ct{font-size:14px;font-weight:500;color:var(--t1)}
.cg{display:grid;grid-template-columns:repeat(5,1fr);gap:3px}
.cg7{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cdw{text-align:center;font-size:10px;color:var(--t2);padding:3px 0;font-weight:500}
.cl{border:0.5px solid var(--b3);border-radius:var(--r1);padding:5px 4px 4px;min-height:58px;cursor:pointer;transition:border-color .1s}
.cl:hover{border-color:var(--b1)}.cl.empty{border-color:transparent;cursor:default}
.cl.today{border-color:var(--bi)}.cl.sel{border-color:var(--bi);background:var(--bgi)}
.cd{font-size:11px;font-weight:500;color:var(--t1);margin-bottom:3px}.cl.sel .cd{color:var(--ti)}
.ctr{display:flex;flex-direction:column;gap:2px}
.ctrow{display:flex;align-items:center;gap:3px}
.ctd{width:5px;height:5px;border-radius:50%;flex-shrink:0}
.ctl{font-size:9px;color:var(--t2);line-height:1}.cl.sel .ctl{color:var(--ti);opacity:.8}
.ctv{font-size:9px;font-weight:500;line-height:1}
.hl-lbl{font-size:9px;color:var(--td);margin-top:1px}
.cl-leg{display:flex;gap:10px;font-size:10px;color:var(--t2);margin-top:5px;flex-wrap:wrap;align-items:center}
.cl-leg span{display:inline-flex;align-items:center;gap:3px}
.ds{width:5px;height:5px;border-radius:50%;display:inline-block}
/* 패널·버튼 */
.pn{background:var(--bg1);border:0.5px solid var(--b3);border-radius:var(--r2);padding:1rem 1.25rem;margin-bottom:1rem}
.pnt{font-size:13px;font-weight:500;color:var(--t1);margin-bottom:.75rem;display:flex;align-items:center;gap:6px}
.ua{border:0.5px dashed var(--b2);border-radius:var(--r1);padding:1.2rem;text-align:center;cursor:pointer;margin-bottom:.75rem}
.ua:hover{background:var(--bg2)}
.dbtw{overflow-x:auto;margin-bottom:.75rem}
.dbt{width:100%;border-collapse:collapse;font-size:12px;table-layout:fixed}
.dbt th{text-align:left;padding:6px 8px;border-bottom:0.5px solid var(--b2);color:var(--t2);font-weight:500}
.dbt td{padding:6px 8px;border-bottom:0.5px solid var(--b3);color:var(--t1);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dbt tr:last-child td{border-bottom:none}.dbt tr:hover td{background:var(--bg2)}
.bdg{font-size:11px;padding:2px 8px;border-radius:99px;display:inline-block}
.bdg.u{background:var(--bg2);color:var(--t2)}.bdg.a1{background:var(--bgs);color:var(--ts)}.bdg.a2,.bdg.r2{background:var(--bgi);color:var(--ti)}
.btn{padding:7px 14px;border:0.5px solid var(--b2);border-radius:var(--r1);background:transparent;font-size:13px;cursor:pointer;color:var(--t2);font-family:var(--font)}
.btn:hover{background:var(--bg2)}.btn.p{background:var(--bgi);color:var(--ti);border-color:transparent;font-weight:500}.btn.p:hover{opacity:.9}
.btn.s{padding:4px 10px;font-size:11px}.btn.dng{color:var(--td);border-color:#f7c1c1}.btn.dng:hover{background:var(--bgd)}
input,select,textarea{font-family:var(--font);font-size:13px;padding:6px 10px;border:0.5px solid var(--b2);border-radius:var(--r1);background:var(--bg1);color:var(--t1);outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--bi)}
.fr{display:flex;gap:6px;margin-bottom:.75rem;flex-wrap:wrap;align-items:center}
.fr select,.fr input{font-size:13px;padding:5px 8px}

/* 빠른 1행 입력폼 CSS */
.q-row{display:flex;gap:6px;align-items:center;background:var(--bg2);padding:10px 12px;border-radius:var(--r1);overflow-x:auto}
.q-row input,.q-row select{font-size:12px;padding:7px 9px;border:0.5px solid var(--b2);border-radius:4px;flex-shrink:0;background:var(--bg1);color:var(--t1)}
.q-row input:focus,.q-row select:focus{border-color:var(--bi);outline:none}

/* 모달 */
.mov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:1000;align-items:flex-start;justify-content:center;padding-top:2rem;overflow-y:auto}
.mov.open{display:flex}
.mo{background:var(--bg1);border-radius:var(--r2);border:0.5px solid var(--b3);padding:1.25rem;width:94%;max-width:560px;margin-bottom:2rem}
.mot{font-size:15px;font-weight:500;color:var(--t1);margin-bottom:4px}
.mos{font-size:12px;color:var(--t2);margin-bottom:1rem}
.fs{background:var(--bg2);border-radius:var(--r1);padding:10px 12px;margin-bottom:10px}
.fst{font-size:11px;font-weight:500;color:var(--t2);margin-bottom:8px;letter-spacing:.4px}
.frow{margin-bottom:9px}.frow:last-child{margin-bottom:0}
.flbl{font-size:12px;color:var(--t2);margin-bottom:3px;display:flex;align-items:center;gap:4px}
.req{color:var(--td);font-size:11px}
.frow input,.frow select,.frow textarea{width:100%}
.frow textarea{resize:vertical}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fa{display:flex;gap:6px;justify-content:flex-end;margin-top:.75rem}
.lc{border:0.5px solid var(--b3);border-radius:var(--r1);padding:11px 13px;margin-bottom:8px}
.lc.종결{border-left:3px solid #5F5E5A}.lc.추가상담{border-left:3px solid #185FA5}
.lh{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;gap:8px}
.lco{font-size:13px;font-weight:500;color:var(--t1)}
.lb{display:flex;gap:4px;flex-shrink:0;flex-wrap:wrap;justify-content:flex-end}
.pill{font-size:10px;padding:2px 8px;border-radius:99px;display:inline-block;white-space:nowrap}
.pill.응답{background:var(--bgs);color:var(--ts)}.pill.부재{background:var(--bgw);color:var(--tw)}
.pill.거절{background:var(--bgd);color:var(--td)}.pill.콜백요청{background:var(--bgi);color:var(--ti)}
.pill.종결{background:var(--bg2);color:var(--t2)}.pill.추가상담{background:var(--bgi);color:var(--ti)}
.lmg{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;margin-bottom:6px}
.lmi{font-size:11px;color:var(--t2)}.lmi strong{color:var(--t1);font-weight:500}
.lcons{font-size:12px;color:var(--t1);background:var(--bg2);border-radius:var(--r1);padding:7px 9px;margin-bottom:5px;line-height:1.5;white-space:pre-wrap}
.lap{font-size:11px;color:var(--ti);margin-top:3px}
.del{background:none;border:none;cursor:pointer;color:var(--t2);font-size:13px;padding:1px 4px;font-family:var(--font)}
.del:hover{color:var(--td)}
/* 누적 */
.cug{display:grid;grid-template-columns:repeat(auto-fill,minmax(185px,1fr));gap:9px}
.cuc{background:var(--bg1);border:0.5px solid var(--b3);border-radius:var(--r2);padding:11px 13px}
.cun{font-size:13px;font-weight:500;color:var(--t1);margin-bottom:1px}
.cut{font-size:11px;color:var(--t2);margin-bottom:7px}
.cus{display:flex;gap:10px;margin-bottom:5px}.cu{text-align:center}
.cuv{font-size:17px;font-weight:500;color:var(--t1)}.cul{font-size:10px;color:var(--t2)}
.sd{width:7px;height:7px;border-radius:50%;display:inline-block}.sw{display:flex;flex-wrap:wrap;gap:2px}
.t2nd{font-size:10px;background:var(--bgi);color:var(--ti);padding:1px 6px;border-radius:99px;margin-left:4px}
/* 내 이름 선택 바 */
.myma-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--bg2);border-radius:var(--r1);padding:10px 14px;margin-bottom:1rem}
.myma-label{font-size:13px;font-weight:500;color:var(--t1);white-space:nowrap}
.myma-chips{display:flex;gap:5px;flex-wrap:wrap;flex:1}
.myma-chip{padding:5px 12px;border:0.5px solid var(--b2);border-radius:99px;background:var(--bg1);font-size:12px;cursor:pointer;color:var(--t2);font-family:var(--font);transition:all .12s}
.myma-chip:hover{background:var(--bgi);color:var(--ti)}
.myma-chip.on{background:var(--ti);color:#fff;border-color:transparent;font-weight:600}
.myma-clear{font-size:11px;padding:4px 10px;border:0.5px solid var(--b2);border-radius:99px;background:transparent;cursor:pointer;color:var(--t2);font-family:var(--font);white-space:nowrap}
.myma-clear:hover{background:var(--bgd);color:var(--td)}
/* 월 선택 */
.mon-sel{display:flex;gap:6px;margin-bottom:1.25rem;flex-wrap:wrap}
.mon-btn{padding:7px 16px;border:0.5px solid var(--b2);border-radius:var(--r1);background:transparent;font-size:13px;cursor:pointer;color:var(--t2);font-family:var(--font)}
.mon-btn:hover{background:var(--bg2)}
.mon-btn.on{background:var(--bgi);color:var(--ti);border-color:transparent;font-weight:500}
/* 일자별 막대 그래프 */
.chart-wrap{background:var(--bg1);border:0.5px solid var(--b3);border-radius:var(--r2);padding:1.25rem 1.5rem;margin-bottom:1.25rem}
.chart-title{font-size:14px;font-weight:500;color:var(--t1);margin-bottom:1rem;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
.chart-legend{display:flex;gap:14px;font-size:11px;color:var(--t2)}
.chart-legend span{display:inline-flex;align-items:center;gap:4px}
.lgd-box{width:10px;height:10px;border-radius:2px;display:inline-block}
.bars{display:flex;align-items:flex-end;gap:3px;height:200px;padding:0 0 4px;overflow-x:auto;border-bottom:1px solid var(--b3)}
.bar-col{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;min-width:26px;flex:1;height:100%;position:relative}
.bar-stack{display:flex;flex-direction:column-reverse;width:18px;height:calc(100% - 18px);justify-content:flex-start}
.bar-seg{width:100%;border-radius:2px 2px 0 0;transition:height .3s;min-height:0}
.bar-val{font-size:9px;color:var(--t1);font-weight:600;margin-bottom:2px;height:14px;line-height:14px}
.bar-lbl{font-size:9px;color:var(--t2);margin-top:3px;white-space:nowrap}
.bar-lbl.sun{color:#A32D2D}.bar-lbl.sat{color:#185FA5}
.bar-col:hover .bar-seg{opacity:.8}
.chart-empty{text-align:center;padding:2rem;color:var(--t2);font-size:13px}
.chart-summary{display:flex;gap:18px;margin-top:12px;font-size:12px;flex-wrap:wrap}
.chart-summary b{color:var(--t1);font-weight:600;font-size:15px}
.chart-summary .lbl{color:var(--t2);display:block;font-size:11px;margin-top:1px}
/* TM내역 */
.tlw{overflow-x:auto;max-height:520px;overflow-y:auto;border:0.5px solid var(--b3);border-radius:var(--r1)}
.tlt{width:100%;border-collapse:collapse;font-size:12px;min-width:960px}
.tlt th{text-align:left;padding:7px 9px;border-bottom:0.5px solid var(--b2);color:var(--t2);font-weight:500;white-space:nowrap;position:sticky;top:0;background:var(--bg1);z-index:1}
.tlt td{padding:7px 9px;border-bottom:0.5px solid var(--b3);vertical-align:top;font-size:12px}
.tlt tr:last-child td{border-bottom:none}.tlt tr:hover td{background:var(--bg2)}
.hl{background:#fff3cd;border-radius:2px;padding:0 1px;color:#000}
.sb{position:relative;flex:1;min-width:200px;max-width:340px}
.sb input{width:100%;padding-left:32px}.si{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--t2);font-size:15px;pointer-events:none}
.kwc{font-size:11px;color:var(--ti);background:var(--bgi);padding:2px 8px;border-radius:99px;margin-left:6px}
.hbanner{background:var(--bgd);border-radius:var(--r1);padding:10px 14px;font-size:13px;color:var(--td);margin-bottom:1rem}
/* 인증 */
.auth-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:2000;display:flex;align-items:center;justify-content:center}
.auth-box{background:var(--bg1);border:0.5px solid var(--b3);border-radius:var(--r2);padding:1.5rem;width:92%;max-width:340px;box-shadow:0 8px 32px rgba(0,0,0,.15)}
.auth-title{font-size:15px;font-weight:500;color:var(--t1);margin-bottom:4px}
.auth-sub{font-size:12px;color:var(--t2);margin-bottom:1rem}
.auth-tabs{display:flex;gap:4px;margin-bottom:1rem}
.auth-tab{flex:1;padding:6px;border:0.5px solid var(--b2);border-radius:var(--r1);background:transparent;font-size:12px;cursor:pointer;color:var(--t2);font-family:var(--font);text-align:center}
.auth-tab.on{background:var(--bgi);color:var(--ti);border-color:transparent;font-weight:500}
.badge-role{font-size:10px;padding:2px 8px;border-radius:99px;display:inline-block}
.badge-role.admin{background:var(--bgi);color:var(--ti)}
.badge-role.ma{background:var(--bg2);color:var(--t2)}
.user-info-bar{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--t2);padding:6px 10px;background:var(--bg2);border-radius:99px}
.lock-btn{font-size:11px;padding:3px 10px;border:0.5px solid var(--b2);border-radius:99px;background:transparent;cursor:pointer;color:var(--t2);font-family:var(--font)}
.lock-btn:hover{background:var(--bgd);color:var(--td)}
.masked{color:var(--b3);font-size:11px;font-style:italic;user-select:none}
</style>
</head>
<body>
<!-- 앱 시작 -->

<!-- 모바일 감지 배너 -->
<div id="mobile-banner" style="display:none;background:var(--ti);color:#fff;padding:11px 16px;text-align:center;position:sticky;top:0;z-index:9999">
  <div style="font-size:13px;margin-bottom:8px">📱 모바일에서 접속하셨어요! 입력에 최적화된 화면을 사용해보세요.</div>
  <div style="display:flex;gap:8px;justify-content:center">
    <a href="mobile.html" style="background:#fff;color:var(--ti);padding:7px 16px;border-radius:99px;text-decoration:none;font-weight:700;font-size:13px">모바일 입력 화면으로 →</a>
    <button onclick="document.getElementById('mobile-banner').style.display='none';localStorage.setItem('hide_mob','1')"
      style="background:transparent;border:1px solid rgba(255,255,255,.5);color:#fff;padding:7px 12px;border-radius:99px;font-size:12px;cursor:pointer;font-family:var(--font)">PC버전 보기</button>
  </div>
</div>
<script>
(function(){
  var isMobile=/Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent)
  if(isMobile && !localStorage.getItem('hide_mob'))
    document.getElementById('mobile-banner').style.display='block'
})()
</script>

<div class="wrap">
  <div class="ph">
    <div><div class="pt">TM 활동 관리 대시보드</div><div class="ps">동부팀 8명 · 서부팀 9명</div></div>
    <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
      <div id="auth-bar"></div>
      <div id="sync-badge" class="sync-status loading">연결 중...</div>
    </div>
  </div>
  <div class="card">

// 관할구역 텍스트 → 팀 ID 매칭 (업로드 시 사용)
// 우선순위: 정확한 팀명 → 팀명 일부 포함 → 동/서 키워드 → 기본 east
function matchRegionToTeam(regionText){
  if(!regionText) return allTeams()[0] ? allTeams()[0].id : 'east'
  const txt = regionText.toString().trim()
  const teams = allTeams()
  // 1) 팀명 완전 일치
  let hit = teams.find(function(t){ return t.name===txt })
  if(hit) return hit.id
  // 2) 팀명에서 '팀' 떼고 비교 (동부팀 → 동부)
  hit = teams.find(function(t){ return t.name.replace('팀','')===txt.replace('팀','') })
  if(hit) return hit.id
  // 3) 팀명 일부 포함 (양방향)
  hit = teams.find(function(t){
    const base=t.name.replace('팀','')
    return txt.includes(base) || base.includes(txt)
  })
  if(hit) return hit.id
  // 4) 동/서 키워드 폴백
  if(txt.includes('서')||txt.toLowerCase().includes('west')){
    const w=teams.find(function(t){return t.id==='west'}); if(w) return w.id
  }
  if(txt.includes('동')||txt.toLowerCase().includes('east')){
    const e=teams.find(function(t){return t.id==='east'}); if(e) return e.id
  }
  // 5) 못 찾으면 첫 팀
  return teams[0] ? teams[0].id : 'east'
}

// 관리자가 인력관리 탭에서 변경 가능 (localStorage 저장), 기본 2026-06-05
let CAMPAIGN_START = (function(){
  try{ return localStorage.getItem('campaign_start') || '2026-06-05' }
  catch(e){ return '2026-06-05' }
})()
function setCampaignStart(ds){
  CAMPAIGN_START = ds
  try{ localStorage.setItem('campaign_start', ds) }catch(e){}
}

// 개별 휴무일 (캠페인 기간 중 특정 날짜를 쉬는 날로 지정) — 전사 공통 휴무
let CUSTOM_OFF_DAYS = (function(){
  try{ return JSON.parse(localStorage.getItem('custom_off_days')||'[]') }
  catch(e){ return [] }
})()
function isCustomOff(ds){ return CUSTOM_OFF_DAYS.indexOf(ds) >= 0 }
function addCustomOff(ds){
  if(!isCustomOff(ds)){ CUSTOM_OFF_DAYS.push(ds); _saveCustomOff() }
}
function removeCustomOff(ds){
  CUSTOM_OFF_DAYS = CUSTOM_OFF_DAYS.filter(function(x){return x!==ds})
  _saveCustomOff()
}
function _saveCustomOff(){
  try{ localStorage.setItem('custom_off_days', JSON.stringify(CUSTOM_OFF_DAYS)) }catch(e){}
}
function isWorkday(ds){
  if(ds <= CAMPAIGN_START) return false;
  if(isCustomOff(ds)) return false;
  const dt=new Date(ds+'T00:00:00'),d=dt.getDay();
  return d!==0&&d!==6&&!KR_HOLIDAYS.has(ds)
}

// ── 이월 TM 계산 ──────────────────────────────
// 해당 MA가 targetDate에 수행해야 할 TM처 목록
// = 오늘 배정된 거래처 + 과거 미수행 이월분
function getAssignedForDate(ma, targetDate){
  // 이 MA의 1차 배정 거래처 전체 (TM대상)
  const allAssigned = CACHE.db.filter(r=>r.assign1===ma && r.is_target!==false)
  if(!allAssigned.length) return { today:[], carryover:[], total:[] }

  // 캠페인 시작일 다음날~targetDate까지의 근무일
  const workdays = _workdaysBetween(CAMPAIGN_START, targetDate)

  // 각 근무일에 배정됐어야 할 거래처 계산 (라운드로빈 순환)
  // 단, 이미 TM 기록이 있는 거래처는 '수행 완료'로 처리
  const performed = new Set(
    CACHE.logs
      .filter(l=>l.ma_name===ma)
      .map(l=>l.company)
  )

  // 오늘 해야 할 TM처: 미수행 이월분 + 오늘치 신규
  // 이월: targetDate 이전 근무일에 배정됐으나 미수행인 거래처
  const todayIdx = workdays.indexOf(targetDate)
  if(todayIdx < 0) return { today:[], carryover:[], total:[] }

  const carryover = []
  for(let i=0; i<todayIdx; i++){
    const wd = workdays[i]
    const assigned = _getDbForWorkday(allAssigned, i)
    if(assigned && !performed.has(assigned.name)){
      carryover.push({...assigned, _dueDate: wd})
    }
  }

  // 오늘치 신규 배정
  const todayDb = _getDbForWorkday(allAssigned, todayIdx)
  const today = todayDb ? [todayDb] : []

  // 중복 제거 (이월에 오늘치 같은 거래처가 있으면 한 번만)
  const carryoverNames = new Set(carryover.map(r=>r.name))
  const todayFinal = today.filter(r=>!carryoverNames.has(r.name))

  const total = carryover.concat(todayFinal)
  return { today: todayFinal, carryover, total }
}

// 근무일 배열에서 i번째 날에 해당하는 거래처 (라운드로빈)
function _getDbForWorkday(dbList, dayIndex){
  if(!dbList.length) return null
  // 가맹점 많은 순 정렬 유지
  const sorted = [...dbList].sort((a,b)=>b.branches-a.branches)
  return sorted[dayIndex % sorted.length]
}

// CAMPAIGN_START 다음날~endDate까지의 근무일 배열
function _workdaysBetween(startExcl, endIncl){
  const arr=[]
  const parts=startExcl.split('-').map(Number)
  const d=new Date(parts[0],parts[1]-1,parts[2])
  d.setDate(d.getDate()+1)  // startExcl 다음날부터
  const end=new Date(endIncl+'T00:00:00')
  while(d<=end){
    const ds=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')
    if(isWorkday(ds)) arr.push(ds)
    d.setDate(d.getDate()+1)
  }
  return arr
}
function hName(ds){
  if(HNAMES[ds]) return HNAMES[ds];
  if(isCustomOff(ds)){
    const dt=new Date(ds+'T00:00:00'),d=dt.getDay();
    if(d!==0 && d!==6) return '휴무일(지정)';
  }
  if(ds <= CAMPAIGN_START) {
    const dt=new Date(ds+'T00:00:00'),d=dt.getDay();
    if(d!==0 && d!==6) return '캠페인 일정아님';
  }
  return null;
}

// ── Supabase 데이터 로드 ──
async function loadAll(){
  setSyncBadge('loading','불러오는 중...')
  try{
    // logs, quotas는 병렬 로드
    const [logsRes, quotasRes] = await Promise.all([
      sb.from('tm_logs').select('*').order('log_date',{ascending:false}),
      sb.from('ma_quotas').select('*')
    ])
    if(logsRes.error||quotasRes.error) throw new Error('조회 오류')

    // DB 로드: 타임아웃 10초 + pagination
    const PAGE=1000; let allDb=[]; let from=0
    setSyncBadge('loading','DB 로딩 중...')
    console.log('[DB] 로드 시작')
    let pageCount=0
    while(pageCount<30){  // 최대 30페이지(3만건) 안전 상한
      pageCount++
      let res
      try{
        const fetchPromise = sb.from('company_db').select('*')
          .order('branches',{ascending:false,nullsFirst:false})
          .range(from, from+PAGE-1)
        const timeoutPromise = new Promise(function(_,reject){
          setTimeout(function(){ reject(new Error('DB 로드 타임아웃 (10초)')) }, 10000)
        })
        res = await Promise.race([fetchPromise, timeoutPromise])
      }catch(fetchErr){
        console.error('[DB] 페이지 로드 실패:', fetchErr.message)
        // 이미 로드된 데이터가 있으면 그걸로 진행
        if(allDb.length>0) break
        throw fetchErr
      }
      if(res.error){ console.error('[DB] 오류:', res.error.message); break }
      if(!res.data||!res.data.length) break
      allDb=allDb.concat(res.data)
      setSyncBadge('loading','DB '+allDb.length+'건 로딩 중...')
      console.log('[DB] 로드:', allDb.length+'건')
      if(res.data.length<PAGE) break
      from+=PAGE
      if(allDb.length>=20000) break
    }
    console.log('[DB] 완료:', allDb.length+'건')

    CACHE.logs = logsRes.data || []
    CACHE.quotas = quotasRes.data || []
    CACHE.db = allDb
    // phase 자동 계산: 10개↑=1차, 5~9=2차, 4개↓=3차 (DB에 저장된 값 우선)
    CACHE.db.forEach(function(r){
      if(r.phase===1||r.phase===2||r.phase===3) return  // 저장된 값 유지
      const b = (r.branches!=null&&r.branches!==undefined) ? Number(r.branches) : 0
      r.phase = b>=10 ? 1 : b>=5 ? 2 : 3
      r.phase_approved = r.phase===1  // 1차는 기본 승인, 2·3차는 미승인
    })
    CACHE.loaded = true
    setSyncBadge('ok','✓ 연결됨')
    reRenderActive()
  }catch(e){
    setSyncBadge('err','⚠ 연결 실패 — Supabase Key를 확인하세요')
    console.error(e)
    reRenderActive()  // 실패해도 UI는 표시
  }
}

// ── 캐시 헬퍼 ──
function logs4(ma,date){return CACHE.logs.filter(l=>l.ma_name===ma&&l.log_date===date)}
// 휴무일 경우 할당량을 0으로 반환
function mq(ma,date){
  // 명시적으로 저장된 할당량(휴무=0 포함) 우선
  const stored=CACHE.quotas.find(q=>q.ma_name===ma&&q.quota_date===date)
  if(stored) return stored.quota  // 0(휴무)도 그대로 반환
  // 기본 할당 1건 (이월 계산은 할당 TM처 버튼으로 별도 표시)
  return 1
}
// (teamMembers는 ORG 기반 정의 사용)
function tdAch(team,date){return teamMembers(team).filter(m=>{const q=mq(m,date);return q>0&&logs4(m,date).length>=q}).length}
function tdTot(team,date){return teamMembers(team).filter(m=>mq(m,date)>0).length}

async function saveQuickLog(){
  const ma = document.getElementById('q-ma').value
  const co = document.getElementById('q-co').value.trim()
  const cp = document.getElementById('q-cp').value.trim()
  const fr = document.getElementById('q-fr').value.trim()
  const ct = document.getElementById('q-ct').value.trim()
  const rs = document.getElementById('q-rs').value
  const cd = document.getElementById('q-cd').value.trim()
  const cr = document.getElementById('q-cr').value
  const ac = document.getElementById('q-ac').value.trim()

  if(!ma || !co || !rs || !cd || !cr){
    alert('필수 항목(* 표시)을 모두 입력 및 선택해주세요.')
    return
  }
  // 고객사명 DB 검증: 없으면 MA가 신규 등록 가능
  let dbMatch = CACHE.db.find(r=>r.name===co)
  if(!dbMatch){
    const added = await promptAddNewCompany(co, ma)
    if(!added) return   // 사용자가 취소
    dbMatch = added
  } else if(dbMatch.is_target===false){
    alert('"'+co+'"은(는) TM 제외(N) 처리된 거래처입니다.\n관리자에게 문의해주세요.')
    return
  }

  const tmSeq = await getTmSeqForCompany(co)
  const rec = {
    log_date: CUR_DATE,
    ma_name: ma,
    team: maTeam(ma) || 'west',
    company: co,
    current_partner: cp,
    fee_rate: fr,
    ceo_contact: ct,
    call_result: rs,
    consult_detail: cd,
    consult_result: cr,
    action_plan: ac,
    tm_seq: tmSeq
  }

  const { data, error } = await sb.from('tm_logs').insert(rec).select().single()
  if(error){ alert('저장 실패: ' + error.message); return }

  CACHE.logs.unshift(data)
  // has_tm_history 업데이트 (백그라운드)
  sb.from('company_db').update({has_tm_history:true}).eq('name',co).then(function(){})
  const _dbRow = CACHE.db.find(function(r){return r.name===co})
  if(_dbRow) _dbRow.has_tm_history = true

  // 작성 편의를 위해 MA(이름) 항목은 남겨두고 나머지만 초기화
  ;['q-co','q-cp','q-fr','q-ct','q-ac','q-cd'].forEach(id => document.getElementById(id).value = '')
  document.getElementById('q-rs').value = ''
  document.getElementById('q-cr').value = ''

  // 선택한 MA 기억 (renderAll 후 복원용)
  window.LAST_QUICK_MA = ma
  reRenderActive()
}

// ── 전체 탭 ──
function renderAll(){
  const date=CUR_DATE
  let tQ=0,dTM=0,fD=0,totMA=0
  ALL_MA.forEach(({m})=>{
    const q=mq(m,date)
    if(q===0) return // 휴무자 제외
    totMA++
    const c=logs4(m,date).length
    tQ+=q; dTM+=Math.min(c,q); if(c>=q) fD++
  })
  const isH=!isWorkday(date)
  // ── 내 이름 선택 바 (MA 빠른 진입) ──
  const myName = window.MY_MA_NAME || ''
  let h = '<div class="myma-bar">'
    + '<span class="myma-label">👤 내 이름:</span>'
    + '<div class="myma-chips">'
    + ALL_MA.map(function(x){
        const on = x.m===myName ? ' on' : ''
        return '<button class="myma-chip'+on+'" onclick="selectMyMa(\''+x.m+'\')">'+x.m+'</button>'
      }).join('')
    + '</div>'
    + (myName ? '<button class="myma-clear" onclick="clearMyMa()">선택 해제</button>' : '')
    + '</div>'
  h+=`<div class="dn"><button class="db" onclick="chgDate(-1,'all')">&#8249;</button><span class="dl">${fmtD(date)}${isH?` <span style="font-size:11px;color:${hName(date)==='캠페인 일정아님'?'var(--t2)':'var(--td)'}">${hName(date)||'주말/공휴일'}</span>`:''}</span><button class="db" onclick="chgDate(1,'all')">&#8250;</button></div>
  ${isH?`<div class="hbanner">휴무일(주말/공휴일/캠페인외)입니다. TM 기록은 가능하나 달성률 집계에서 제외됩니다.</div>`:''}
  <div class="sr"><div class="sc"><div class="sl">달성 TM</div><div class="sv">${dTM}건</div></div><div class="sc"><div class="sl">달성 MA</div><div class="sv">${fD}/${totMA}명</div></div><div class="sc"><div class="sl">전체 달성률</div><div class="sv">${tQ>0?Math.round(dTM/tQ*100):0}%</div></div><div class="sc"><div class="sl">DB 총계</div><div class="sv">${CACHE.db.length}건</div></div></div>`
  h+=calHtml('all',date)
  h+=`<div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-bottom:1rem">`
  ;['east','west'].forEach(team=>{
    const tms=teamMembers(team);let tQ2=0,tD=0,tF=0,tTot=0
    tms.forEach(m=>{
      const q=mq(m,date); if(q===0) return; // 휴무 제외
      tTot++; const c=logs4(m,date).length;
      tQ2+=q; tD+=Math.min(c,q); if(c>=q) tF++
    })
    h+=`<div class="pn" style="margin-bottom:0"><div class="pnt"><i class="ti ti-users" style="font-size:15px"></i>${team==='east'?'동부팀':'서부팀'}</div><div style="font-size:12px;color:var(--t2);margin-bottom:8px">대상 ${tTot}명 · 달성 ${tD}건 · ${tQ2>0?Math.round(tD/tQ2*100):0}%</div>`
    tms.forEach(m=>{
      const q=mq(m,date),c=logs4(m,date).length
      const isV = q===0
      const isOver  = !isV && c > q    // 초과 달성
      const isAch   = !isV && c >= q   // 달성
      const isBoost = !isV && q > 1 && c >= q  // 자발적 할당 증액 후 달성 ★
      const pctBase = isV ? 0 : Math.min(c/q, 1)
      const pctOver  = isOver ? Math.min((c-q)/q, 0.5) : 0
      // 색상: 자발증액달성=골드, 일반달성=초록, 진행중=주황, 미시작=회색
      const bc = isV ? 'var(--b3)' : isBoost ? '#F59E0B' : isAch ? '#1D9E75' : c>0 ? '#BA7517' : 'var(--b3)'
      const ms2 = isMe(m)?';font-weight:600;color:var(--ti)':''
      // 배지: 자발증액달성=⭐, 일반초과=🔥
      const overBadge = isBoost
        ? `<span title="${q}건 달성! (증액 목표 달성)" style="font-size:12px;margin-left:2px">⭐</span>`
        : isOver
          ? `<span title="${c-q}건 초과 달성" style="font-size:12px;margin-left:2px">🔥</span>`
          : ''
      const cntLabel = isV ? '휴무'
        : isBoost ? `<b style="color:#F59E0B;font-size:12px">${c}</b>`
        : isOver  ? `<b style="color:#1D9E75">${c}</b>`
        : c > 0   ? `<b style="color:#1D9E75">${c}</b>`
        : `${c}`
      // 막대 구조: [기본 달성바 + 초과 돌출바 + 목표 표시선]
      // 초과분: 막대 전체 너비를 최대 100%로 제한, 대신 색상·광택으로 표현
      // 기본달성 구간 + 초과 구간을 하나의 막대 안에 두 색상으로 나눔
      const baseW  = Math.round(pctBase * 100)
      const overW  = isOver ? Math.min(Math.round(pctOver * 100), 100 - baseW) : 0
      const barHtml = `<div style="flex:1;height:8px;background:var(--bg2);border-radius:99px;overflow:hidden;position:relative">
        <div style="position:absolute;left:0;top:0;height:100%;width:${baseW}%;background:${bc};border-radius:99px 0 0 99px;transition:width .4s"></div>
        ${isOver?`<div style="position:absolute;left:${baseW}%;top:0;height:100%;width:${overW+2}%;background:linear-gradient(90deg,#22c55e,#86efac);border-radius:0 99px 99px 0;transition:all .4s"></div>`:''}
      </div>`
      h+=`<div style="display:flex;align-items:center;gap:8px;padding:4px 0;${isV?'opacity:0.4':''}">
        <span style="font-size:12px;width:54px;flex-shrink:0${ms2}">${m}${overBadge}${isMe(m)?' ◀':''}</span>
        ${barHtml}
        <span style="font-size:11px;color:var(--t2);width:40px;text-align:right;white-space:nowrap">${cntLabel}</span>
      </div>`
    })
    h+=`</div>`
  })
  
  h+=`</div>` + quickTmFormHtml()
  h+=`<div id="all-ma-logs" style="margin-top:1rem"></div>`
  
  document.getElementById('tab-all').innerHTML=h
  // 내 이름 또는 저장 직후 MA를 빠른입력 담당자에 자동 반영
  const autoMa = window.LAST_QUICK_MA || window.MY_MA_NAME
  if(autoMa){
    const qsel=document.getElementById('q-ma')
    if(qsel) qsel.value=autoMa
  }
  renderAllMaLogs()
}

// 전체 탭에서 선택한 MA의 오늘 TM 내역 + 오늘 할당 TM처 표시
function renderAllMaLogs(){
  const sel = document.getElementById('q-ma')
  const box = document.getElementById('all-ma-logs')
  if(!sel || !box) return
  const ma = sel.value
  if(!ma){ box.innerHTML=''; return }

  const {today, carryover, total} = getAssignedForDate(ma, CUR_DATE)
  const todayLogs = logs4(ma, CUR_DATE)

  // ── 오늘 할당 TM처 표시 + 고객사명 자동 세팅 ──
  let h = '<div class="pn" style="margin-bottom:.75rem">'
  h += '<div class="pnt"><i class="ti ti-list-check" style="font-size:15px"></i>'
     + ma + ' — ' + fmtD(CUR_DATE) + ' 할당 TM처</div>'

  if(!total.length){
    h += '<div style="font-size:12px;color:var(--t2)">배정된 TM 대상처가 없거나 캐시 로딩 중입니다.</div>'
  } else {
    if(carryover.length){
      h += '<div style="font-size:11px;background:var(--bgw);color:var(--tw);padding:6px 10px;border-radius:var(--r1);margin-bottom:8px">'
         + '⏩ 이월 미수행 <strong>'+carryover.length+'건</strong> 포함 — '
         + carryover.map(r=>r.name+' ('+r._dueDate.slice(5)+' 미수행)').join(', ')
         + '</div>'
    }
    h += '<div style="display:flex;flex-wrap:wrap;gap:6px">'
    total.forEach(function(r){
      const done = todayLogs.some(l=>l.company===r.name)
      const isCarry = !!r._dueDate
      const col = done ? 'var(--bgs)' : isCarry ? 'var(--bgw)' : 'var(--bgi)'
      const tcol = done ? 'var(--ts)' : isCarry ? 'var(--tw)' : 'var(--ti)'
      h += '<button onclick="setCompanyInForm(\''+r.name.replace(/'/g,"\'")+'\')"'
         + ' style="font-size:12px;padding:5px 12px;border-radius:99px;border:0.5px solid '+tcol+';background:'+col+';color:'+tcol+';cursor:pointer;'+(done?'text-decoration:line-through;opacity:0.5;':'')+';font-family:var(--font)'
         + (done?';text-decoration:line-through;opacity:.6':'')+'">'
         + r.name+(done?' ✓':isCarry?' ↩':'')+'</button>'
    })
    h += '</div>'
    h += '<div style="font-size:11px;color:var(--t2);margin-top:6px">버튼을 클릭하면 고객사명이 자동으로 입력됩니다.</div>'
  }
  h += '</div>'

  // ── 오늘 기록된 TM 내역 ──
  h += '<div class="pn" style="margin-bottom:0"><div class="pnt"><i class="ti ti-notes" style="font-size:15px"></i>오늘 TM 기록 ('+todayLogs.length+'건)</div>'
  if(!todayLogs.length){
    h += '<div style="font-size:12px;color:var(--t2);text-align:center;padding:1rem">아직 기록된 TM이 없습니다.</div>'
  } else {
    todayLogs.forEach(function(l){
      const crCls=l.consult_result==='종결'?'종결':'추가상담'
      const callPill=l.call_result?'<span class="pill '+l.call_result+'">'+l.call_result+'</span>':''
      const crPill=l.consult_result?'<span class="pill '+crCls+'">'+(l.consult_result==='추가상담'?'추가상담':l.consult_result)+'</span>':''
      const detail=l.consult_detail?'<div class="lcons">'+l.consult_detail+'</div>':''
      const ap=l.action_plan?'<div class="lap">→ '+l.action_plan+'</div>':''
      h+='<div class="lc '+crCls+'"><div class="lh"><span class="lco">'+(l.company||'—')+'</span>'
        +'<div class="lb">'+callPill+' '+crPill
        +'<button onclick="delLogAll(&apos;'+l.id+'&apos;)" style="font-size:11px;padding:2px 9px;border-radius:99px;border:1px solid var(--td);background:transparent;color:var(--td);cursor:pointer;font-family:var(--font);font-weight:500">기록 삭제</button></div></div>'
        +'<div class="lmg"><div class="lmi">거래업체 <strong>'+(l.current_partner||'—')+'</strong></div>'
        +'<div class="lmi">수수료율 <strong>'+(l.fee_rate||'—')+'</strong></div>'
        +'<div class="lmi">연락처 <strong>'+(l.ceo_contact||'—')+'</strong></div></div>'
        +detail+ap+'</div>'
    })
  }
  h += '</div>'
  box.innerHTML = h
}

// 고객사명 입력/선택 시 가맹점수 자동 표시
function syncBranchInfo(inputId, badgeId){
  const val = document.getElementById(inputId)?.value.trim()
  const badge = document.getElementById(badgeId)
  if(!badge) return
  if(!val){ badge.style.display='none'; return }
  const db = CACHE.db.find(r=>r.name===val)
  if(db){
    const phNum = calcPhase(db.branches||0)
    const phase = phNum===1?'1차':phNum===2?'2차':'3차'
    badge.textContent = isLeader() ? ('🏢 '+db.branches+'개점 · '+phase) : ('🏢 '+phase+' 대상')
    // 기존 TM 이력 알림 표시
    const prevLogs = CACHE.logs.filter(function(l){ return l.company===val })
    const histBadge = badge.parentElement?.querySelector('.tm-hist-badge')
    if(histBadge) histBadge.remove()
    if(prevLogs.length>0){
      const lastLog = prevLogs[0]  // 가장 최근
      const histEl = document.createElement('div')
      histEl.className='tm-hist-badge'
      histEl.style.cssText='font-size:11px;padding:6px 10px;border-radius:var(--r1);background:#FEF3C7;color:#92400E;margin-top:5px;cursor:pointer'
      histEl.innerHTML='📋 기존 TM '+prevLogs.length+'건 있음 · 최근: '+lastLog.log_date+' ('+lastLog.call_result+') — <u>이력 보기</u>'
      histEl.onclick=function(){ showTmHistory(val) }
      badge.parentElement.appendChild(histEl)
    }
    badge.style.display='inline-block'
    badge.style.background = db.phase===2 ? 'var(--bgw)' : 'var(--bgi)'
    badge.style.color = db.phase===2 ? 'var(--tw)' : 'var(--ti)'
  } else {
    badge.style.display='none'
  }
}

// setCompanyInForm 개선: 고객사명 세팅 후 가맹점수도 바로 반영
function setCompanyInForm(name){
  const co = document.getElementById('q-co')
  if(co){
    co.value = name
    co.focus()
    syncBranchInfo('q-co','q-branches-badge')
  }
}

async function delLogAll(id){
  if(!confirm('이 TM 기록을 삭제하시겠습니까?')) return
  await sb.from('tm_logs').delete().eq('id',id)
  CACHE.logs=CACHE.logs.filter(function(l){return l.id!==id})
  renderAll()
}

// ── TM 기록 수정 ──

  const r = CACHE.logs.find(function(l){ return String(l.id)===String(id) })
  if(!r){ alert('기록을 찾을 수 없습니다.'); return }
  if(!isAdmin() && CURRENT_USER?.name !== r.ma_name){
    alert('본인의 TM 기록만 수정할 수 있습니다.'); return
  }
  // 수정 모달 HTML
  const crOpts = ['종결','추가상담'].map(function(v){
    return '<option value="'+v+'"'+(r.consult_result===v?' selected':'')+'>'+v+'</option>'
  }).join('')
  const callOpts = ['응답','부재','거절','문자'].map(function(v){
    return '<option value="'+v+'"'+(r.call_result===v?' selected':'')+'>'+v+'</option>'
  }).join('')
  const html = '<div id="edit-log-overlay" onclick="if(event.target===this)closeEditLog()" style="position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:9000;display:flex;align-items:center;justify-content:center">'

function closeEditLog(){
  const el = document.getElementById('edit-log-overlay')
  if(el) el.remove()
}

async function saveEditLog(id){
  const r = CACHE.logs.find(function(l){ return String(l.id)===String(id) })
  if(!r) return
  const cd = document.getElementById('el-cd')?.value?.trim()
  const cr = document.getElementById('el-cr')?.value
  if(!cd || !cr){ alert('통화결과와 상담내역은 필수입니다.'); return }

  const now = new Date().toISOString()
  const updates = {
    current_partner: document.getElementById('el-cp')?.value?.trim() || null,
    fee_rate:        document.getElementById('el-fr')?.value?.trim() || null,
    ceo_contact:     document.getElementById('el-ct')?.value?.trim() || null,
    call_result:     cr,
    consult_detail:  cd,
    consult_result:  document.getElementById('el-rs')?.value || null,
    action_plan:     document.getElementById('el-ap')?.value?.trim() || null,
    is_edited:       true,
    updated_at:      now
  }

  // is_edited, updated_at 컬럼이 없을 수 있으므로 두 번 시도
  let { error } = await sb.from('tm_logs').update(updates).eq('id', id)
  if(error && (error.message||'').includes('is_edited')){
    // 컬럼 없으면 제외하고 재시도
    delete updates.is_edited
    delete updates.updated_at
    const retry = await sb.from('tm_logs').update(updates).eq('id', id)
    if(retry.error){ alert('저장 실패: '+retry.error.message); return }
  } else if(error){
    alert('저장 실패: '+error.message); return
  }

  // CACHE 업데이트
  Object.assign(r, updates)
  closeEditLog()
  reRenderActive()
}

// MA 카드 배정 대상처 HTML (완료 먼저 정렬 + 취소선)
function _cardAssignedHtml(assigned, m, logs){
  if(!assigned.length) return ''
  const performed = new Set(logs.map(function(l){ return l.company }))
  const sorted = assigned.slice().sort(function(a,b){
    return (performed.has(a.name)?1:0)-(performed.has(b.name)?1:0)
  })
  const show = sorted.slice(0,3)
  const more = assigned.length>3 ? '<div class="ai">+'+(assigned.length-3)+'건 더</div>' : ''
  const rows = show.map(function(r){
    const done = performed.has(r.name)
    const ds = done ? 'text-decoration:line-through;opacity:0.38;color:var(--t2)' : ''
    const pfx = r.assign2===m ? '[2차] ' : ''
    return '<div class="ai '+(r.assign2===m?'r2':'')+'" style="'+ds+'">'+pfx+'<i class="ti ti-building" style="font-size:11px"></i> '+r.name+'</div>'
  }).join('')
  return '<div style="margin-top:6px">'+rows+more+'</div>'
}

      <div class="mn">${m}${r2cnt>0?'<span class="t2nd">2차 '+r2cnt+'</span>':''} ${isV?'<span style="font-size:10px;color:var(--t2);font-weight:400">(휴무)</span>':''}</div>
      <div class="ms">${isV?'휴무/부재':cnt>0?`<b style="color:#1D9E75">${cnt}건</b> ${cnt>=q?'✓ 완료':cnt>0?'진행중':'미시작'}`:`${cnt}건 미시작`}</div>
      <div class="pw"><div class="pp" style="width:${Math.round(pct*100)}%;background:${bc}"></div></div>
      <div class="mp">${isV?'-':Math.round(pct*100)+'%'}</div>

async function setQtBtn(ma,date,v,team){
  const existing=CACHE.quotas.find(q=>q.ma_name===ma&&q.quota_date===date)
  // 휴무(v=0) 토글: 이미 휴무면 → 1건으로 복구
  if(v===0 && existing && existing.quota===0){
    v=1  // 휴무 취소 → 기본 1건으로 복구
  }
  if(existing){
    await sb.from('ma_quotas').update({quota:v}).eq('ma_name',ma).eq('quota_date',date)
    existing.quota=v
  }else{
    const{data}=await sb.from('ma_quotas').insert({ma_name:ma,quota_date:date,quota:v}).select().single()
    if(data)CACHE.quotas.push(data)
  }
  renderTeam(team)
}

        <td style="color:var(--ti);white-space:pre-wrap;word-break:break-all">${hf(r.action_plan)||'—'}</td>
      <td style="white-space:nowrap">
        ${r.is_edited ? `<span style="font-size:9px;color:var(--tw);margin-right:4px" title="수정됨: ${(r.updated_at||'').slice(0,10)}">✏ 수정됨</span>` : ''}
        <button onclick="openEditLog('${r.id}')" style="font-size:11px;padding:2px 8px;border-radius:99px;border:0.5px solid var(--b2);background:transparent;color:var(--t2);cursor:pointer;font-family:var(--font);margin-right:3px">수정</button>
        <button onclick="deleteTmLog('${r.id}','${r.ma_name}')" style="font-size:11px;padding:2px 8px;border-radius:99px;border:0.5px solid var(--td);background:transparent;color:var(--td);cursor:pointer;font-family:var(--font)">기록 삭제</button>
      </td>
      </tr>`
    })
    h+=`</tbody></table></div>`
  }
  document.getElementById('tab-tmlog').innerHTML=h
}

function getFiltered(){
  const all=getAllRows(),tf=document.getElementById('tl-team')?.value||'',mf=document.getElementById('tl-ma')?.value||'',cf=document.getElementById('tl-call')?.value||'',crf=document.getElementById('tl-cr')?.value||'',ff=document.getElementById('tl-from')?.value||'',tf2=document.getElementById('tl-to')?.value||'',kl=(document.getElementById('tl-kw')?.value||'').trim().toLowerCase()
  return all.filter(r=>{
    if(tf&&r.team!==tf)return false;if(mf&&r.ma_name!==mf)return false;if(cf&&r.call_result!==cf)return false;if(crf&&r.consult_result!==crf)return false;if(ff&&r.log_date<ff)return false;if(tf2&&r.log_date>tf2)return false
    if(kl){const h=[r.company,r.current_partner,r.fee_rate,r.ceo_contact,r.consult_detail,r.action_plan,r.ma_name].join(' ').toLowerCase();if(!h.includes(kl))return false}
    return true
  })
}

  const hdr=['날짜','팀','MA','고객사명','현거래업체','수수료율','대표자연락처','통화결과','상담내역','상담결과','액션플랜']

  const blob=new Blob(['\uFEFF'+csv.map(r=>r.join(',')).join('\n')],{type:'text/csv;charset=utf-8'})

// ── DB 패널 ──
function dbPanelHtml(){
  const allMaOptsForReassign = [...EAST,...WEST].filter(m=>isActiveMa(m)).map(m=>`<option value="${m}">${m} (${EAST.includes(m)?'동부':'서부'})</option>`).join('')
  const p1=getPhaseProgress(1), p2=getPhaseProgress(2), p3=getPhaseProgress(3)
  const totalTarget = CACHE.db.filter(r=>r.is_target!==false).length
  const totalExcl = CACHE.db.filter(r=>r.is_target===false).length
  const assigned = CACHE.db.filter(r=>r.assign1)
  const unassigned = CACHE.db.filter(r=>!r.assign1)

  // ── 진행 현황 바 (동부/서부 분리) ──
  const phaseBar = function(ph, label, col1, col2){
    const teams = allTeams()
    const progAll = getPhaseProgressByRegion(ph,'all')
    const pct = progAll.pct
    const barCol = pct===100?'var(--ts)':pct>=50?col1:col2

    // 1차는 자동 승인, 2·3차는 팀별 승인 버튼
    let approveHtml = ''
    if(ph===1){
      approveHtml = '<span style="font-size:10px;padding:1px 7px;border-radius:99px;background:var(--bgi);color:var(--ti)">기본 승인</span>'
    } else {
      approveHtml = '<div style="display:flex;gap:4px;flex-wrap:wrap">'
        + teams.map(function(t){
            const ap = isPhaseApprovedByRegion(ph, t.id)
            const short = t.name.replace('팀','')
            return ap
              ? '<span style="font-size:10px;padding:1px 6px;border-radius:99px;background:var(--bgi);color:var(--ti)">'+short+'✓</span>'
              : '<button onclick="approvePhase('+ph+',\''+t.id+'\')" style="font-size:10px;padding:2px 7px;border-radius:99px;background:var(--bgw);color:var(--tw);border:0.5px solid var(--tw);cursor:pointer;font-family:var(--font)">'+short+' 승인</button>'
          }).join('')
        + '</div>'
    }

    // 팀별 진행 현황 텍스트 (동적)
    const teamStats = teams.map(function(t){
      const p = getPhaseProgressByRegion(ph, t.id)
      return '<span style="color:'+(t.color||'var(--t2)')+'">'+t.name.replace('팀','')+' '+p.done+'/'+p.total+'</span>'
    }).join(' · ')

    return '<div style="flex:1;min-width:160px;background:var(--bg2);border-radius:var(--r1);padding:8px 10px">'
      + '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;gap:6px;flex-wrap:wrap">'
      + '<span style="font-size:12px;font-weight:500;color:var(--t1)">'+label+'</span>'
      + approveHtml
      + '</div>'
      + '<div style="font-size:11px;color:var(--t2);margin-bottom:4px">'
      + '전체 '+progAll.done+'/'+progAll.total+'건 ('+pct+'%) · '+teamStats
      + '</div>'
      + '<div style="height:5px;background:var(--b3);border-radius:99px"><div style="height:100%;width:'+pct+'%;background:'+barCol+';border-radius:99px;transition:width .3s"></div></div>'
      + '</div>'
  }

  let h = '<div class="pn">'
    + '<div class="pnt"><i class="ti ti-database" style="font-size:16px"></i>DB 관리'
    + '<div style="margin-left:auto;display:flex;gap:6px">'
    + '<button class="btn s p" onclick="doAutoAssign()"><i class="ti ti-wand" style="font-size:13px"></i> 단계 랜덤 할당</button>'
    + '<button class="btn s" onclick="recalcPhases()" title="가맹점수 기준으로 1·2·3차 다시 분류">차수 재계산</button>'
    + '<button class="btn s" onclick="exportExcluded()" title="제외(N) 처리된 거래처 목록 다운로드" style="color:var(--td);border-color:var(--td)">제외목록 추출</button>'
    + '<button class="btn s dng" onclick="resetDB()">초기화</button>'
    + '</div></div>'

  // 전체 현황 요약 + 가맹점수 분포 (진단용)
  const cnt1=CACHE.db.filter(r=>calcPhase(r.branches||0)===1).length
  const cnt2=CACHE.db.filter(r=>calcPhase(r.branches||0)===2).length
  const cnt3=CACHE.db.filter(r=>calcPhase(r.branches||0)===3).length
  h += '<div style="display:flex;gap:6px;margin-bottom:.75rem;flex-wrap:wrap">'
    + '<div style="font-size:12px;color:var(--t2);align-self:center">전체 '+CACHE.db.length+'건 · 대상 '+totalTarget+'건 · 제외 <span style="color:var(--td)">'+totalExcl+'건</span> · 할당 '+assigned.length+'건 · 미배정 '+unassigned.length+'건 <span style="color:var(--t3)">|</span> 1차 '+cnt1+' · 2차 '+cnt2+' · 3차 '+cnt3+'건</div>'
    + '</div>'

  // 1·2·3차 진행현황 바
  h += '<div style="display:flex;gap:8px;margin-bottom:.75rem;flex-wrap:wrap">'
    + phaseBar(1,'1차 (10개↑)','#1D9E75','rgba(0,0,0,.2)')
    + phaseBar(2,'2차 (5~9개)','#BA7517','rgba(0,0,0,.2)')
    + phaseBar(3,'3차 (4개↓)','#A32D2D','rgba(0,0,0,.2)')
    + '</div>'

  // CSV 업로드 영역
  h += '<div class="ua" onclick="document.getElementById(\'csv-input\').click()">'
    + '<i class="ti ti-upload" style="font-size:20px;color:var(--t2);display:block;margin:0 auto 5px"></i>'
    + '<div style="font-size:13px;color:var(--t2)">CSV 파일 업로드</div>'
    + '<div style="font-size:11px;color:var(--t2);margin-top:4px">'
    + '📎 <strong>엑셀(.xlsx/.xls) 또는 CSV(.csv)</strong> 모두 가능<br>'
    + '컬럼 순서: <strong>고객처(영업표지), 가맹점수, 관할구역, 대상(Y/N)</strong><br>'
    + '관할구역엔 팀명(동부/서부/중부 등) 입력 — 등록된 팀명과 자동 매칭<br>'
    + '1행 = 헤더(제목행), 2행부터 데이터 인식 · 대상 N → 자동 제외<br>'
    + '가맹점 10개↑=1차 · 5~9개=2차 · 4개↓=3차 자동 분류'
    + '</div></div>'
  h += '<input type="file" id="csv-input" accept=".csv,.xlsx,.xls" style="display:none">'

  // 직접 추가 폼
  h += '<div style="background:var(--bg2);border-radius:var(--r1);padding:12px 14px;margin-bottom:.75rem">'
    + '<div style="font-size:12px;font-weight:500;color:var(--t1);margin-bottom:8px"><i class="ti ti-plus" style="font-size:13px"></i> 거래처 직접 추가</div>'
    + '<div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">'
    + '<input type="text" id="db-add-name" placeholder="고객처명*" style="flex:1;min-width:120px;font-size:13px;padding:7px 9px">'
    + '<input type="number" id="db-add-branches" placeholder="가맹점수*" min="0" style="width:90px;font-size:13px;padding:7px 9px">'
    + '<select id="db-add-region" style="width:110px;font-size:13px;padding:7px 9px">'+allTeams().map(function(t){return '<option value="'+t.id+'">'+t.name+'</option>'}).join('')+'</select>'
    + '<select id="db-add-target" style="width:85px;font-size:13px;padding:7px 9px"><option value="Y">대상(Y)</option><option value="N">제외(N)</option></select>'
    + '<button class="btn p" onclick="addDBRow()" style="padding:7px 14px;font-size:13px;font-weight:600">추가</button>'
    + '</div>'
    + '<div id="db-add-msg" style="font-size:12px;margin-top:6px;min-height:14px"></div>'
    + '</div>'

  // 담당 MA 일괄 변경
  h += '<div style="background:var(--bgi);border-radius:var(--r1);padding:10px 14px;margin-bottom:.75rem">'
    + '<div style="font-size:12px;font-weight:500;color:var(--ti);margin-bottom:7px"><i class="ti ti-transfer" style="font-size:13px"></i> 담당 MA 일괄 변경</div>'
    + '<div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">'
    + `<select id="reassign-from" style="font-size:13px;padding:7px 9px;min-width:110px"><option value="">기존 담당 MA</option>${allMaOptsForReassign}</select>`
    + '<span style="font-size:13px;color:var(--t2)">→</span>'
    + `<select id="reassign-to" style="font-size:13px;padding:7px 9px;min-width:110px"><option value="">변경할 MA</option>${allMaOptsForReassign}</select>`
    + '<button class="btn p" onclick="bulkReassign()" style="padding:7px 14px;font-size:13px;font-weight:600">전체 이관</button>'
    + '<span id="reassign-msg" style="font-size:12px;color:var(--ts)"></span>'
    + '</div></div>'

  if(!CACHE.db.length){ h += '</div>'; return h }

  // ── 동부 / 서부 탭 ──
  const selRegion = window.DB_REGION_TAB || 'all'
  h += '<div style="display:flex;gap:4px;margin-bottom:.75rem">'
  const regionTabs = [['all','전체']].concat(allTeams().map(function(t){ return [t.id, t.name.replace('팀','')] }))
  regionTabs.forEach(function(pair){
    const on = selRegion===pair[0]
    h += '<button onclick="setDbRegionTab(\''+pair[0]+'\')" style="padding:5px 14px;border-radius:var(--r1);border:0.5px solid var(--b2);background:'
      +(on?'var(--ti)':'transparent')+';color:'+(on?'#fff':'var(--t2)')+';font-size:13px;cursor:pointer;font-family:var(--font)">'+pair[1]+'</button>'
  })
  h += '</div>'

  // 필터 행
  h += '<div class="fr">'
    + '<select id="db-fp" onchange="refreshDBTable()"><option value="">1·2·3차 전체</option><option value="1">1차(10개↑)</option><option value="2">2차(5~9개)</option><option value="3">3차(4개↓)</option></select>'
    + '<select id="db-fs" onchange="refreshDBTable()"><option value="">전체 상태</option><option value="u">미할당</option><option value="a1">1차 할당</option><option value="a2">2차 할당</option></select>'
    + '<select id="db-ft" onchange="refreshDBTable()"><option value="">대상 전체</option><option value="y">대상(Y)</option><option value="n">제외(N)</option></select>'
    + '<select id="db-fd" onchange="refreshDBTable()"><option value="">완료여부 전체</option><option value="done">TM완료</option><option value="pending">미완료</option></select>'
    + '<select id="db-fsrc" onchange="refreshDBTable()"><option value="">등록경로 전체</option><option value="ma">MA등록분</option></select>'

    + '<colgroup><col style="width:20%"><col style="width:7%"><col style="width:6%"><col style="width:6%"><col style="width:11%"><col style="width:15%"><col style="width:15%"><col style="width:20%"></colgroup>'
    + '<thead><tr>'
    + '<th>거래처명</th><th>가맹점</th><th>권역</th><th>차수</th><th>대상</th><th>1차 담당</th><th>2차 담당</th><th>관리</th>'
    + '</tr></thead><tbody id="db-tbody"></tbody></table></div>'

  h += '</div>'
  return h
}

function setDbRegionTab(region){
  window.DB_REGION_TAB = region
  renderDBTab()
}
function refreshDBTable(){
  const tbody=document.getElementById('db-tbody'); if(!tbody) return
  const selRegion = window.DB_REGION_TAB || 'all'
  const fp=document.getElementById('db-fp')?.value||''
  const sf=document.getElementById('db-fs')?.value||''
  const tf=document.getElementById('db-ft')?.value||''
  const fd=document.getElementById('db-fd')?.value||''
  const kw=(document.getElementById('db-sk')?.value||'').trim().toLowerCase()

  const rows=CACHE.db.filter(r=>{
    if(selRegion!=='all' && r.region!==selRegion) return false
    if(kw && !r.name.toLowerCase().includes(kw)) return false
    const st=r.assign2?'a2':r.assign1?'a1':'u'
    if(sf && st!==sf) return false
    if(tf==='y' && r.is_target===false) return false
    if(tf==='n' && r.is_target!==false) return false
    const ph=calcPhase(r.branches||0)
    if(fp && ph!==parseInt(fp)) return false
    const done=CACHE.logs.some(function(l){return l.company===r.name})
    if(fd==='done' && !done) return false
    if(fd==='pending' && done) return false
    const fsrc=document.getElementById('db-fsrc')?.value||''
    if(fsrc==='ma' && r.source!=='ma_added') return false
    return true
  })

  tbody.innerHTML = rows.map(function(r){
    const ph = calcPhase(r.branches||0)
    const phLabel = ph===1?'1차':ph===2?'2차':'3차'
    const phCol = ph===1?'var(--bgi)':ph===2?'var(--bgw)':'var(--bgd)'
    const phTxt = ph===1?'var(--ti)':ph===2?'var(--tw)':'var(--td)'
    const done = CACHE.logs.some(function(l){return l.company===r.name})
    const isTarget = r.is_target!==false
    const rowStyle = isTarget ? '' : 'opacity:.4;'
    const doneBadge = done ? '<span style="font-size:9px;color:var(--ts);margin-left:2px">✓</span>' : ''

    const allActiveMA=[...EAST,...WEST].filter(m=>isActiveMa(m))
    const a1Opts = r.assign1
      ? allActiveMA.filter(m=>m!==r.assign1).map(m=>`<option value="${m}">${m}(${EAST.includes(m)?'동':'서'})</option>`).join('')
      : allActiveMA.map(m=>`<option value="${m}">${m}(${EAST.includes(m)?'동':'서'})</option>`).join('')
    const a1Html = `<span style="font-size:12px">${r.assign1||''}</span><select style="font-size:11px;padding:3px 4px;border-radius:4px;max-width:100px;background:var(--bgi);color:var(--ti);border:0.5px solid var(--bi)" onchange="changeAssign1(${r.id},this.value)"><option value="">${r.assign1?'▾ 변경':'▾ 배정'}</option>${a1Opts}</select>`

    const a2h = r.assign2
      ? `<span style="font-size:12px;color:var(--ti)">${r.assign2}</span>`
      : r.r2_enabled
        ? `<select style="font-size:11px;padding:2px 4px" onchange="setAssign2(${r.id},this.value)"><option value="">배정</option>${allActiveMA.filter(m=>m!==r.assign1).map(m=>`<option>${m}</option>`).join('')}</select>`
        : '<span style="font-size:11px;color:var(--t3)">—</span>'

    // 대상 Y/N 토글
    const targetToggle = `<span style="font-size:11px;padding:2px 7px;border-radius:99px;background:${isTarget?'var(--bgs)':'var(--bgd)'};color:${isTarget?'var(--ts)':'var(--td)'};">${isTarget?'Y':'N'}</span> <button class="btn s" onclick="toggleTarget(${r.id},${isTarget})" style="padding:1px 6px;font-size:10px">${isTarget?'제외':'포함'}</button>`

    const st=r.assign2?'a2':r.assign1?'a1':'u'
    const stL=r.assign2?'2차할당':r.assign1?'1차할당':'미할당'
    return `<tr style="${rowStyle}">`
      + `<td title="${r.name}" style="font-weight:500">${r.name}${doneBadge}${histBadge}</td>`
      + `<td>${isLeader()
          ? `<span style="cursor:pointer;border-bottom:1px dashed var(--b2)" onclick="editBranches(${r.id})" title="클릭하여 수정">${(r.branches||0).toLocaleString()}</span>`
          : '<span style="color:var(--t3)">●●</span>'}</td>`
      + `<td><span style="font-size:10px;padding:1px 5px;border-radius:99px;background:var(--bg2);color:${teamColor(r.region)};border:0.5px solid ${teamColor(r.region)}">${teamName(r.region).replace('팀','')}</span></td>`
      + `<td><span style="font-size:10px;padding:1px 5px;border-radius:99px;background:${phCol};color:${phTxt}">${phLabel}</span></td>`
      + `<td>${targetToggle}</td>`
      + `<td>${a1Html}</td>`
      + `<td>${a2h}</td>`
      + `<td><div style="display:flex;gap:3px;flex-wrap:wrap;align-items:center">`
      + `<span class="bdg ${st}" style="font-size:10px">${stL}</span>`
      + (!r.r2_enabled&&r.assign1&&!r.assign2?`<button class="btn s" onclick="enableR2(${r.id})" style="padding:2px 5px;font-size:10px;color:var(--ti)">2차</button>`:'')

function bindFileInput(){const inp=document.getElementById('csv-input');if(inp)inp.onchange=handleFile}
function handleFile(e){
  const file = e.target.files[0]; if(!file) return
  const ext = file.name.split('.').pop().toLowerCase()

  if(ext==='xlsx' || ext==='xls'){
    // ── 엑셀 파일 처리 (SheetJS) ──
    const reader = new FileReader()
    reader.onload = async function(ev){
      try{
        const data = new Uint8Array(ev.target.result)
        const wb = XLSX.read(data, {type:'array'})
        const ws = wb.Sheets[wb.SheetNames[0]]
        // 1행=헤더, 2행부터 데이터 (header:1 = 배열 형태, 직접 row객체로 변환)
        const raw = XLSX.utils.sheet_to_json(ws, {header:1, defval:''})
        if(raw.length < 2){ alert('데이터가 없습니다. (2행부터 데이터가 있어야 합니다)'); return }
        const headers = raw[0].map(function(h){ return String(h).trim() })
        const dataRows = raw.slice(1)  // 2행부터
        const rowObjs = dataRows.map(function(row){
          const obj={}
          headers.forEach(function(h,i){ obj[h]=row[i]!==undefined?row[i]:'' })
          return obj
        })
        await processDBRows(rowObjs)
      }catch(err){ alert('엑셀 파싱 실패: '+err.message) }
    }
    reader.readAsArrayBuffer(file)
  } else {
    // ── CSV 파일 처리 (PapaParse) ──
    const reader = new FileReader()
    reader.onload = async function(ev){
      Papa.parse(ev.target.result, {header:true, skipEmptyLines:true, complete:async function(res){
        await processDBRows(res.data)
      }})
    }
    reader.readAsText(file, 'UTF-8')
  }
  // input 초기화 (같은 파일 재업로드 가능하게)
  e.target.value = ''
}

// CSV/엑셀 공통 파싱 로직
async function processDBRows(rawData){
  const rows = rawData.map(function(row){
    // 컬럼명 매핑: 고객처(영업표지)/본사명 등 유연하게 인식
    const name = (row['고객처(영업표지)']||row['고객처']||row['영업표지']||row['본사명']||row['name']||'').toString().trim()
    const branches = parseInt(row['가맹점수']||row['가맹점']||row['매장수']||0)
    const region = (row['관할구역']||row['관할지역']||row['권역']||'').toString().trim()
    const targetRaw = (row['대상(Y/N)']||row['대상']||row['대상유무']||'Y').toString().trim().toUpperCase()
    const is_target = targetRaw==='Y' || targetRaw===''
    const r = matchRegionToTeam(region)  // 동적 팀ID 매칭 (동/서부 + 신규 팀)
    const b = isNaN(branches) ? 0 : branches
    const phase = calcPhase(b)
    return name ? {name, branches:b, region:r, is_target, phase,
      phase_approved: phase===1,
      assign1:null, assign2:null, r2_enabled:false} : null
  }).filter(Boolean)

  if(!rows.length){ alert('유효한 데이터가 없습니다.\n헤더행(1행)과 데이터행(2행~)을 확인해주세요.'); return }

  // 기존 TM 완료 거래처 보호 및 제외 처리 보존
  const existingExcluded = new Set(
    CACHE.db.filter(function(r){ return r.is_target===false }).map(function(r){ return r.name })
  )
  const completedCompanies = new Set(CACHE.logs.map(function(l){ return l.company }))

  let excludedCnt=0, protectedCnt=0, newRows=[], skippedRows=[]
  rows.forEach(function(r){
    // 제외 처리 보존
    if(existingExcluded.has(r.name)){ r.is_target=false; excludedCnt++ }
    // TM 완료 거래처: 이미 DB에 있으면 삭제 안 하도록 새 업로드에서 제외 (기존 유지)
    if(completedCompanies.has(r.name)){
      skippedRows.push(r.name)
      protectedCnt++
    } else {
      newRows.push(r)
    }
  })
  if(protectedCnt>0) console.log('[DB업로드] TM 완료 거래처 '+protectedCnt+'건 보호 (업로드 건너뜀, 기존 데이터 유지)')
  if(excludedCnt>0) console.log('[DB업로드] 기존 제외 거래처 '+excludedCnt+'건 동일 적용')

  // 실제 삽입은 새 거래처만
  const rows_final = newRows

  if(!rows_final.length){
    alert('새로 추가할 거래처가 없습니다.\n(TM 완료 거래처 '+protectedCnt+'건은 기존 데이터 유지)')
    return
  }
  const {data, error} = await sb.from('company_db').insert(rows_final).select()
  if(error){ alert('업로드 실패: '+error.message); return }
  CACHE.db = [...CACHE.db, ...(data||[])]
  CACHE.db.sort(function(a,b){ return b.branches-a.branches })
  alert(rows.length+'건 업로드 완료\n1차: '+rows.filter(r=>r.phase===1).length+'건 · 2차: '+rows.filter(r=>r.phase===2).length+'건 · 3차: '+rows.filter(r=>r.phase===3).length+'건')
  renderDBTab()
  renderAll()
}

// 배열 셔플 (Fisher-Yates)
function shuffle(arr){
  const a=[...arr]
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]] }
  return a
}

// 1차(가맹점 5개 이상) / 2차(미만) 할당 — 1차 우선
async function doAutoAssign(){
  const teams = allTeams()
  // 완료된 거래처 set (재배정 시 제외)
  const completedNames = new Set(CACHE.logs.map(function(l){ return l.company }))
  const poolFor = function(teamId, ph){
    return CACHE.db.filter(function(r){
      return r.region===teamId
        && !r.assign1          // 미배정
        && r.is_target!==false // 대상
        && calcPhase(r.branches||0)===ph
        && !completedNames.has(r.name)  // TM 미완료
    })
  }
  // 재배정 전용: assign1 있어도 TM 미완료면 재배정 풀에 포함
  const rePoolFor = function(teamId, ph){
    return CACHE.db.filter(function(r){
      return r.region===teamId
        && r.is_target!==false
        && calcPhase(r.branches||0)===ph
        && !completedNames.has(r.name)  // TM 미완료만
    })
  }
  // 업종 우선 정렬: MA의 주업종에 해당하는 브랜드를 앞으로
  const sortByCategory = function(pool, ma){
    const cats = getMaCategories(ma)
    if(!cats.length) return pool
    return pool.slice().sort(function(a,b){
      const aMatch = cats.indexOf(a.category||'') >= 0
      const bMatch = cats.indexOf(b.category||'') >= 0
      if(aMatch && !bMatch) return -1
      if(!aMatch && bMatch) return 1
      return 0
    })
  }

  // 차수별 미배정 존재 여부 (전체 팀 합산)
  const hasPhase = function(ph){ return teams.some(function(t){ return poolFor(t.id,ph).length>0 }) }
  const has1=hasPhase(1), has2=hasPhase(2), has3=hasPhase(3)
  if(!has1&&!has2&&!has3){ alert('할당할 미배정 대상이 없습니다.'); return }

  const p1=getPhaseProgress(1), p2=getPhaseProgress(2), p3=getPhaseProgress(3)

  // 할당할 차수 결정: 1차 우선, 그다음 승인된 팀이 하나라도 있는 차수
  const anyApproved = function(ph){ return teams.some(function(t){ return isPhaseApprovedByRegion(ph,t.id) }) }
  let targetPhase = 0
  if(has1) targetPhase=1
  else if(has2 && anyApproved(2)) targetPhase=2
  else if(has3 && anyApproved(3)) targetPhase=3

  let msg='📋 DB 할당 현황\n─────────────────\n'
  msg+='1차(10개↑): 전체 '+p1.total+'건 · TM완료 '+p1.done+'건 ('+p1.pct+'%)'+(p1.pct===100?' ✅':'')+'\n'
  msg+='2차(5~9개): 전체 '+p2.total+'건 · TM완료 '+p2.done+'건 ('+p2.pct+'%)'+(p2.pct===100?' ✅':'')+'\n'
  msg+='3차(4개↓): 전체 '+p3.total+'건 · TM완료 '+p3.done+'건 ('+p3.pct+'%)'+(p3.pct===100?' ✅':'')+'\n'
  msg+='─────────────────\n\n'

  if(targetPhase===0){
    const nextPh = !has1&&has2?2:3
    msg+='⚠ '+nextPh+'차 대상 할당은 팀별 승인이 필요합니다.\n진행현황 바에서 각 팀 "승인" 버튼을 먼저 눌러주세요.'
    alert(msg); return
  }

  // 팀별로 (1차는 무조건, 2·3차는 승인된 팀만) 풀 구성
  const teamPools = teams.map(function(t){
    const approved = (targetPhase===1) || isPhaseApprovedByRegion(targetPhase, t.id)
    const pool = approved ? poolFor(t.id, targetPhase) : []
    const active = t.members.filter(function(m){ return isActiveMa(m) })
    return { team:t, pool, active }
  }).filter(function(x){ return x.pool.length>0 })

  if(!teamPools.length){
    alert(targetPhase+'차 대상 중 승인되어 할당 가능한 건이 없습니다.\n팀별 승인 상태를 확인해주세요.')
    return
  }

  const totalCnt = teamPools.reduce(function(s,x){ return s+x.pool.length },0)
  msg+='→ '+targetPhase+'차 대상 '+totalCnt+'건을 랜덤 할당합니다.\n'
  msg+=teamPools.map(function(x){ return '  '+x.team.name+' '+x.pool.length+'건' }).join('\n')
  if(!confirm(msg)) return

  const updates=[]
  let skipNoMember=0
  teamPools.forEach(function(x){
    if(!x.active.length){ skipNoMember+=x.pool.length; return }  // 재직 MA 없는 팀은 건너뜀
    const sortedPool = sortByCategory(x.pool, x.active[0]||'')
    shuffle(sortedPool).forEach(function(r,i){
      r.assign1 = x.active[i % x.active.length]
      r.phase = targetPhase
      r.phase_approved = true
      updates.push({id:r.id, assign1:r.assign1, phase:targetPhase, phase_approved:true})
    })
  })

  for(const u of updates) await sb.from('company_db').update({assign1:u.assign1,phase:u.phase,phase_approved:u.phase_approved}).eq('id',u.id)
  let done = targetPhase+'차 할당 완료: 총 '+updates.length+'건\n'
    + teamPools.filter(function(x){return x.active.length}).map(function(x){ return x.team.name+' '+x.pool.length+'건' }).join(' · ')
  if(skipNoMember>0) done += '\n\n※ 재직 MA가 없는 팀의 '+skipNoMember+'건은 할당되지 않았습니다.'
  alert(done)
  renderDBTab()
  renderAll()
}

// 1차 대상 거래처의 TM 수행 완료 여부 (해당 거래처로 TM 기록이 1건 이상)

// 특정 차수 진행률 계산
function getPhaseProgress(ph){
  const list = CACHE.db.filter(r=>r.is_target!==false && calcPhase(r.branches||0)===ph)
  const done = list.filter(r=>_isPhase1Done(r)).length
  return {total:list.length, done, pct: list.length>0?Math.round(done/list.length*100):0}
}

// 가맹점수 기준으로 모든 거래처의 차수(phase) 재계산 + 저장
async function recalcPhases(){
  if(!isAdmin()){ requireAuth('차수 재계산은 관리자 PIN이 필요합니다.', recalcPhases, 'admin'); return }
  let changed=0
  const counts={1:0,2:0,3:0}
  for(const r of CACHE.db){
    const correct=calcPhase(r.branches||0)
    counts[correct]++
    if(r.phase!==correct){
      r.phase=correct
      await sb.from('company_db').update({phase:correct}).eq('id',r.id)
      changed++
    }
  }
  alert('차수 재계산 완료\n\n'
    +'1차(10개↑): '+counts[1]+'건\n'
    +'2차(5~9개): '+counts[2]+'건\n'
    +'3차(4개↓): '+counts[3]+'건\n\n'
    +'수정된 항목: '+changed+'건')
  renderDBTab()
  renderAll()
}

// 가맹점 수 수정 (관리자) — 수정 시 차수도 자동 재계산
async function editBranches(id){
  if(!isAdmin()){ requireAuth('가맹점 수 수정은 관리자 PIN이 필요합니다.', function(){ editBranches(id) }, 'admin'); return }
  const r = CACHE.db.find(x=>x.id===id)
  if(!r) return
  const input = prompt('"'+r.name+'"의 가맹점 수를 입력하세요.', r.branches||0)
  if(input===null) return
  const n = parseInt(input)
  if(isNaN(n) || n<0){ alert('0 이상의 숫자를 입력해주세요.'); return }
  const newPhase = calcPhase(n)
  const phaseChanged = newPhase !== r.phase
  await sb.from('company_db').update({branches:n, phase:newPhase}).eq('id',id)
  r.branches = n
  r.phase = newPhase
  refreshDBTable()
  renderDBTab()
  renderAll()
  if(phaseChanged){
    const phLbl={1:'1차(10개↑)',2:'2차(5~9개)',3:'3차(4개↓)'}
    setTimeout(function(){ alert('가맹점 수 '+n+'개로 변경 → '+phLbl[newPhase]+'로 자동 분류되었습니다.') }, 100)
  }
}

async function promptAddNewCompany(name, ma){

  if(bInput===null) return null
  const branches = parseInt(bInput) || 0

  // 권역(팀) 선택 — 본인 팀으로 기본 배정
  const myTeam = maTeam(ma) || (allTeams()[0] && allTeams()[0].id) || 'east'
  const phase = calcPhase(branches)

  const newRow = {
    name: name,
    branches: branches,
    region: myTeam,
    is_target: true,
    phase: phase,
    phase_approved: true,   // 본인이 이미 접촉했으므로 승인 처리
    assign1: ma,            // 본인 담당으로 배정
    assign2: null,
    r2_enabled: false,
    source: 'ma_added'      // MA가 추가했음을 표시 (관리자 검수용)
  }

  const { data, error } = await sb.from('company_db').insert(newRow).select().single()
  if(error){
    // source 컬럼이 없을 경우 대비: 재시도(컬럼 제외)
    if(String(error.message||'').toLowerCase().includes('source')){

      const retry = await sb.from('company_db').insert(newRow).select().single()
      if(retry.error){ alert('등록 실패: '+retry.error.message); return null }
      CACHE.db.push(retry.data)
      return retry.data
    }
    alert('등록 실패: '+error.message)
    return null
  }
  CACHE.db.push(data)
  return data
}

// 해당 차수 승인 여부 (phase_approved 또는 1차는 기본 true)
function isPhaseApproved(ph){

  // DB에서 해당 차수의 승인된 거래처가 1개라도 있으면 승인됨으로 간주
  return CACHE.db.some(r=>r.is_target!==false && calcPhase(r.branches||0)===ph && r.phase_approved===true)
}

// 단계 승인: 동부/서부 × 차수별 분리 승인
async function approve2ndPhase(){ approvePhase(2,'all') }  // 하위호환

// ph: 1|2|3, region: 'east'|'west'|'all'
async function approvePhase(ph, region){
  if(!region) region='all'
  const phLabel = {1:'1차(10개↑)',2:'2차(5~9개)',3:'3차(4개↓)'}
  const regionLabel = region==='east'?'동부':region==='west'?'서부':'전체'
  const prevPh = ph-1

  // 이전 차수 진행률 (같은 권역)
  const prevProg = prevPh>=1 ? getPhaseProgressByRegion(prevPh, region) : {done:0,total:0,pct:100}
  // 승인할 대상 목록
  const thisList = CACHE.db.filter(function(r){
    if(r.is_target===false) return false
    if(calcPhase(r.branches||0)!==ph) return false
    if(region!=='all' && r.region!==region) return false
    return true
  })

  let msg='📋 ['+regionLabel+'] '+phLabel[ph]+' TM 승인\n\n'
  if(prevPh>=1){
    msg+=phLabel[prevPh]+' 진행률('+regionLabel+'): '
      +prevProg.done+'/'+prevProg.total+'건 ('+prevProg.pct+'%)\n'
    msg+= prevProg.pct<100 ? '⚠ 이전 단계가 완료되지 않았습니다.\n' : '✅ 이전 단계 완료!\n'
  }
  msg+='\n['+regionLabel+'] '+phLabel[ph]+' 대상 총 '+thisList.length+'건을 TM 진행 승인합니다.'
  if(!confirm(msg)) return

  const updates = thisList.map(function(r){ return {id:r.id, phase:ph, phase_approved:true} })
  for(const u of updates){
    await sb.from('company_db').update({phase:u.phase, phase_approved:true}).eq('id',u.id)
    const r=CACHE.db.find(function(x){return x.id===u.id})
    if(r){r.phase=u.phase; r.phase_approved=true}
  }
  alert('['+regionLabel+'] '+ph+'차 TM 승인 완료! ('+updates.length+'건)\n이제 랜덤 할당 버튼으로 MA에게 배분하세요.')
  renderDBTab()
}

// 권역별 차수 진행률
function getPhaseProgressByRegion(ph, region){
  const list = CACHE.db.filter(function(r){
    if(r.is_target===false) return false
    if(calcPhase(r.branches||0)!==ph) return false
    if(region!=='all' && r.region!==region) return false
    return true
  })
  const done = list.filter(function(r){ return _isPhase1Done(r) }).length
  return {total:list.length, done, pct:list.length>0?Math.round(done/list.length*100):0}
}

// 권역별 승인 여부
function isPhaseApprovedByRegion(ph, region){
  if(ph===1) return true
  return CACHE.db.some(function(r){
    if(r.is_target===false) return false
    if(calcPhase(r.branches||0)!==ph) return false
    if(region!=='all' && r.region!==region) return false
    return r.phase_approved===true
  })
}

// 해당 월(YYYY-MM)의 평일(근무일) 목록
function workdaysOfMonth(ym){
  const [y,m] = ym.split('-').map(Number)
  const dim = new Date(y, m, 0).getDate()
  const arr = []
  for(let d=1; d<=dim; d++){
    const ds = y+'-'+String(m).padStart(2,'0')+'-'+String(d).padStart(2,'0')
    if(isWorkday(ds)) arr.push(ds)
  }
  return arr
}

// 캠페인 시작월 (이 월 이전은 누적현황에서 제외)
function campaignStartMonth(){
  return mo(CAMPAIGN_START)  // 예: '2026-06'
}

// 캠페인 시작월부터 현재월까지의 YYYY-MM 배열 (과거→현재순)
function campaignMonths(){
  const start = campaignStartMonth()          // '2026-06'
  const [sy,sm] = start.split('-').map(Number)
  const now = new Date(CUR_DATE+'T00:00:00')
  const ey = now.getFullYear(), em = now.getMonth()+1
  const arr = []
  let y=sy, m=sm
  while(y<ey || (y===ey && m<=em)){
    arr.push(y+'-'+String(m).padStart(2,'0'))
    m++; if(m>12){ m=1; y++ }
  }
  return arr
}

// 캠페인 기간에 포함된 연도 목록
function campaignYears(){
  const months = campaignMonths()
  const years = []
  months.forEach(function(ym){
    const y = ym.split('-')[0]
    if(years.indexOf(y)<0) years.push(y)
  })
  return years
}

// 일자별 TM 막대 그래프 (동부/서부 스택 + 할당 목표선)
function renderDailyChart(dates, ym, team){
  if(!team) team='all'
  if(!dates.length){
    return '<div class="chart-wrap"><div class="chart-empty">'+parseInt(ym.split('-')[1])+'월에는 캠페인 근무일이 없습니다.</div></div>'
  }
  // 일자별 집계
  const daily = dates.map(function(d){
    let eastC=0, westC=0, totQ=0
    if(team==='all'||team==='east') EAST.forEach(function(m){ const q=mq(m,d); if(q>0){ eastC+=logs4(m,d).length; totQ+=q } })
    if(team==='all'||team==='west') WEST.forEach(function(m){ const q=mq(m,d); if(q>0){ westC+=logs4(m,d).length; totQ+=q } })
    const tot = team==='east'?eastC : team==='west'?westC : eastC+westC
    return { d, eastC, westC, tot, totQ }
  })

  const monTot = daily.reduce(function(s,x){return s+x.tot},0)
  const monQ   = daily.reduce(function(s,x){return s+x.totQ},0)
  const rate   = monQ>0?Math.round(monTot/monQ*100):0

  // ── SVG 꺾은선 그래프 (주차 구분 + 인터랙티브 툴팁) ──
  const W=680, H=200, padL=32, padR=12, padT=16, padB=40
  const gW=W-padL-padR, gH=H-padT-padB
  const n=daily.length
  const maxVal=Math.max(1,...daily.map(function(x){return Math.max(x.eastC,x.westC,x.tot)}))

  function px(i){ return padL+(n<=1?gW/2:(i/(n-1))*gW) }
  function py(v){ return padT+gH-(v/maxVal)*gH }

  // Y축 눈금
  const yMax = maxVal, yMid = Math.ceil(maxVal/2)
  let svgAxes = [0,yMid,yMax].map(function(v){
    const y=py(v)
    return '<line x1="'+padL+'" y1="'+y+'" x2="'+(W-padR)+'" y2="'+y+'" stroke="var(--b3)" stroke-width="0.5" stroke-dasharray="3,3"/>'
           +'<text x="'+(padL-4)+'" y="'+(y+4)+'" font-size="9" fill="var(--t2)" text-anchor="end">'+v+'</text>'
  }).join('')

  // 주차 구분선 (월요일마다 세로선 + 주차 레이블)
  let weekLines='', weekLabels='', weekNum=0
  let prevWeek=-1
  daily.forEach(function(x,i){
    const dt=new Date(x.d+'T00:00:00')
    const dow=dt.getDay()  // 0=일
    if(dow===1 || i===0){  // 월요일마다 주차 시작
      if(i>0){
        const wx=px(i)
        weekLines+='<line x1="'+wx+'" y1="'+padT+'" x2="'+wx+'" y2="'+(padT+gH)+'" stroke="var(--b2)" stroke-width="1" stroke-dasharray="4,2" opacity="0.6"/>'
      }
    }
  })

  // X축 날짜 레이블 (각 날짜, 요일 구분 색상)
  const dowKr=['일','월','화','수','목','금','토']
  let xLabels=''
  daily.forEach(function(x,i){
    const dt=new Date(x.d+'T00:00:00'),dow=dt.getDay()
    const col=dow===0?'#c0392b':dow===6?'#2980b9':'var(--t2)'
    const dayNum=dt.getDate()
    const dowStr=dowKr[dow]
    xLabels+='<text x="'+px(i)+'" y="'+(H-20)+'" font-size="8" fill="'+col+'" text-anchor="middle">'+dayNum+'</text>'

    const pts=values.map(function(v,i){return px(i)+','+py(v)}).join(' ')
    const dots=values.map(function(v,i){
      const dt=new Date(daily[i].d+'T00:00:00')
      const dowS=dowKr[dt.getDay()]
      return '<circle class="chart-dot" cx="'+px(i)+'" cy="'+py(v)+'" r="5" fill="'+color+'"'
             +' data-label="'+daily[i].d+' ('+dowS+')"'
             +' data-east="'+daily[i].eastC+'" data-west="'+daily[i].westC+'"'
             +' data-tot="'+daily[i].tot+'"'

    }).join('')
    return '<polyline points="'+pts+'" fill="none" stroke="'+color+'" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" opacity="0.9"/>'
           +dots
  }

  let lines=''
  if(team==='all'){
    lines+=makeLine(daily.map(function(x){return x.eastC}),'#3B82C4')
    lines+=makeLine(daily.map(function(x){return x.westC}),'#E8943A')
  } else if(team==='east'){
    lines+=makeLine(daily.map(function(x){return x.eastC}),'#3B82C4')
  } else {
    lines+=makeLine(daily.map(function(x){return x.westC}),'#E8943A')
  }

  const teamLabel=team==='east'?'🔵 동부팀':team==='west'?'🟠 서부팀':'전체'
  const legendHtml=(team!=='west'?'<span><span class="lgd-box" style="background:#3B82C4"></span>동부팀</span>':'')
                  +(team!=='east'?'<span><span class="lgd-box" style="background:#E8943A"></span>서부팀</span>':'')

  const svgChart='<div style="position:relative">'
    +'<svg viewBox="0 0 '+W+' '+H+'" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:220px;overflow:visible">'
    +svgAxes+weekLines+lines+xLabels+'</svg>'
    +'<div id="chart-tooltip" style="display:none;position:fixed;background:var(--bg1);border:0.5px solid var(--b2);border-radius:var(--r1);padding:8px 12px;font-size:12px;box-shadow:0 4px 12px rgba(0,0,0,.15);pointer-events:none;z-index:9999;min-width:130px"></div>'
    +'</div>'

  return '<div class="chart-wrap">'
    +'<div class="chart-title">'
    +'<span>📈 '+parseInt(ym.split('-')[1])+'월 일자별 TM 실적 · '+teamLabel+'</span>'
    +'<span class="chart-legend">'+legendHtml+'</span>'
    +'</div>'
    +svgChart
    +'<div class="chart-summary">'
    +'<div><b>'+monTot+'</b><span class="lbl">월 누적 TM</span></div>'
    +'<div><b>'+monQ+'</b><span class="lbl">월 누적 목표</span></div>'
    +'<div><b>'+rate+'%</b><span class="lbl">월 달성률</span></div>'
    +'<div><b>'+dates.length+'</b><span class="lbl">근무일수</span></div>'
    +'</div>'
    +'</div>'
}

// SVG innerHTML 삽입 후 chart-dot에 이벤트 직접 바인딩
function bindChartDots(){
  const dots = document.querySelectorAll('.chart-dot')
  if(!dots.length) return
  dots.forEach(function(el){
    // 기존 리스너 중복 방지
    el.removeEventListener('mouseenter', _chartDotEnter)
    el.removeEventListener('mouseleave', _chartDotLeave)
    el.addEventListener('mouseenter', _chartDotEnter)
    el.addEventListener('mouseleave', _chartDotLeave)
    // 모바일: touchstart
    el.removeEventListener('touchstart', _chartDotTouch)
    el.addEventListener('touchstart', _chartDotTouch, {passive:true})
  })
}
function _chartDotEnter(e){ showChartTip(e, this) }
function _chartDotLeave(){ hideChartTip() }
function _chartDotTouch(e){
  e.preventDefault && e.preventDefault()
  showChartTip(e.touches?e.touches[0]:e, this)
  setTimeout(hideChartTip, 2000)
}

// 그래프 툴팁 표시/숨김
function showChartTip(e, el){
  const tip=document.getElementById('chart-tooltip'); if(!tip) return
  const label=el.getAttribute('data-label')
  const east=el.getAttribute('data-east')
  const west=el.getAttribute('data-west')
  const tot=el.getAttribute('data-tot')
  let html='<div style="font-weight:600;color:var(--t1);margin-bottom:4px">'+label+'</div>'
  html+='<div style="color:#3B82C4">🔵 동부: '+east+'건</div>'
  html+='<div style="color:#E8943A">🟠 서부: '+west+'건</div>'
  html+='<div style="border-top:0.5px solid var(--b3);margin-top:4px;padding-top:4px;font-weight:600;color:var(--t1)">합계: '+tot+'건</div>'
  tip.innerHTML=html
  tip.style.display='block'
  const x=e.clientX, y=e.clientY
  const iw=window.innerWidth
  tip.style.left=(x+140>iw?(x-150):(x+12))+'px'
  tip.style.top=(y-10)+'px'
}
function hideChartTip(){
  const tip=document.getElementById('chart-tooltip'); if(tip) tip.style.display='none'
}

    })

      h += '<div style="font-size:11px;color:var(--t3);padding:4px">팀이 없습니다. "팀 추가"를 누르세요.</div>'
    }
    h += '</div>'
  })

  h += '</div>'
  return h
}

function addTeam(divId){

  const div = ORG.divisions.find(function(d){return d.id===divId}); if(!div) return

  const div = ORG.divisions.find(function(d){return d.id===divId}); if(!div) return
