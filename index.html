<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TM 활동 관리 대시보드</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
/* ── CSS 변수 ── */
:root{
  --bg1:#ffffff;--bg2:#f5f5f4;--bg3:#f0ede8;--bgi:#e6f1fb;--bgs:#eaf3de;--bgw:#faeeda;--bgd:#fcebeb;
  --t1:#1a1a18;--t2:#6b6b67;--t3:#9c9c97;--ti:#185fa5;--ts:#3b6d11;--tw:#854f0b;--td:#a32d2d;
  --b1:rgba(0,0,0,.4);--b2:rgba(0,0,0,.3);--b3:rgba(0,0,0,.15);--bi:#378add;
  --r1:8px;--r2:12px;--font:-apple-system,BlinkMacSystemFont,'Segoe UI','Apple SD Gothic Neo','Noto Sans KR',sans-serif
}
@media(prefers-color-scheme:dark){:root{
  --bg1:#1e1e1c;--bg2:#2a2a28;--bg3:#242422;--bgi:#0c2540;--bgs:#162808;--bgw:#2a1800;--bgd:#280f0f;
  --t1:#f0ede8;--t2:#a8a8a3;--t3:#6b6b67;--ti:#85b7eb;--ts:#97c459;--tw:#ef9f27;--td:#f09595;
  --b1:rgba(255,255,255,.4);--b2:rgba(255,255,255,.3);--b3:rgba(255,255,255,.15)
}}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:var(--bg3);color:var(--t1);min-height:100vh}
.wrap{max-width:1120px;margin:0 auto;padding:1.5rem 1rem}
.ph{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.25rem;flex-wrap:wrap;gap:10px}
.pt{font-size:18px;font-weight:500}.ps{font-size:12px;color:var(--t2);margin-top:2px}
.sync-status{font-size:11px;padding:4px 10px;border-radius:99px;border:0.5px solid var(--b3)}
.sync-status.ok{background:var(--bgs);color:var(--ts)}.sync-status.err{background:var(--bgd);color:var(--td)}.sync-status.loading{background:var(--bg2);color:var(--t2)}
.card{background:var(--bg1);border:0.5px solid var(--b3);border-radius:var(--r2);padding:1.25rem 1.5rem}
.tabs{display:flex;gap:5px;margin-bottom:1.25rem;flex-wrap:wrap}
.tb{padding:7px 16px;border:0.5px solid var(--b2);border-radius:var(--r1);background:transparent;font-size:13px;cursor:pointer;color:var(--t2);font-family:var(--font);transition:all .15s}
.tb:hover{background:var(--bg2)}.tb.active{background:var(--bgi);color:var(--ti);border-color:transparent;font-weight:500}
.sec{display:none}.sec.active{display:block}
.sr{display:grid;grid-template-columns:repeat(auto-fit,minmax(105px,1fr));gap:8px;margin-bottom:1.25rem}
.sc{background:var(--bg2);border-radius:var(--r1);padding:11px 13px}
.sl{font-size:11px;color:var(--t2);margin-bottom:3px}.sv{font-size:20px;font-weight:500;color:var(--t1)}
.dn{display:flex;align-items:center;gap:8px;margin-bottom:1rem}
.db{background:transparent;border:0.5px solid var(--b2);width:32px;height:32px;border-radius:var(--r1);cursor:pointer;font-size:18px;color:var(--t1);display:flex;align-items:center;justify-content:center;font-family:var(--font);user-select:none}
.db:hover{background:var(--bg2)}.dl{font-size:14px;font-weight:500;color:var(--t1)}
.mg{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:9px;margin-bottom:1.25rem}
.mc{background:var(--bg1);border:0.5px solid var(--b3);border-radius:var(--r2);padding:11px 13px;cursor:pointer;transition:border-color .15s}
.mc:hover{border-color:var(--b1)}.mc.done{border-left:3px solid #1D9E75}.mc.partial{border-left:3px solid #BA7517}.mc.none{border-left:3px solid var(--b3)}
.mn{font-size:13px;font-weight:500;color:var(--t1);margin-bottom:2px}
.ms{font-size:11px;color:var(--t2);margin-bottom:6px}
.pw{height:4px;background:var(--bg2);border-radius:99px;margin-bottom:4px}
.pp{height:100%;border-radius:99px;transition:width .3s}.mp{font-size:11px;color:var(--t2);text-align:right;margin-bottom:6px}
.qr{display:flex;align-items:center;justify-content:space-between;padding-top:6px;border-top:0.5px solid var(--b3)}
.ql{font-size:11px;color:var(--t2)}.qt{display:flex;gap:3px;align-items:center}
.qtb{padding:2px 7px;font-size:11px;border:0.5px solid var(--b2);border-radius:var(--r1);background:transparent;cursor:pointer;color:var(--t2);font-family:var(--font)}
.qtb.on{background:var(--bgi);color:var(--ti);border-color:transparent;font-weight:500}
.ai{font-size:11px;color:var(--t2);padding:1px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ai.r2{color:var(--ti)}.stl{font-size:14px;font-weight:500;color:var(--t1);margin-bottom:.75rem}
/* 달력 */
.cs{margin-bottom:1.5rem}.ch{display:flex;align-items:center;gap:8px;margin-bottom:.6rem}
.ct{font-size:14px;font-weight:500;color:var(--t1)}
.cg{display:grid;grid-template-columns:repeat(5,1fr);gap:3px}
.cg7{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cdw{text-align:center;font-size:10px;color:var(--t2);padding:3px 0;font-weight:500}
.cl{border:0.5px solid var(--b3);border-radius:var(--r1);padding:5px 4px 4px;min-height:58px;cursor:pointer;transition:border-color .1s}
.cl:hover{border-color:var(--b1)}.cl.empty{border-color:transparent;cursor:default}
.cl.today{border-color:var(--bi)}.cl.sel{border-color:var(--bi);background:var(--bgi)}
.cd{font-size:11px;font-weight:500;color:var(--t1);margin-bottom:3px}.cl.sel .cd{color:var(--ti)}
.ctr{display:flex;flex-direction:column;gap:2px}
.ctrow{display:flex;align-items:center;gap:3px}
.ctd{width:5px;height:5px;border-radius:50%;flex-shrink:0}
.ctl{font-size:9px;color:var(--t2);line-height:1}.cl.sel .ctl{color:var(--ti);opacity:.8}
.ctv{font-size:9px;font-weight:500;line-height:1}
.hl-lbl{font-size:9px;color:var(--td);margin-top:1px}
.cl-leg{display:flex;gap:10px;font-size:10px;color:var(--t2);margin-top:5px;flex-wrap:wrap;align-items:center}
.cl-leg span{display:inline-flex;align-items:center;gap:3px}
.ds{width:5px;height:5px;border-radius:50%;display:inline-block}
/* 패널·버튼 */
.pn{background:var(--bg1);border:0.5px solid var(--b3);border-radius:var(--r2);padding:1rem 1.25rem;margin-bottom:1rem}
.pnt{font-size:13px;font-weight:500;color:var(--t1);margin-bottom:.75rem;display:flex;align-items:center;gap:6px}
.ua{border:0.5px dashed var(--b2);border-radius:var(--r1);padding:1.2rem;text-align:center;cursor:pointer;margin-bottom:.75rem}
.ua:hover{background:var(--bg2)}
.dbtw{overflow-x:auto;margin-bottom:.75rem}
.dbt{width:100%;border-collapse:collapse;font-size:12px;table-layout:fixed}
.dbt th{text-align:left;padding:6px 8px;border-bottom:0.5px solid var(--b2);color:var(--t2);font-weight:500}
.dbt td{padding:6px 8px;border-bottom:0.5px solid var(--b3);color:var(--t1);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dbt tr:last-child td{border-bottom:none}.dbt tr:hover td{background:var(--bg2)}
.bdg{font-size:11px;padding:2px 8px;border-radius:99px;display:inline-block}
.bdg.u{background:var(--bg2);color:var(--t2)}.bdg.a1{background:var(--bgs);color:var(--ts)}.bdg.a2,.bdg.r2{background:var(--bgi);color:var(--ti)}
.btn{padding:7px 14px;border:0.5px solid var(--b2);border-radius:var(--r1);background:transparent;font-size:13px;cursor:pointer;color:var(--t2);font-family:var(--font)}
.btn:hover{background:var(--bg2)}.btn.p{background:var(--bgi);color:var(--ti);border-color:transparent;font-weight:500}.btn.p:hover{opacity:.9}
.btn.s{padding:4px 10px;font-size:11px}.btn.dng{color:var(--td);border-color:#f7c1c1}.btn.dng:hover{background:var(--bgd)}
input,select,textarea{font-family:var(--font);font-size:13px;padding:6px 10px;border:0.5px solid var(--b2);border-radius:var(--r1);background:var(--bg1);color:var(--t1);outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--bi)}
.fr{display:flex;gap:6px;margin-bottom:.75rem;flex-wrap:wrap;align-items:center}
.fr select,.fr input{font-size:13px;padding:5px 8px}

/* 빠른 1행 입력폼 CSS */
.q-row{display:flex;gap:6px;align-items:center;background:var(--bg2);padding:10px 12px;border-radius:var(--r1);overflow-x:auto}
.q-row input,.q-row select{font-size:12px;padding:7px 9px;border:0.5px solid var(--b2);border-radius:4px;flex-shrink:0;background:var(--bg1);color:var(--t1)}
.q-row input:focus,.q-row select:focus{border-color:var(--bi);outline:none}

/* 모달 */
.mov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:1000;align-items:flex-start;justify-content:center;padding-top:2rem;overflow-y:auto}
.mov.open{display:flex}
.mo{background:var(--bg1);border-radius:var(--r2);border:0.5px solid var(--b3);padding:1.25rem;width:94%;max-width:560px;margin-bottom:2rem}
.mot{font-size:15px;font-weight:500;color:var(--t1);margin-bottom:4px}
.mos{font-size:12px;color:var(--t2);margin-bottom:1rem}
.fs{background:var(--bg2);border-radius:var(--r1);padding:10px 12px;margin-bottom:10px}
.fst{font-size:11px;font-weight:500;color:var(--t2);margin-bottom:8px;letter-spacing:.4px}
.frow{margin-bottom:9px}.frow:last-child{margin-bottom:0}
.flbl{font-size:12px;color:var(--t2);margin-bottom:3px;display:flex;align-items:center;gap:4px}
.req{color:var(--td);font-size:11px}
.frow input,.frow select,.frow textarea{width:100%}
.frow textarea{resize:vertical}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fa{display:flex;gap:6px;justify-content:flex-end;margin-top:.75rem}
.lc{border:0.5px solid var(--b3);border-radius:var(--r1);padding:11px 13px;margin-bottom:8px}
.lc.종결{border-left:3px solid #5F5E5A}.lc.추가상담{border-left:3px solid #185FA5}
.lh{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;gap:8px}
.lco{font-size:13px;font-weight:500;color:var(--t1)}
.lb{display:flex;gap:4px;flex-shrink:0;flex-wrap:wrap;justify-content:flex-end}
.pill{font-size:10px;padding:2px 8px;border-radius:99px;display:inline-block;white-space:nowrap}
.pill.응답{background:var(--bgs);color:var(--ts)}.pill.부재{background:var(--bgw);color:var(--tw)}
.pill.거절{background:var(--bgd);color:var(--td)}.pill.콜백요청{background:var(--bgi);color:var(--ti)}
.pill.종결{background:var(--bg2);color:var(--t2)}
.pill.보류{background:var(--bgw);color:var(--tw)}.pill.추가상담{background:var(--bgi);color:var(--ti)}
.lmg{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;margin-bottom:6px}
.lmi{font-size:11px;color:var(--t2)}.lmi strong{color:var(--t1);font-weight:500}
.lcons{font-size:12px;color:var(--t1);background:var(--bg2);border-radius:var(--r1);padding:7px 9px;margin-bottom:5px;line-height:1.5;white-space:pre-wrap}
.lap{font-size:11px;color:var(--ti);margin-top:3px}
.del{background:none;border:none;cursor:pointer;color:var(--t2);font-size:13px;padding:1px 4px;font-family:var(--font)}
.del:hover{color:var(--td)}
/* 누적 */
.cug{display:grid;grid-template-columns:repeat(auto-fill,minmax(185px,1fr));gap:9px}
.cuc{background:var(--bg1);border:0.5px solid var(--b3);border-radius:var(--r2);padding:11px 13px}
.cun{font-size:13px;font-weight:500;color:var(--t1);margin-bottom:1px}
.cut{font-size:11px;color:var(--t2);margin-bottom:7px}
.cus{display:flex;gap:10px;margin-bottom:5px}.cu{text-align:center}
.cuv{font-size:17px;font-weight:500;color:var(--t1)}.cul{font-size:10px;color:var(--t2)}
.sd{width:7px;height:7px;border-radius:50%;display:inline-block}.sw{display:flex;flex-wrap:wrap;gap:2px}
.t2nd{font-size:10px;background:var(--bgi);color:var(--ti);padding:1px 6px;border-radius:99px;margin-left:4px}
/* 내 이름 선택 바 */
.myma-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--bg2);border-radius:var(--r1);padding:10px 14px;margin-bottom:1rem}
.myma-label{font-size:13px;font-weight:500;color:var(--t1);white-space:nowrap}
.myma-chips{display:flex;gap:5px;flex-wrap:wrap;flex:1}
.myma-chip{padding:5px 12px;border:0.5px solid var(--b2);border-radius:99px;background:var(--bg1);font-size:12px;cursor:pointer;color:var(--t2);font-family:var(--font);transition:all .12s}
.myma-chip:hover{background:var(--bgi);color:var(--ti)}
.myma-chip.on{background:var(--ti);color:#fff;border-color:transparent;font-weight:600}
.myma-clear{font-size:11px;padding:4px 10px;border:0.5px solid var(--b2);border-radius:99px;background:transparent;cursor:pointer;color:var(--t2);font-family:var(--font);white-space:nowrap}
.myma-clear:hover{background:var(--bgd);color:var(--td)}
/* 월 선택 */
.mon-sel{display:flex;gap:6px;margin-bottom:1.25rem;flex-wrap:wrap}
.mon-btn{padding:7px 16px;border:0.5px solid var(--b2);border-radius:var(--r1);background:transparent;font-size:13px;cursor:pointer;color:var(--t2);font-family:var(--font)}
.mon-btn:hover{background:var(--bg2)}
.mon-btn.on{background:var(--bgi);color:var(--ti);border-color:transparent;font-weight:500}
/* 일자별 막대 그래프 */
.chart-wrap{background:var(--bg1);border:0.5px solid var(--b3);border-radius:var(--r2);padding:1.25rem 1.5rem;margin-bottom:1.25rem}
.chart-title{font-size:14px;font-weight:500;color:var(--t1);margin-bottom:1rem;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
.chart-legend{display:flex;gap:14px;font-size:11px;color:var(--t2)}
.chart-legend span{display:inline-flex;align-items:center;gap:4px}
.lgd-box{width:10px;height:10px;border-radius:2px;display:inline-block}
.bars{display:flex;align-items:flex-end;gap:3px;height:200px;padding:0 0 4px;overflow-x:auto;border-bottom:1px solid var(--b3)}
.bar-col{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;min-width:26px;flex:1;height:100%;position:relative}
.bar-stack{display:flex;flex-direction:column-reverse;width:18px;height:calc(100% - 18px);justify-content:flex-start}
.bar-seg{width:100%;border-radius:2px 2px 0 0;transition:height .3s;min-height:0}
.bar-val{font-size:9px;color:var(--t1);font-weight:600;margin-bottom:2px;height:14px;line-height:14px}
.bar-lbl{font-size:9px;color:var(--t2);margin-top:3px;white-space:nowrap}
.bar-lbl.sun{color:#A32D2D}.bar-lbl.sat{color:#185FA5}
.bar-col:hover .bar-seg{opacity:.8}
.chart-empty{text-align:center;padding:2rem;color:var(--t2);font-size:13px}
.chart-summary{display:flex;gap:18px;margin-top:12px;font-size:12px;flex-wrap:wrap}
.chart-summary b{color:var(--t1);font-weight:600;font-size:15px}
.chart-summary .lbl{color:var(--t2);display:block;font-size:11px;margin-top:1px}
/* TM내역 */
.tlw{overflow-x:auto;max-height:1040px;overflow-y:auto;border:0.5px solid var(--b3);border-radius:var(--r1)}
.tlt{width:100%;border-collapse:collapse;font-size:12px;min-width:960px}
.tlt th{text-align:left;padding:7px 9px;border-bottom:0.5px solid var(--b2);color:var(--t2);font-weight:500;white-space:nowrap;position:sticky;top:0;background:var(--bg1);z-index:1}
.tlt td{padding:7px 9px;border-bottom:0.5px solid var(--b3);vertical-align:top;font-size:12px}
.tlt tr:last-child td{border-bottom:none}.tlt tr:hover td{background:var(--bg2)}
.hl{background:#fff3cd;border-radius:2px;padding:0 1px;color:#000}
.sb{position:relative;flex:1;min-width:200px;max-width:340px}
.sb input{width:100%}.si{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--t2);font-size:15px;pointer-events:none}
.kwc{font-size:11px;color:var(--ti);background:var(--bgi);padding:2px 8px;border-radius:99px;margin-left:6px}
.hbanner{background:var(--bgd);border-radius:var(--r1);padding:10px 14px;font-size:13px;color:var(--td);margin-bottom:1rem}
/* 인증 */
.auth-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:2000;display:flex;align-items:center;justify-content:center}
.auth-box{background:var(--bg1);border:0.5px solid var(--b3);border-radius:var(--r2);padding:1.5rem;width:92%;max-width:340px;box-shadow:0 8px 32px rgba(0,0,0,.15)}
.auth-title{font-size:15px;font-weight:500;color:var(--t1);margin-bottom:4px}
.auth-sub{font-size:12px;color:var(--t2);margin-bottom:1rem}
.auth-tabs{display:flex;gap:4px;margin-bottom:1rem}
.auth-tab{flex:1;padding:6px;border:0.5px solid var(--b2);border-radius:var(--r1);background:transparent;font-size:12px;cursor:pointer;color:var(--t2);font-family:var(--font);text-align:center}
.auth-tab.on{background:var(--bgi);color:var(--ti);border-color:transparent;font-weight:500}
.badge-role{font-size:10px;padding:2px 8px;border-radius:99px;display:inline-block}
.badge-role.admin{background:var(--bgi);color:var(--ti)}
.badge-role.ma{background:var(--bg2);color:var(--t2)}
.user-info-bar{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--t2);padding:6px 10px;background:var(--bg2);border-radius:99px}
.lock-btn{font-size:11px;padding:3px 10px;border:0.5px solid var(--b2);border-radius:99px;background:transparent;cursor:pointer;color:var(--t2);font-family:var(--font)}
.lock-btn:hover{background:var(--bgd);color:var(--td)}
.masked{color:var(--b3);font-size:11px;font-style:italic;user-select:none}
</style>
</head>
<body>
<!-- ════ 카카오 로그인 게이트 ════ -->
<div id="kakao-gate" style="position:fixed;inset:0;z-index:99999;display:none;align-items:center;justify-content:center;background:#f6f7f9;font-family:inherit">
  <div style="text-align:center;width:90%;max-width:340px;padding:34px 26px;background:#fff;border-radius:16px;box-shadow:0 10px 44px rgba(0,0,0,.10)">
    <div style="font-size:22px;font-weight:700;margin-bottom:6px">TM 활동 관리</div>
    <div id="kakao-gate-msg" style="font-size:13px;color:#666;margin-bottom:24px;line-height:1.5">로그인이 필요합니다.</div>
    <button onclick="kakaoLogin()" style="width:100%;border:0;border-radius:10px;padding:13px;background:#FEE500;color:#191600;font-weight:600;font-size:15px;cursor:pointer">카카오로 로그인</button>
    <div id="kakao-gate-sub" style="margin-top:14px;font-size:12px;color:#999;line-height:1.6"></div>
  </div>
</div>
<!-- 앱 시작 -->

<!-- 모바일 감지 배너 -->
<div id="mobile-banner" style="display:none;background:var(--ti);color:#fff;padding:11px 16px;text-align:center;position:sticky;top:0;z-index:9999">
  <div style="font-size:13px;margin-bottom:8px">📱 모바일에서 접속하셨어요! 입력에 최적화된 화면을 사용해보세요.</div>

// HTML 특수문자 이스케이프 (속성/텍스트에 안전하게 삽입)
function escHtml(s){
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;')
}

// 휴대폰번호 가운데 마스킹 (표시용 — DB 원본은 그대로 유지)
// 010-1234-5678 / 01012345678 → 010-****-5678
function maskPhone(v){
  if(v==null) return v
  return String(v).replace(/\b(01[0-9])[- ]?(\d{3,4})[- ]?(\d{4})\b/g, function(m,a,b,c){ return a+'-****-'+c })
}

// 현 거래업체 구분: 대기업 선택 시 고정 5개 + 그외(직접입력), 지역중상은 자유입력
const BIG_PARTNERS = ['삼성웰스토리','동원홈푸드','SPC','현대그린푸드','사조']
function partnerFieldHtml(prefix, type, val){
  val = val || ''
  if(type === '대기업'){
    const isOther = !!val && BIG_PARTNERS.indexOf(val) < 0
    let opts = '<option value="">선택</option>'
      + BIG_PARTNERS.map(function(b){ return '<option'+(val===b?' selected':'')+'>'+b+'</option>' }).join('')
      + '<option value="__other"'+(isOther?' selected':'')+'>그외(직접입력)</option>'
    return '<select id="'+prefix+'-cp-sel" onchange="onBigPartner(\''+prefix+'\')" style="width:100%">'+opts+'</select>'
      + '<input type="text" id="'+prefix+'-cp" placeholder="업체명 직접입력" value="'+(isOther?escHtml(val):'')+'" style="width:100%;margin-top:4px;display:'+(isOther?'block':'none')+'">'
  } else if(type === '지역중상'){
    return '<input type="text" id="'+prefix+'-cp" placeholder="업체명 입력" value="'+escHtml(val)+'" style="width:100%">'
  }
  return '<input type="text" id="'+prefix+'-cp" placeholder="예: KG이니시스 (선택)" value="'+escHtml(val)+'" style="width:100%">'
}
function onPartnerType(prefix){
  const type = (document.getElementById(prefix+'-ptype')||{}).value || ''
  const wrap = document.getElementById(prefix+'-cp-wrap')
  if(!wrap) return
  const cur = (document.getElementById(prefix+'-cp')||{}).value || ''
  wrap.innerHTML = partnerFieldHtml(prefix, type, cur)
}
function onBigPartner(prefix){
  const sel = document.getElementById(prefix+'-cp-sel')
  const txt = document.getElementById(prefix+'-cp')
  if(!sel || !txt) return
  if(sel.value === '__other'){ txt.style.display='block'; txt.value=''; txt.focus() }
  else { txt.style.display='none'; txt.value = sel.value }
}

function isAdmin(){ return CURRENT_USER?.role === 'admin' }
// 권한 (값, 표시명)
const ROLE_OPTS = [
  ['ma','구성원'],
  ['leader','리더(팀장)'],
  ['division_head','사업부장'],
  ['support_lead','지원팀장'],

  ['director','본부장'],
  ['related_dept','유관부서'],
  ['admin','관리자']
]
function roleLabelKo(r){ const f=ROLE_OPTS.find(function(x){return x[0]===r}); return f?f[1]:(r||'구성원') }
function isRealAdmin(){ return REAL_USER?.role === 'admin' }  // 미리보기 중에도 실제 관리자 여부

// ══════════ 권한 매트릭스 (관리자 탭에서 켜고 끄기 가능) ══════════
const PERM_ROLES = [['ma','구성원'],['leader','팀장'],['division_head','사업부장'],['support_lead','지원팀장'],['biz_manager','사업담당'],['director','본부장'],['related_dept','유관부서'],['admin','관리자']]
const PERM_DEFS = [
  {key:'tm_edit_others',   label:'타인 TM 기록 수정·결과 변경', def:['leader','division_head','support_lead','biz_manager','director','related_dept']},
  {key:'transfer_request', label:'담당자 변경 요청',            def:['ma','leader','division_head','support_lead','biz_manager','director','related_dept']},
  {key:'transfer_approve', label:'담당자 변경 승인',            def:[]},
  {key:'db_view',          label:'DB관리 탭 열람',              def:['leader','division_head','support_lead','biz_manager','director','related_dept']},
  {key:'db_exclude',       label:'DB 제외(Y/N) 처리',           def:['division_head','support_lead','biz_manager','director']},
  {key:'db_admin',         label:'DB 업로드·배정·삭제·이관',     def:[]},
  {key:'staff_manage',     label:'인력관리 탭',                 def:[]}
]
let PERMS = null   // app_config 'perm_overrides' → { matrix: { permKey: { role: true/false } } }
function hasPerm(key, role){
  role = role || CURRENT_USER?.role
  if(role === 'admin') return true   // 관리자는 항상 허용 (잠금)
  const ov = PERMS && PERMS.matrix && PERMS.matrix[key]
  if(ov && typeof ov[role] === 'boolean') return ov[role]
  const d = PERM_DEFS.find(function(p){ return p.key===key })
  return d ? d.def.indexOf(role) >= 0 : false
}
async function loadPerms(){
  try{
    const { data } = await sb.from('app_config').select('value').eq('key','perm_overrides').maybeSingle()
    if(data && data.value && data.value.matrix) PERMS = data.value
  }catch(e){ console.warn('권한 설정 로드 실패', e) }
}
// 구성원(ma)을 제외한 모든 직책은 팀/전체 열람 권한(타인 선택·전체 TM 등)
function isLeader(){
  const r = CURRENT_USER?.role
  return r==='leader' || r==='division_head' || r==='support_lead' || r==='biz_manager' || r==='director' || r==='related_dept' || r==='admin'
}
// 전 사업부 열람 권한: 관리자·지원팀장·사업담당·본부장·유관부서
function seesAllDivisions(){
  const r = CURRENT_USER?.role
  return r==='admin' || r==='biz_manager' || r==='director' || r==='related_dept'
}
// 내 사업부 id (사업부장은 지정값 우선, 그 외는 소속 팀의 사업부)
function myDivisionId(){
  if(!CURRENT_USER) return null
  if(CURRENT_USER.division){
    // 저장값이 사업부 id면 그대로, 이름/키워드면 매칭
    const dv = (ORG.divisions||[]).find(function(d){ return d.id===CURRENT_USER.division || (d.name && (d.name===CURRENT_USER.division || d.name.indexOf(CURRENT_USER.division)>=0)) })
    if(dv) return dv.id
  }
  const tid = myTeamId()
  const t = tid ? teamById(tid) : null
  return t ? t.divId : null
}
// 권한자(전체 열람) 대시보드 사업부 선택 토글: 'all' | 사업부 id
let DASH_DIV = 'all'
function setDashDiv(v){ DASH_DIV = v; reRenderActive() }
// 사업부 TM 시작 여부 (시작일 미설정이면 항상 시작된 것으로 간주)
function divStarted(div, date){ return !div || !div.startDate || (date||CUR_DATE) >= div.startDate }
// 첫 화면에 표시할 사업부 목록 (권한 범위 + 권한자 토글 적용)
function visibleDivisions(){
  if(!ORG || !ORG.divisions) return []
  let divs
  // 전 직급 공통: 첫 화면 수행도(그래프·팀 현황)는 전 사업부 열람 가능 (세부 TM내역은 별도 제한 유지)
  if(DASH_DIV && DASH_DIV !== 'all'){
    const d = ORG.divisions.find(function(x){ return x.id===DASH_DIV })
    divs = d ? [d] : ORG.divisions
  } else divs = ORG.divisions
  return _filterDivTeams(divs)
}
// 내 팀 id (로그인/미리보기 시 지정된 team 우선, 없으면 이름으로 조회)
function myTeamId(){ return CURRENT_USER?.team || maTeam(CURRENT_USER?.name) || null }
// 기록이 속한 팀: 작성자(ma_name)의 현재 팀 우선 (팀 ID 변경에도 안전), 없으면 저장된 team
function recTeamId(r){ return maTeam(r.ma_name) || r.team_id || (typeof resolveRowTeamId==='function'?resolveRowTeamId(r):null) || r.team }
// 탭/내이름/TM내역 스코프: 구성원·리더=본인 팀, 사업부장=사업부 전체, 권한자=전체
function tabTeamSet(){
  if(seesAllDivisions()) return null
  const role = CURRENT_USER?.role
  if((role === 'division_head' || role === 'support_lead')) return null
  const myTeam = myTeamId()
  return new Set(myTeam ? [myTeam] : [])
}
// TM내역/필터에 보일 팀 목록 (권한 범위)
function tmVisibleTeams(){
  if(seesAllDivisions()) return allTeams()
  const role = CURRENT_USER?.role
  if((role === 'division_head' || role === 'support_lead')){ const did=myDivisionId(); return allTeams().filter(function(t){return t.divId===did}) }
  const myT = myTeamId()
  return allTeams().filter(function(t){ return t.id===myT })
}
// 내 이름 칩에 보일 MA (권한 범위)
function chipMembers(){
  // 비활성(부서이동/퇴직) 인원은 신규 입력 대상에서 제외
  const _act = function(arr){ return arr.filter(function(x){ return isActiveMa(x.m) }) }
  if(seesAllDivisions()) return _act(ALL_MA)
  const role = CURRENT_USER?.role
  if((role === 'division_head' || role === 'support_lead')){ const did=myDivisionId(); return _act(ALL_MA.filter(function(x){ return (teamById(x.team)||{}).divId===did })) }
  if(role === 'leader'){ const myT=myTeamId(); return _act(ALL_MA.filter(function(x){ return x.team===myT })) }
  return ALL_MA.filter(function(x){ return x.m===CURRENT_USER?.name })
}
// 누적현황용 사업부 범위: 팀 필터 없음(구성원도 사업부 전체), DASH_DIV 토글 무시
function cumBaseDivisions(){
  if(!ORG || !ORG.divisions) return []
  // 전 직급 공통: 누적현황은 타 팀·타 사업부 수행도(MA 단위까지) 전체 열람 가능
  return ORG.divisions
}
// 팀 단위 스코프(대시보드/탭/달력/누적): 구성원=본인 팀, 리더·사업부장=사업부 전체, 권한자=전체
function scopeTeamSet(){
  // 전 직급 공통: 대시보드 수행도는 전체 팀 열람 (구성원 포함)
  // ※ 팀별 허브 탭·TM내역 세부 열람은 tabTeamSet/canViewTM에서 별도 제한
  return null
}
function _filterDivTeams(divs){
  const tset = scopeTeamSet()
  if(!tset) return divs
  return divs.map(function(d){
    return Object.assign({}, d, { teams: (d.teams||[]).filter(function(t){ return tset.has(t.id) }) })
  }).filter(function(d){ return d.teams.length })
}
function isMe(ma){ return CURRENT_USER?.name === ma }
function canViewFull(ma){ return isAdmin() || isMe(ma) }
function isLoggedIn(){ return CURRENT_USER !== null }

// 인증 모달 열기
function requireAuth(reason, cb, mode='ma'){
  AUTH_CALLBACK = cb
  renderAuthModal(reason, mode)
}

function renderAuthModal(reason, mode){
  if(!mode) mode = 'ma'
  const overlay = document.createElement('div')
  overlay.className = 'auth-overlay'
  overlay.id = 'auth-overlay'

  // 팀별 optgroup으로 모든 MA 표시 (동적)
  const maOptsHtml = allTeams().map(function(t){
    if(!t.members.length) return ''
    return '<optgroup label="'+t.name+'">'+t.members.map(function(m){ return '<option>'+m+'</option>' }).join('')+'</optgroup>'
  }).join('')
  const eastOpts = maOptsHtml  // 하위호환 변수명 유지
  const westOpts = ''

  const maForm = '<div style="margin-bottom:10px">'
    + '<label style="font-size:12px;color:var(--t2);display:block;margin-bottom:4px">이름 선택</label>'
    + '<select id="auth-name" style="width:100%;font-size:13px;padding:8px 10px;border:0.5px solid var(--b2);border-radius:var(--r1);background:var(--bg1);color:var(--t1)">'
    + '<option value="">-- 이름을 선택하세요 --</option>'
    + maOptsHtml
    + '</select></div>'
    + '<div style="font-size:11px;color:var(--t2);background:var(--bg2);border-radius:var(--r1);padding:8px 10px;margin-bottom:10px">'
    + '이름을 선택하면 <strong>본인이 작성한 TM 내역만</strong> 표시됩니다.<br>'
    + '전체 열람이 필요하면 관리자에게 문의하세요.</div>'

  const title = '📋 내 TM 내역 조회'
  const btnLabel = '조회하기'
  const onClickLogin = "doAuthLogin('ma')"

  overlay.innerHTML = '<div class="auth-box">'
    + '<div class="auth-title">' + title + '</div>'
    + '<div class="auth-sub" style="margin-bottom:1rem">' + (reason||'') + '</div>'
    + maForm
    + '<div id="auth-err" style="font-size:12px;color:var(--td);min-height:16px;margin-bottom:10px;text-align:center"></div>'
    + '<div style="display:flex;gap:8px">'
    + '<button onclick="closeAuthModal()" style="flex:1;padding:9px;border:0.5px solid var(--b2);border-radius:var(--r1);background:transparent;font-size:13px;cursor:pointer;color:var(--t2);font-family:var(--font)">취소</button>'
    + '<button onclick="' + onClickLogin + '" style="flex:2;padding:9px;background:var(--bgi);color:var(--ti);border:none;border-radius:var(--r1);font-size:14px;font-weight:500;cursor:pointer;font-family:var(--font)">' + btnLabel + '</button>'
    + '</div></div>'

  document.body.appendChild(overlay)
  overlay.addEventListener('click', function(e){ if(e.target===overlay) closeAuthModal() })
  var maSelect = document.getElementById('auth-name')
  if(maSelect) maSelect.addEventListener('keydown', function(e){ if(e.key==='Enter') doAuthLogin('ma') })
}

function doAuthLogin(mode='ma'){
  const err = document.getElementById('auth-err')
  const name = document.getElementById('auth-name')?.value
  if(!name){ if(err) err.textContent='이름을 선택해주세요.'; return }
  // 카카오로 이미 리더/관리자로 식별된 경우 그 권한 유지 (ma로 강등 방지)
  const keepRole = (REAL_USER && (REAL_USER.role==='leader' || REAL_USER.role==='admin')) ? REAL_USER.role : 'ma'
  CURRENT_USER = { name, role: keepRole, team: maTeam(name)||'west' }
  closeAuthModal()
  updateAuthBar()
  if(typeof applyTabVisibility==='function') applyTabVisibility()
  if(AUTH_CALLBACK){ AUTH_CALLBACK(); AUTH_CALLBACK=null }
}

function closeAuthModal(){
  const el = document.getElementById('auth-overlay')
  if(el) el.remove()
}

function updateAuthBar(){
  const bar = document.getElementById('auth-bar')
  if(!bar) return
  if(!CURRENT_USER){ bar.innerHTML=''; return }
  const role = CURRENT_USER.role
  const roleLabel = (role==='ma') ? '본인(MA)' : roleLabelKo(role)
  const roleCls = isLeader() ? 'admin' : 'ma'
  const realAdmin = isRealAdmin()
  const simulating = realAdmin && REAL_USER && !(CURRENT_USER.name===REAL_USER.name && CURRENT_USER.role===REAL_USER.role)
  let h = '<div class="user-info-bar">'
    + '<span style="font-weight:500;color:var(--t1)">'+escHtml(CURRENT_USER.name)+'</span>'
    + '<span class="badge-role '+roleCls+'"'
    + (realAdmin ? ' style="cursor:pointer" title="클릭: 다른 권한/구성원 화면 미리보기" onclick="openViewAsModal()"' : '')
    + '>'+roleLabel+(realAdmin?' ▾':'')+'</span>'
  if(simulating){
    h += '<button class="lock-btn" onclick="viewAs(\'admin\')">↩ 관리자로 복귀</button>'
  } else if(realAdmin){
    h += '<button class="lock-btn" onclick="openUserAdmin()">👥 사용자관리</button>'
  }
  h += '</div>'
  bar.innerHTML = h
}

function doLogout(){
  CURRENT_USER = null
  AUTH_CALLBACK = null
  updateAuthBar()
  reRenderActive()
}

function applyCampaignStart(){
  const val = document.getElementById('campaign-start-input')?.value
  const msg = document.getElementById('campaign-msg')
  if(!val){ if(msg){msg.style.color='var(--td)';msg.textContent='날짜를 선택해주세요.'} return }
  setCampaignStart(val)
  if(msg){ msg.style.color='var(--ts)'; msg.textContent='✓ 적용됨 ('+val+' 이하 캠페인 외)' }
  reRenderActive()
}

function addCustomOffDay(){
  const val = document.getElementById('custom-off-input')?.value
  if(!val){ alert('휴무로 지정할 날짜를 선택해주세요.'); return }
  addCustomOff(val)
  document.getElementById('custom-off-input').value=''
  renderCustomOffList()
  reRenderActive()
}

function delCustomOffDay(ds){
  if(!confirm(ds+' 휴무 지정을 해제하시겠습니까?')) return
  removeCustomOff(ds)
  renderCustomOffList()
  reRenderActive()
}

function renderCustomOffList(){
  const box = document.getElementById('custom-off-list')
  if(!box) return
  const days = [...CUSTOM_OFF_DAYS].sort()
  if(!days.length){
    box.innerHTML = '<div style="font-size:11px;color:var(--t2)">지정된 개별 휴무일이 없습니다.</div>'
    return
  }
  const wk=['일','월','화','수','목','금','토']
  box.innerHTML = '<div style="display:flex;flex-wrap:wrap;gap:6px">' + days.map(function(d){
    const dt=new Date(d+'T00:00:00')
    const label=(dt.getMonth()+1)+'/'+dt.getDate()+'('+wk[dt.getDay()]+')'
    return '<span style="display:inline-flex;align-items:center;gap:5px;font-size:12px;background:var(--bgd);color:var(--td);padding:4px 10px;border-radius:99px">'
      + label + '<button onclick="delCustomOffDay(&apos;'+d+'&apos;)" style="background:none;border:none;color:var(--td);cursor:pointer;font-size:13px;padding:0;line-height:1">✕</button></span>'
  }).join('') + '</div>'
}

async function addNewMember(){
  const name = document.getElementById('new-ma-name')?.value.trim()
  const team = document.getElementById('new-ma-team')?.value
  const msg  = document.getElementById('new-ma-msg')
  if(!name){ msg.style.color='var(--td)'; msg.textContent='이름을 입력해주세요.'; return }
  if(allTeams().some(function(t){return t.members.indexOf(name)>=0})){
    msg.style.color='var(--td)'; msg.textContent='이미 등록된 MA입니다.'; return
  }
  // 선택한 팀에 실제로 추가
  let added=false
  ORG.divisions.forEach(function(d){ d.teams.forEach(function(t){ if(t.id===team){ t.members.push(name); added=true } }) })
  if(!added){
    // 선택 팀이 없으면 첫 번째 팀에 추가
    const first=allTeams()[0]
    if(first){ ORG.divisions[0].teams[0].members.push(name); added=true }
  }
  saveOrg(); refreshOrgDerived()
  msg.style.color='var(--ts)'
  msg.textContent='✓ "'+name+'" ('+teamName(team)+') 추가 완료'
  document.getElementById('new-ma-name').value=''
  renderStaff()
}

let sb = null

// ════════════════ 카카오 로그인 게이트 (신청 → 관리자 승인 방식) ════════════════

function _siteRedirect(){ return location.origin + location.pathname }

async function kakaoLogin(){
  const { error } = await sb.auth.signInWithOAuth({
    provider: 'kakao',
    options: { redirectTo: _siteRedirect() }
  })
  if(error) alert('로그인 실패: ' + error.message)
}

async function appLogout(){
  await sb.auth.signOut()
  location.reload()
}

function _showGate(msg, sub){
  const g = document.getElementById('kakao-gate')
  if(msg) document.getElementById('kakao-gate-msg').textContent = msg
  document.getElementById('kakao-gate-sub').innerHTML = sub || ''
  g.style.display = 'flex'
  const lo = document.getElementById('kakao-logout'); if(lo) lo.style.display = 'none'
}
function _hideGate(){
  document.getElementById('kakao-gate').style.display = 'none'
  const lo = document.getElementById('kakao-logout'); if(lo) lo.style.display = 'block'
}

// 로그인 사용자 상태 확인 + 최초 로그인 시 가입 신청(app_users 테이블)
// 반환 status: 'approved' | 'pending' | 'rejected' | 'no-email' | 'error'
async function _checkUser(user){
  const email = (user.email || '').toLowerCase()
  if(!email) return { status:'no-email' }
  let { data, error } = await sb.from('app_users').select('*').eq('email', email).maybeSingle()
  if(error){ console.error('app_users 조회 오류', error); return { status:'error' } }
  if(!data){
    // 최초 로그인 → 승인 대기(pending) 신청 행 생성
    const name = user.user_metadata?.name || user.user_metadata?.full_name || ''
    const ins = await sb.from('app_users').insert({ email, name, status:'pending', role:'ma' }).select('*').maybeSingle()
    if(ins.error){ console.error('가입 신청 오류', ins.error); return { status:'error' } }
    data = ins.data || { status:'pending' }
  }
  return data
}

// 핵심: 세션 확인 → 승인된 사용자만 onPass() 실행
async function gateAuth(onPass){
  const { data: { session } } = await sb.auth.getSession()
  if(!session){ _showGate('로그인이 필요합니다.'); return }
  const u = await _checkUser(session.user)
  const logout = '<br><a href="#" onclick="appLogout();return false" style="color:#888">로그아웃</a>'
  if(u.status === 'approved'){
    _hideGate()
    // 카카오 신원 → 대시보드 이름 자동 설정 (app_users.ma_name 우선, 없으면 카카오 닉네임)
    const nick = session.user.user_metadata?.name || session.user.user_metadata?.full_name || ''
    onPass({ name: u.ma_name || u.name || nick, role: u.role || 'ma', division: u.division || null })
  } else if(u.status === 'pending'){
    _showGate('가입 신청이 접수되었습니다.', '관리자 승인 후 이용할 수 있습니다. 승인되면 새로고침해 주세요.' + logout)
  } else if(u.status === 'rejected'){
    _showGate('접근이 거부된 계정입니다.', '관리자에게 문의하세요.' + logout)
  } else if(u.status === 'no-email'){
    _showGate('이메일 정보가 필요합니다.', '카카오 로그인 동의 항목에서 이메일을 허용해야 합니다.' + logout)
  } else {
    _showGate('확인 중 오류가 발생했습니다.', '잠시 후 다시 시도해 주세요.' + logout)
  }
}

// 카카오 신원으로 대시보드 사용자 자동 설정 (이름/권한)
function applyKakaoIdentity(id){
  if(!id) return
  const KNOWN_ROLES = ['ma','leader','division_head','support_lead','biz_manager','director','related_dept','admin']
  const role = KNOWN_ROLES.indexOf(id.role) >= 0 ? id.role : 'ma'
  const name = id.name || ''
  // 이름이 명단과 안 맞아도 role(리더/사업부장 등)은 반드시 유지
  CURRENT_USER = { name: name, role: role, team: maTeam(name) || 'west', division: id.division || null }
  REAL_USER = Object.assign({}, CURRENT_USER)
  if(name){
    window.MY_MA_NAME = name
    window.LAST_QUICK_MA = name
    try{ localStorage.setItem('my_ma_name', name) }catch(e){}
  }
  applyTabVisibility()
  if(typeof updateAuthBar === 'function') updateAuthBar()
  if(typeof reRenderActive === 'function') reRenderActive()
}

  if(!isRealAdmin()) return
  const t = teamById(teamId); if(!t) return
  const name = t.leader || (t.members && t.members[0]) || REAL_USER.name
  CURRENT_USER = { name: name, role: 'leader', team: teamId, division: null }
  window.MY_MA_NAME = name; window.LAST_QUICK_MA = name

function viewAs(role, name){
  if(!isRealAdmin()) return
  if(role === 'admin'){
    CURRENT_USER = Object.assign({}, REAL_USER)
  } else {
    const nm = name || REAL_USER.name
    CURRENT_USER = { name: nm, role: role, team: maTeam(nm) || 'west' }
    window.MY_MA_NAME = nm
    window.LAST_QUICK_MA = nm
  }
  applyTabVisibility()
  updateAuthBar()
  reRenderActive()
}

async function renderUserAdmin(){
  const body = document.getElementById('useradmin-body')
  if(!body) return
  const { data, error } = await sb.from('app_users')
    .select('*')
    .order('status', { ascending:true })
    .order('requested_at', { ascending:true })
  if(error){ body.innerHTML = '<span style="color:var(--td)">불러오기 실패: '+escHtml(error.message)+'</span>'; return }
  if(!data || !data.length){ body.innerHTML = '등록된 사용자가 없습니다.'; return }
  const stColor = function(s){ return s==='approved'?'var(--ts)':s==='rejected'?'var(--td)':'var(--tw)' }
  const stLabel = function(s){ return s==='approved'?'승인됨':s==='rejected'?'거부':'대기' }
  let h = '<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:12px">'
    + '<thead><tr style="text-align:left;color:var(--t2);border-bottom:1px solid var(--b2)">'
    + '<th style="padding:6px 4px">이메일</th><th style="padding:6px 4px">이름</th><th style="padding:6px 4px">휴대폰</th><th style="padding:6px 4px">권한</th><th style="padding:6px 4px">상태</th><th style="padding:6px 4px">처리</th></tr></thead><tbody>'
  data.forEach(function(u){
    const em = escHtml(u.email)
    const roleSel = '<select onchange="setUserRole(\''+em+'\',this.value)" style="font-size:12px;padding:4px;border:0.5px solid var(--b2);border-radius:6px;background:var(--bg1);color:var(--t1)">'
      + ROLE_OPTS.map(function(o){ return '<option value="'+o[0]+'"'+(u.role===o[0]?' selected':'')+'>'+o[1]+'</option>' }).join('')
      + '</select>'
    // 사업부장이면 담당 사업부 선택
    let divSel = ''
    if(u.role==='division_head' || u.role==='support_lead'){
      divSel = '<select onchange="setUserDivision(\''+em+'\',this.value)" style="font-size:11px;margin-top:4px;padding:3px;border:0.5px solid var(--b2);border-radius:6px;background:var(--bg1);color:var(--t1)">'
        + '<option value="">사업부 선택</option>'
        + (ORG.divisions||[]).map(function(d){ return '<option value="'+escHtml(d.name)+'"'+((u.division===d.name||u.division===d.id)?' selected':'')+'>'+escHtml(d.name)+'</option>' }).join('')
        + '</select>'
    }
    h += '<tr style="border-bottom:1px solid var(--b3)">'
      + '<td style="padding:6px 4px;color:var(--t1)">'+em+'</td>'
      + '<td style="padding:6px 4px"><input value="'+escHtml(u.ma_name||u.name||'')+'" placeholder="이름 입력" onblur="onUserMaNameBlur(\''+em+'\',this.value,this.defaultValue)" title="이름을 바꾸면 TM이력·조직·담당까지 함께 변경됩니다" style="width:100px;font-size:12px;padding:4px 6px;border:0.5px solid var(--b2);border-radius:6px;background:var(--bg1);color:var(--t1)"></td>'
      + '<td style="padding:6px 4px"><input value="'+escHtml(u.phone||'')+'" placeholder="010-0000-0000" onblur="setUserPhone(\''+em+'\',this.value)" inputmode="tel" style="width:120px;font-size:12px;padding:4px 6px;border:0.5px solid var(--b2);border-radius:6px;background:var(--bg1);color:var(--t1)"></td>'
      + '<td style="padding:6px 4px">'+roleSel+(divSel?'<div>'+divSel+'</div>':'')+'</td>'
      + '<td style="padding:6px 4px;font-weight:600;color:'+stColor(u.status)+'">'+stLabel(u.status)+'</td>'
      + '<td style="padding:6px 4px;white-space:nowrap">'
      + '<button class="btn s" style="font-size:11px;padding:3px 7px;color:var(--ts)" onclick="setUserStatus(\''+em+'\',\'approved\')">승인</button> '
      + '<button class="btn s" style="font-size:11px;padding:3px 7px;color:var(--tw)" onclick="setUserStatus(\''+em+'\',\'pending\')">대기</button> '
      + '<button class="btn s" style="font-size:11px;padding:3px 7px;color:var(--td)" onclick="setUserStatus(\''+em+'\',\'rejected\')">거부</button>'
      + '</td></tr>'
  })
  h += '</tbody></table></div>'
  body.innerHTML = h
}
async function setUserPhone(email, val){
  const phone = (val||'').replace(/[^0-9]/g,'')  // 숫자만 저장 (솔라피 형식)
  const { error } = await sb.from('app_users').update({ phone: phone || null }).eq('email', email)
  if(error){ alert('휴대폰 저장 실패: '+error.message+'\n(app_users.phone 컬럼이 필요합니다)'); return }
}
async function setUserStatus(email, status){
  const { error } = await sb.from('app_users').update({ status: status }).eq('email', email)
  if(error){ alert('상태 변경 실패: '+error.message); return }
  renderUserAdmin()
}

async function onUserMaNameBlur(email, newVal, oldVal){
  newVal=(newVal||'').trim(); oldVal=(oldVal||'').trim()
  if(newVal===oldVal) return
  // app_users 우선 갱신
  await setUserMaName(email, newVal)
  // 기존 이름이 있고 그 이름으로 된 이력/조직이 있으면 전체 확대 적용 제안
  if(oldVal && newVal){
    const hasData = CACHE.logs.some(l=>l.ma_name===oldVal) || (ALL_MA||[]).some(x=>x.m===oldVal) || CACHE.db.some(r=>r.assign1===oldVal||r.assign2===oldVal)

        if(typeof renderAll==='function') renderAll()
        alert('✓ "'+newVal+'"(으)로 전체 변경 완료')

    }
  }
}

// 구성원 이름을 시스템 전체에서 변경 (Supabase: tm_logs·ma_quotas·app_users·company_db + 로컬 조직/상태)
async function renameMaEverywhere(oldName, newName, opts){
  opts = opts || {}
  oldName = (oldName||'').trim(); newName = (newName||'').trim()
  if(!oldName || !newName || oldName===newName) return
  // 1) Supabase 갱신
  try{
    const jobs = [
      sb.from('tm_logs').update({ ma_name:newName }).eq('ma_name', oldName),
      sb.from('ma_quotas').update({ ma_name:newName }).eq('ma_name', oldName),
      sb.from('tm_logs').update({ feedback_by:newName }).eq('feedback_by', oldName)
    ]
    if(!opts.skipAppUsers) jobs.push(sb.from('app_users').update({ ma_name:newName }).eq('ma_name', oldName))
    await Promise.all(jobs)
    // 담당 DB(assign1/assign2)
    if(CACHE.db.some(r=>r.assign1===oldName)) await sb.from('company_db').update({ assign1:newName }).eq('assign1', oldName)
    if(CACHE.db.some(r=>r.assign2===oldName)) await sb.from('company_db').update({ assign2:newName }).eq('assign2', oldName)
  }catch(e){ alert('DB 갱신 중 오류: '+(e.message||e)); }
  // 2) 캐시 갱신
  CACHE.logs.forEach(function(l){ if(l.ma_name===oldName) l.ma_name=newName; if(l.feedback_by===oldName) l.feedback_by=newName })
  ;(CACHE.quotas||[]).forEach(function(q){ if(q.ma_name===oldName) q.ma_name=newName })
  CACHE.db.forEach(function(r){ if(r.assign1===oldName) r.assign1=newName; if(r.assign2===oldName) r.assign2=newName })
  // 3) 조직(ORG) 멤버·팀장
  let orgTouched=false
  ;(ORG.divisions||[]).forEach(function(d){ d.teams.forEach(function(t){
    const i=t.members.indexOf(oldName); if(i>=0){ t.members[i]=newName; orgTouched=true }
    if(t.leader===oldName){ t.leader=newName; orgTouched=true }
  })})
  // 4) 인력 상태 키
  if(MA_STATUS[oldName]){ MA_STATUS[newName]=MA_STATUS[oldName]; delete MA_STATUS[oldName]; saveMaStatus() }
  if(orgTouched){ saveOrg(); if(typeof refreshOrgDerived==='function') refreshOrgDerived() }
}

// ── ORG 파생 헬퍼 ──
function allTeams(){
  const teams=[]
  ORG.divisions.forEach(function(d){ d.teams.forEach(function(t){ teams.push({...t, divId:d.id, divName:d.name}) }) })
  return teams
}
function teamById(tid){ return allTeams().find(function(t){ return t.id===tid }) }
function teamMembers(tid){ const t=teamById(tid); return t?t.members:[] }
function teamName(tid){ const t=teamById(tid); return t?t.name:tid }
function teamColor(tid){ const t=teamById(tid); return t?(t.color||'#888'):'#888' }
function maTeam(ma){
  if(ma==null) return null
  const key = String(ma).trim()
  // 1) 팀 구성원으로 등록된 경우 (공백 차이 허용)
  let t = allTeams().find(function(t){ return t.members.some(function(m){ return String(m).trim()===key }) })
  if(t) return t.id
  // 2) 해당 이름이 어느 팀의 팀장으로 지정된 경우 (DB 리더 매칭)
  t = allTeams().find(function(t){ return t.leader && String(t.leader).trim()===key })
  return t ? t.id : null
}

// 관할사업부 텍스트 정규화 → '중부' | '남부' | 원문
function normDivision(txt){
  if(!txt) return null
  const s = txt.toString().trim()
  if(s.indexOf('중부')>=0) return '중부'
  if(s.indexOf('남부')>=0) return '남부'
  return s || null
}
// 거래처 행의 사업부 표시값 (없으면 소속 팀의 사업부명에서 유추)
function rowDivision(r){
  if(r && r.division) return r.division
  const t = r && r.region ? teamById(r.region) : null
  if(t && t.divName){
    if(t.divName.indexOf('중부')>=0) return '중부'
    if(t.divName.indexOf('남부')>=0) return '남부'
    return t.divName
  }
  return '—'
}

// 관할구역 텍스트 → 팀 ID 매칭 (업로드 시 사용)
// 우선순위: 정확한 팀명 → 팀명 일부 포함 → 동/서 키워드 → 기본 east
function matchRegionToTeam(regionText){
  if(!regionText) return allTeams()[0] ? allTeams()[0].id : 'east'
  const txt = regionText.toString().trim()
  const teams = allTeams()
  // 1) 팀명 완전 일치
  let hit = teams.find(function(t){ return t.name===txt })
  if(hit) return hit.id
  // 2) 팀명에서 '팀' 접미어 떼고 비교
  hit = teams.find(function(t){ return t.name.replace('팀','')===txt.replace('팀','') })
  if(hit) return hit.id
  // 3) 팀명 일부 포함 (양방향)
  hit = teams.find(function(t){
    const base=t.name.replace('팀','')
    return txt.includes(base) || base.includes(txt)
  })
  if(hit) return hit.id
  // 4) 동/서 키워드 폴백
  if(txt.includes('서')||txt.toLowerCase().includes('west')){
    const w=teams.find(function(t){return t.id==='west'}); if(w) return w.id
  }
  if(txt.includes('동')||txt.toLowerCase().includes('east')){
    const e=teams.find(function(t){return t.id==='east'}); if(e) return e.id
  }
  // 5) 못 찾으면 첫 팀
  return teams[0] ? teams[0].id : 'east'
}

function isWorkday(ds){
  if(ds <= CAMPAIGN_START) return false;
  if(isCustomOff(ds)) return false;

// ── 이월 TM 계산 ──────────────────────────────
// 해당 MA가 targetDate에 수행해야 할 TM처 목록
// = 오늘 배정된 거래처 + 과거 미수행 이월분
// MA의 이월 계산 시작 기준: 전사 캠페인 시작일과 소속 사업부 시작일 중 늦은 쪽
// (_workdaysBetween는 startExcl 다음날부터 세므로, 사업부 시작일 당일을 첫날로 넣으려면 그 전날을 반환)
function _maEffStartExcl(ma){
  let start = CAMPAIGN_START
  const tid = maTeam(ma)
  const t = tid ? teamById(tid) : null
  const div = t ? (ORG.divisions||[]).find(function(d){ return (d.teams||[]).some(function(x){ return x.id===t.id }) }) : null
  if(div && div.startDate){
    const p = div.startDate.split('-').map(Number)
    const dd = new Date(p[0], p[1]-1, p[2]); dd.setDate(dd.getDate()-1)  // 시작일 전날
    const divStartExcl = dd.getFullYear()+'-'+String(dd.getMonth()+1).padStart(2,'0')+'-'+String(dd.getDate()).padStart(2,'0')
    if(divStartExcl > start) start = divStartExcl
  }
  return start
}
function getAssignedForDate(ma, targetDate){
  // 이 MA의 1차 배정 거래처 전체 (TM대상)
  const allAssigned = CACHE.db.filter(r=>r.assign1===ma && r.is_target!==false)
  if(!allAssigned.length) return { today:[], carryover:[], total:[] }

  // 시작 기준(캠페인 시작일 + 사업부 시작일 반영) 다음날~targetDate까지의 근무일
  const workdays = _workdaysBetween(_maEffStartExcl(ma), targetDate)

  // 각 근무일에 배정됐어야 할 거래처 계산 (라운드로빈 순환)
  // 단, 이미 TM 기록이 있는 거래처는 '수행 완료'로 처리
  const performed = new Set(
    CACHE.logs
      .filter(l=>l.ma_name===ma)
      .map(l=>l.company)
  )

  // 오늘 해야 할 TM처: 미수행 이월분 + 오늘치 신규
  // 이월: targetDate 이전 근무일에 배정됐으나 미수행인 거래처
  const todayIdx = workdays.indexOf(targetDate)
  if(todayIdx < 0) return { today:[], carryover:[], total:[] }

  const carryover = []
  for(let i=0; i<todayIdx; i++){
    const wd = workdays[i]
    const assigned = _getDbForWorkday(allAssigned, i)
    if(assigned && !performed.has(assigned.name)){
      carryover.push({...assigned, _dueDate: wd})
    }
  }

  // 오늘치 신규 배정
  const todayDb = _getDbForWorkday(allAssigned, todayIdx)
  const today = todayDb ? [todayDb] : []

  // 중복 제거 (이월에 오늘치 같은 거래처가 있으면 한 번만)
  const carryoverNames = new Set(carryover.map(r=>r.name))
  const todayFinal = today.filter(r=>!carryoverNames.has(r.name))

  const total = carryover.concat(todayFinal)
  return { today: todayFinal, carryover, total }
}

// 근무일 배열에서 i번째 날에 해당하는 거래처 (라운드로빈)
function _getDbForWorkday(dbList, dayIndex){
  if(!dbList.length) return null
  // 가맹점 많은 순 정렬 유지
  const sorted = [...dbList].sort((a,b)=>b.branches-a.branches)
  return sorted[dayIndex % sorted.length]
}

// CAMPAIGN_START 다음날~endDate까지의 근무일 배열
function _workdaysBetween(startExcl, endIncl){
  const arr=[]
  const parts=startExcl.split('-').map(Number)
  const d=new Date(parts[0],parts[1]-1,parts[2])
  d.setDate(d.getDate()+1)  // startExcl 다음날부터
  const end=new Date(endIncl+'T00:00:00')
  while(d<=end){
    const ds=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')
    if(isWorkday(ds)) arr.push(ds)
    d.setDate(d.getDate()+1)
  }
  return arr
}
function hName(ds){
  if(HNAMES[ds]) return HNAMES[ds];
  if(isCustomOff(ds)){
    const dt=new Date(ds+'T00:00:00'),d=dt.getDay();
    if(d!==0 && d!==6) return '휴무일(지정)';
  }
  if(ds <= CAMPAIGN_START) {
    const dt=new Date(ds+'T00:00:00'),d=dt.getDay();
    if(d!==0 && d!==6) return '캠페인 일정아님';
  }
  return null;
}

async function loadConfigSnapshot(){
  try{
    const { data, error } = await sb.from('app_config').select('value').eq('key','app_snapshot').maybeSingle()
    if(error){ console.warn('[조직] app_snapshot 조회 오류:', error.message); return }
    if(!data || !data.value){ console.warn('[조직] app_snapshot 없음 → 기본 조직(동/서부) 사용. 관리자가 인력관리에서 저장하면 생성됩니다.'); return }
    const snap = data.value
    if(snap.org && snap.org.divisions && snap.org.divisions.length){
      ORG = snap.org
      try{ localStorage.setItem('org_structure_v1', JSON.stringify(ORG)) }catch(e){}
    } else {
      console.warn('[조직] app_snapshot에 org.divisions 없음 → 기본 조직 사용')
    }
    if(snap.maStatus && typeof snap.maStatus==='object'){ MA_STATUS = snap.maStatus; try{ localStorage.setItem('ma_status_v1', JSON.stringify(MA_STATUS)) }catch(e){} }
    if(Array.isArray(snap.customOff)){ CUSTOM_OFF_DAYS = snap.customOff }
    if(snap.campaignStart){ CAMPAIGN_START = snap.campaignStart }
    if(typeof refreshOrgDerived==='function') refreshOrgDerived()
    const _teamNames = (ORG.divisions||[]).flatMap(function(d){ return (d.teams||[]).map(function(t){ return t.name+'('+ (t.members||[]).length +'명)' }) })
    console.log('[조직] 스냅샷 로드 완료 · 팀:', _teamNames.join(', '))
    await loadPerms()   // 권한 오버라이드 로드
  }catch(e){ console.error('설정 스냅샷 로드 실패', e) }
}

async function loadAll(){
  setSyncBadge('loading','불러오는 중...')
  try{
    await loadConfigSnapshot()   // 모든 사용자가 관리자 조직을 공유하도록 먼저 로드
    // logs, quotas는 병렬 로드
    const [logsRes, quotasRes] = await Promise.all([
      sb.from('tm_logs').select('*').order('log_date',{ascending:false}),
      sb.from('ma_quotas').select('*')
    ])
    if(logsRes.error||quotasRes.error) throw new Error('조회 오류')

    // DB 로드: 타임아웃 10초 + pagination
    const PAGE=1000; let allDb=[]; let from=0
    setSyncBadge('loading','DB 로딩 중...')
    console.log('[DB] 로드 시작')
    let pageCount=0
    while(pageCount<30){  // 최대 30페이지(3만건) 안전 상한
      pageCount++
      let res
      try{
        const fetchPromise = sb.from('company_db').select('*')
          .order('branches',{ascending:false,nullsFirst:false})
          .range(from, from+PAGE-1)
        const timeoutPromise = new Promise(function(_,reject){
          setTimeout(function(){ reject(new Error('DB 로드 타임아웃 (10초)')) }, 10000)
        })
        res = await Promise.race([fetchPromise, timeoutPromise])
      }catch(fetchErr){
        console.error('[DB] 페이지 로드 실패:', fetchErr.message)
        // 이미 로드된 데이터가 있으면 그걸로 진행
        if(allDb.length>0) break
        throw fetchErr
      }
      if(res.error){ console.error('[DB] 오류:', res.error.message); break }
      if(!res.data||!res.data.length) break
      allDb=allDb.concat(res.data)
      setSyncBadge('loading','DB '+allDb.length+'건 로딩 중...')
      console.log('[DB] 로드:', allDb.length+'건')
      if(res.data.length<PAGE) break
      from+=PAGE
      if(allDb.length>=20000) break
    }
    console.log('[DB] 완료:', allDb.length+'건')

    CACHE.logs = logsRes.data || []
    CACHE.quotas = quotasRes.data || []
    CACHE.db = allDb
    // phase 자동 계산: 10개↑=1차, 5~9=2차, 4개↓=3차 (DB에 저장된 값 우선)
    CACHE.db.forEach(function(r){
      if(r.phase===1||r.phase===2||r.phase===3) return  // 저장된 값 유지
      const b = (r.branches!=null&&r.branches!==undefined) ? Number(r.branches) : 0
      r.phase = b>=10 ? 1 : b>=5 ? 2 : 3
      r.phase_approved = r.phase===1  // 1차는 기본 승인, 2·3차는 미승인
    })
    CACHE.loaded = true
    setSyncBadge('ok','✓ 연결됨')
    reRenderActive()
  }catch(e){
    setSyncBadge('err','⚠ 연결 실패 — Supabase Key를 확인하세요')
    console.error(e)
    reRenderActive()  // 실패해도 UI는 표시
  }
}

function logs4(ma,date){return CACHE.logs.filter(l=>l.ma_name===ma&&l.log_date===date)}
// 휴무일 경우 할당량을 0으로 반환
function mq(ma,date){
  // 명시적으로 저장된 할당량(휴무=0 포함) 우선
  const stored=CACHE.quotas.find(q=>q.ma_name===ma&&q.quota_date===date)
  if(stored) return stored.quota  // 0(휴무)도 그대로 반환
  // 기본 할당 1건 (이월 계산은 할당 TM처 버튼으로 별도 표시)
  return 1
}
// (teamMembers는 ORG 기반 정의 사용)
// tdAch: 해당 팀의 실제 TM 수행 건수 합산
function tdAch(team,date){
  return teamMembers(team).reduce(function(s,m){ return s+logs4(m,date).length }, 0)
}
// tdTot: 해당 팀의 오늘 할당량 합산 (휴무=0 제외)
function tdTot(team,date){
  return teamMembers(team).reduce(function(s,m){ const q=mq(m,date); return s+(q>0?q:0) }, 0)
}
// tdMA: 달성 MA / 전체 MA (명수, 기존 방식)
function tdMA(team,date){
  const members=teamMembers(team).filter(m=>mq(m,date)>0)
  const done=members.filter(m=>logs4(m,date).length>=mq(m,date))
  return {done:done.length, total:members.length}
}

// 권한 범위(토글 무시)의 사업부 — 팀 탭 생성용
function baseVisibleDivisions(){
  if(!ORG || !ORG.divisions) return []
  let divs
  if(seesAllDivisions()) divs = ORG.divisions
  else {
    const did = myDivisionId()
    const d = ORG.divisions.find(function(x){ return x.id===did })
    divs = d ? [d] : ORG.divisions
  }
  // 탭은 리더도 본인 팀만 (사업부장은 사업부 전체)
  const tset = tabTeamSet()
  if(!tset) return divs
  return divs.map(function(d){
    return Object.assign({}, d, { teams: (d.teams||[]).filter(function(t){ return tset.has(t.id) }) })
  }).filter(function(d){ return d.teams.length })
}

function rebuildTeamTabs(){
  const bar=document.getElementById('tab-bar'); if(!bar) return
  const card=bar.parentElement
  const prevActive=document.querySelector('.tb.active')?.dataset.tab
  bar.querySelectorAll('.tb-team').forEach(function(b){ b.remove() })
  card.querySelectorAll('.sec-team').forEach(function(s){ s.remove() })
  // 서브바 컨테이너 (탭바 바로 아래)
  let subbar=document.getElementById('team-subbar')
  if(!subbar){
    subbar=document.createElement('div')
    subbar.id='team-subbar'
    subbar.style.cssText='display:none;align-items:center;flex-wrap:wrap;gap:6px;padding:10px 2px 0;margin-top:8px;border-top:0.5px solid var(--b2)'
    bar.after(subbar)
  }
  const divs=baseVisibleDivisions()
  const teams=[]
  divs.forEach(function(d){ d.teams.forEach(function(t){ teams.push(t) }) })
  let prevSec=document.getElementById('tab-all')
  if(teams.length){
    const b=document.createElement('button')
    b.className='tb tb-team'; b.id='tbtn-teams'
    b.textContent='팀별'
    // data-tab은 현재 선택 팀 id (reRenderActive/_activateTab 연동용)
    b.dataset.tab = teams.some(function(t){ return t.id===window.TEAMS_TEAM }) ? window.TEAMS_TEAM : teams[0].id
    b.addEventListener('click', function(){ showTeamsHub() })
    document.getElementById('tbtn-all').after(b)
    teams.forEach(function(t){
      const sec=document.createElement('div')
      sec.id='tab-'+t.id; sec.className='sec sec-team'; sec.dataset.tab=t.id
      prevSec.after(sec); prevSec=sec
    })
    if(prevActive && teams.some(function(t){ return t.id===prevActive })){
      b.dataset.tab=prevActive; window.TEAMS_TEAM=prevActive
    }
  }
  // 활성 탭 복구 (사라졌으면 전체)
  if(prevActive && document.getElementById('tab-'+prevActive)) _activateTab(prevActive)
  else _activateTab('all')
}

function _teamsHubDefaults(){
  const divs = baseVisibleDivisions()

  let dv = divs.find(function(d){ return d.id===window.TEAMS_DIV })

    dv = divs.find(function(d){ return (d.teams||[]).some(function(t){ return t.id===mine }) }) || divs[0]
    tm = (dv.teams||[]).find(function(t){ return t.id===mine }) || (dv.teams||[])[0]
  }
  window.TEAMS_DIV = dv ? dv.id : null
  window.TEAMS_TEAM = tm ? tm.id : null
}

  const dvOfActive = divs.find(function(d){ return (d.teams||[]).some(function(t){ return t.id===activeTeam }) })
  if(dvOfActive) window.TEAMS_DIV = dvOfActive.id
  const curDivId = window.TEAMS_DIV || divs[0].id
  let h = ''
  if(divs.length > 1){
    h += '<span style="display:inline-flex;border:0.5px solid var(--b2);border-radius:var(--r1);overflow:hidden;margin-right:6px">'
    divs.forEach(function(d){
      const on = d.id===curDivId
      h += '<button onclick="selectTeamDiv(\''+d.id+'\')" style="border:0;border-radius:0;padding:5px 14px;font-size:12px;cursor:pointer;font-family:var(--font);background:'+(on?'var(--ti)':'transparent')+';color:'+(on?'#fff':'var(--t2)')+'">'+escHtml((d.name||'').replace('사업부',''))+'</button>'
    })
    h += '</span>'
  }
  const dv = divs.find(function(d){ return d.id===curDivId }) || divs[0]
  ;(dv.teams||[]).forEach(function(t){
    const on = t.id===activeTeam
    h += '<button onclick="selectTeamChip(\''+t.id+'\')" style="font-size:12px;padding:4px 14px;border-radius:99px;cursor:pointer;font-family:var(--font);border:0.5px solid '+(on?'var(--ti)':'var(--b2)')+';background:'+(on?'var(--bgi)':'transparent')+';color:'+(on?'var(--ti)':'var(--t2)')+';font-weight:'+(on?'600':'400')+'">'
       + escHtml(t.name)+' <span style="font-size:11px;opacity:.75">'+(t.members||[]).length+'</span></button>'
  })
  bar.innerHTML = h
  bar.style.display = 'flex'
}

// ── 달력 HTML ──
function calHtml(team,selDate){
  if(!CAL_MONTH||!CAL_MONTH[team]){if(!CAL_MONTH)CAL_MONTH={all:mo(td()),east:mo(td()),west:mo(td())};else CAL_MONTH[team]=mo(td());}
  const ym=CAL_MONTH[team],[yr,mo2]=ym.split('-').map(Number)
  const dim=new Date(yr,mo2,0).getDate(),today=td()
  // 1일의 요일 (0=일 ~ 6=토) → 월 기준 offset (월=0)
  const firstDow=new Date(yr,mo2-1,1).getDay() // 0=일,1=월,...,6=토
  const offsetMon=firstDow    // 일요일 기준 앞 빈칸 수 (일=0,월=1,...,토=6)
  const workdayCount=[...Array(dim)].filter((_,i)=>{
    const ds=`${yr}-${String(mo2).padStart(2,'0')}-${String(i+1).padStart(2,'0')}`
    return isWorkday(ds)
  }).length
  let h=`<div class="cs"><div class="ch">
    <button class="db" onclick="chgCalMo('${team}',-1)">&#8249;</button>
    <span class="ct">${fmtM(ym)} <span style="font-size:11px;color:var(--t2);font-weight:400">평일 ${workdayCount}일</span></span>
    <button class="db" onclick="chgCalMo('${team}',1)">&#8250;</button>
  </div><div class="cg7">`
  // 요일 헤더 일~토 (일요일 시작)
  ;['일','월','화','수','목','금','토'].forEach(d=>{
    const isSun=d==='일',isSat=d==='토'
    h+=`<div class="cdw" style="${isSun?'color:#A32D2D':isSat?'color:#185FA5':''}">${d}</div>`
  })
  // 1일 전 빈칸
  for(let i=0;i<offsetMon;i++) h+=`<div class="cl empty"></div>`
  // 모든 날짜 순회
  for(let d=1;d<=dim;d++){
    const ds=`${yr}-${String(mo2).padStart(2,'0')}-${String(d).padStart(2,'0')}`
    const dt=new Date(ds+'T00:00:00'),dow=dt.getDay() // 0=일,6=토
    const isOff=!isWorkday(ds)
    const hn=hName(ds)
    const isSun=dow===0,isSat=dow===6
    if(isOff){
      // 공석 셀 — 날짜만 흐리게, 내용 없음
      let offStyle='background:var(--bg2);border-color:transparent;cursor:default;'
      let dayColor=isSun?'color:#f09595':isSat?'color:#85b7eb':(hn==='캠페인 일정아님'?'color:var(--t2)':'color:#f09595')
      h+=`<div class="cl" style="${offStyle}">
        <div class="cd" style="opacity:.5;${dayColor}">${d}</div>
        ${hn?`<div class="hl-lbl" style="opacity:.7;${hn==='캠페인 일정아님'?'color:var(--t2)':''}">${hn}</div>`:''}
      </div>`
    } else {
      // 평일 셀
      const isToday=ds===today,isSel=ds===selDate
      // 권한/선택 범위의 사업부별 팀 (시작된 사업부만) — 일자별 달성/할당
      let _calRows=''
      visibleDivisions().forEach(function(dv){
        if(!divStarted(dv,ds)) return
        dv.teams.forEach(function(t){
          const a=tdAch(t.id,ds), tot=tdTot(t.id,ds), rr=tot>0?a/tot:0
          const dot=tot===0?(a>0?'#1D9E75':'rgba(0,0,0,.18)'):(a>=tot?'#1D9E75':rr>=.5?'#5DCAA5':'#BA7517')
          const vc=tot===0?(a>0?'#1D9E75':'var(--t2)'):(a>=tot?'#1D9E75':a>0?'#BA7517':'var(--t2)')
          _calRows+=`<div class="ctrow"><div class="ctd" style="background:${dot}"></div><span class="ctl">${escHtml(t.name.replace(/팀$/,''))}</span><span class="ctv" style="color:${vc}">${a}<span style="font-size:9px;opacity:.6">/${tot}</span></span></div>`
        })
      })
      h+=`<div class="cl${isToday?' today':''}${isSel?' sel':''}" onclick="selDate('${ds}','${team}')">
        <div class="cd">${d}</div>${hn?`<div class="hl-lbl">${hn}</div>`:''}
        <div class="ctr">${_calRows}</div></div>`
    }
  }
  h+=`</div><div class="cl-leg"><span><div class="ds" style="background:#1D9E75"></div>전원</span><span><div class="ds" style="background:#5DCAA5"></div>과반</span><span><div class="ds" style="background:#BA7517"></div>일부</span><span><div class="ds" style="background:rgba(0,0,0,.18)"></div>미시작</span><span style="color:var(--t2)">▪ 흐린 셀: 주말/공휴일</span></div></div>`
  return h
}

async function saveQuickLog(){
  const ma = document.getElementById('q-ma').value
  const co = document.getElementById('q-co').value.trim()
  const cp = document.getElementById('q-cp').value.trim()
  const fr = document.getElementById('q-fr').value.trim()
  const ct = document.getElementById('q-ct').value.trim()
  const rs = document.getElementById('q-rs').value
  const cd = document.getElementById('q-cd').value.trim()
  const cr = document.getElementById('q-cr').value
  const ac = document.getElementById('q-ac').value.trim()

  if(!ma || !co || !ct || !rs || !cd || !cr){
    alert('필수 항목(* 표시)을 모두 입력 및 선택해주세요.')
    return
  }
  // 고객사명 DB 검증: 없으면 MA가 신규 등록 가능
  let dbMatch = CACHE.db.find(r=>r.name===co)
  if(!dbMatch){
    const added = await promptAddNewCompany(co, ma)
    if(!added) return   // 사용자가 취소
    dbMatch = added
  } else if(dbMatch.is_target===false){
    alert('"'+co+'"은(는) TM 제외(N) 처리된 거래처입니다.\n관리자에게 문의해주세요.')
    return
  }

  const tmSeq = await getTmSeqForCompany(co)
  const rec = {
    log_date: CUR_DATE,
    ma_name: ma,
    team: maTeam(ma) || null,
    division: maDivisionName(ma),
    company: co,
    current_partner: cp,
    fee_rate: fr,
    ceo_contact: ct,
    call_result: rs,
    consult_detail: cd,
    consult_result: cr,
    action_plan: ac,
    recontract_at: document.getElementById('q-recontract')?.value || null,
    tm_seq: tmSeq
  }

  const { data, error } = await insertTmLog(rec)
  if(error){ alert('저장 실패: ' + error.message); return }

  CACHE.logs.unshift(data)
  // has_tm_history 업데이트 (백그라운드)
  sb.from('company_db').update({has_tm_history:true}).eq('name',co).then(function(){})
  const _dbRow = CACHE.db.find(function(r){return r.name===co})
  if(_dbRow) _dbRow.has_tm_history = true

  // 작성 편의를 위해 MA(이름) 항목은 남겨두고 나머지만 초기화
  ;['q-co','q-cp','q-fr','q-ct','q-ac','q-cd'].forEach(id => document.getElementById(id).value = '')
  document.getElementById('q-rs').value = ''
  document.getElementById('q-cr').value = ''
  const _qrc=document.getElementById('q-recontract'); if(_qrc) _qrc.value=''

  // 선택한 MA 기억 (renderAll 후 복원용)
  window.LAST_QUICK_MA = ma
  reRenderActive()
}

// ── 전체 탭 ──
function renderAll(){
  const date=CUR_DATE
  // 집계 대상: 권한/토글 범위 중 'TM 시작된' 사업부의 구성원만
  const _startedDivs = visibleDivisions().filter(function(d){ return divStarted(d,date) })
  const _scopeMembers = []
  _startedDivs.forEach(function(d){ d.teams.forEach(function(t){ t.members.forEach(function(m){ _scopeMembers.push(m) }) }) })
  const _scopeSet = new Set(_scopeMembers)
  let tQ=0,dTM=0,fD=0,totMA=0
  _scopeMembers.forEach((m)=>{
    const q=mq(m,date)
    if(q===0) return // 휴무자 제외
    totMA++
    const c=logs4(m,date).length
    tQ+=q; dTM+=c; if(c>=q) fD++  // dTM: 실제 수행 건수(초과 포함)
  })
  // ── 이번달 집계 ──
  const ym=mo(date)
  const monthDays=workdaysOfMonth(ym)
  const passedDays=monthDays.filter(function(d){return d<=date})
  const monthLogs=CACHE.logs.filter(function(l){return l.log_date&&l.log_date.slice(0,7)===ym&&_scopeSet.has(l.ma_name)})
  const mTM=monthLogs.length
  const mMaSet=new Set(monthLogs.map(function(l){return l.ma_name}))
  const mMA=mMaSet.size
  // 월 타겟: 날짜별·MA별 실제 할당량(mq) 합산 (범위 내 시작된 사업부 구성원)
  let mTarget=0, mFullTarget=0
  passedDays.forEach(function(d){
    _scopeMembers.forEach(function(m){
      if(isActiveMa(m)) mTarget += mq(m, d)
    })
  })
  monthDays.forEach(function(d){
    _scopeMembers.forEach(function(m){
      if(isActiveMa(m)) mFullTarget += mq(m, d)
    })
  })
  const activeMA=_scopeMembers.filter(function(m){return isActiveMa(m)}).length
  const mRate=mTarget>0?Math.round(mTM/mTarget*100):0
  const mMonthLabel=parseInt(ym.split('-')[1])
  const mRateCol=mRate>=100?'#1D9E75':mRate>=70?'#BA7517':'var(--t1)'
  // ── 오늘 달성률 ──
  const todayRate=tQ>0?Math.round(dTM/tQ*100):0
  const dRateCol=todayRate>=100?'#1D9E75':todayRate>=70?'#BA7517':'var(--t1)'
  const isH=!isWorkday(date)
  // ── 내 이름 선택 바 (MA 빠른 진입) ──
  const myName = window.MY_MA_NAME || ''
  const canPick = isLeader()  // 리더/관리자만 타인 선택 가능, 일반 구성원은 본인 고정
  let chips
  if(canPick){
    chips = chipMembers().map(function(x){
        const on = x.m===myName ? ' on' : ''
        return '<button class="myma-chip'+on+'" onclick="selectMyMa(\''+x.m+'\')">'+x.m+'</button>'
      }).join('')
  } else {
    const me = CURRENT_USER?.name || myName || ''
    chips = '<button class="myma-chip on" style="cursor:default" title="본인으로 고정됨">'+escHtml(me)+'</button>'
  }
  // 전 직급: 전체/사업부 선택 토글
  let divToggle = ''
  if(ORG.divisions.length>1){
    divToggle = '<div style="display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap;align-items:center">'
      + '<span style="font-size:11px;color:var(--t2);margin-right:2px">사업부 보기:</span>'
      + '<button class="btn s'+(DASH_DIV==='all'?' p':'')+'" onclick="setDashDiv(\'all\')">전체</button>'
      + ORG.divisions.map(function(d){ return '<button class="btn s'+(DASH_DIV===d.id?' p':'')+'" onclick="setDashDiv(\''+d.id+'\')">'+escHtml(d.name)+'</button>' }).join('')
      + '</div>'
  }
  let h = divToggle + '<div class="myma-bar">'
    + '<span class="myma-label">👤 내 이름:</span>'
    + '<div class="myma-chips">'
    + chips
    + '</div>'
    + ((canPick && myName) ? '<button class="myma-clear" onclick="clearMyMa()">선택 해제</button>' : '')
    + '</div>'
  h+=`<div class="dn"><button class="db" onclick="chgDate(-1,'all')">&#8249;</button><span class="dl">${fmtD(date)}${isH?` <span style="font-size:11px;color:${hName(date)==='캠페인 일정아님'?'var(--t2)':'var(--td)'}">${hName(date)||'주말/공휴일'}</span>`:''}</span><button class="db" onclick="chgDate(1,'all')">&#8250;</button></div>
  ${isH?`<div class="hbanner">휴무일(주말/공휴일/캠페인외)입니다. TM 기록은 가능하나 달성률 집계에서 제외됩니다.</div>`:''}
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:1rem">
    <div style="background:var(--bg2);border-radius:var(--r2);padding:14px 16px">
      <div style="font-size:11px;font-weight:600;color:var(--tw);letter-spacing:.5px;margin-bottom:10px">📌 오늘 (${date.slice(5).replace('-','/')})</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
        <div><div style="font-size:10px;color:var(--t2);margin-bottom:2px">달성 TM <span style="color:var(--t3)">/ 할당 ${tQ}건</span></div>
          <div style="font-size:20px;font-weight:700;color:var(--t1)">${dTM}<span style="font-size:12px;font-weight:400;color:var(--t2)">건</span>
          <span style="font-size:14px;font-weight:700;color:${dRateCol};margin-left:6px">${todayRate}%</span></div></div>
        <div><div style="font-size:10px;color:var(--t2);margin-bottom:2px">달성 MA</div>
          <div style="font-size:20px;font-weight:700;color:var(--t1)">${fD}<span style="font-size:12px;font-weight:400;color:var(--t2)">/${totMA}명</span>
          <span style="font-size:14px;font-weight:700;color:${(totMA>0&&Math.round(fD/totMA*100)>=100)?'#1D9E75':(totMA>0&&Math.round(fD/totMA*100)>=70)?'#BA7517':'var(--t1)'};margin-left:6px">${totMA>0?Math.round(fD/totMA*100):0}%</span></div></div>
      </div>
      <div style="margin-top:10px;height:5px;background:var(--b3);border-radius:99px">
        <div style="height:100%;width:${Math.min(todayRate,100)}%;background:${dRateCol};border-radius:99px;transition:width .4s"></div>
      </div>

        <div><div style="font-size:10px;color:var(--t2);margin-bottom:2px">달성 MA</div>
          <div style="font-size:20px;font-weight:700;color:var(--t1)">${mMA}<span style="font-size:12px;font-weight:400;color:var(--t2)">명</span></div></div>

          <div style="font-size:16px;font-weight:700;color:var(--t1)">${mTM}<span style="font-size:11px;font-weight:400;color:var(--t2)">/${mTarget}건</span></div>
          <div style="font-size:9px;color:var(--t3);margin-top:1px">월 전체 목표 ${mFullTarget}건</div></div>
      </div>
      <div style="margin-top:10px;height:5px;background:var(--b3);border-radius:99px">
        <div style="height:100%;width:${Math.min(mRate,100)}%;background:${mRateCol};border-radius:99px;transition:width .4s"></div>
      </div>
    </div>
  </div>`
  h+=calHtml('all',date)
  // ── 사업부 단위 팀 현황 (로그인 권한 범위에 따라 표시) ──
  visibleDivisions().forEach(function(div){
   if(!div.teams||!div.teams.length) return
   h+=`<div style="font-weight:700;font-size:13px;color:var(--t1);margin:10px 0 8px;display:flex;align-items:center;gap:6px"><i class="ti ti-building" style="font-size:15px;color:var(--ti)"></i>${escHtml(div.name)}${div.startDate?` <span style="font-size:11px;color:var(--t2);font-weight:400">· 시작일 ${div.startDate}</span>`:''}</div>`
   if(!divStarted(div,date)){
     h+=`<div style="background:var(--bg2);border-radius:var(--r2);padding:16px;margin-bottom:1rem;text-align:center;color:var(--t2);font-size:13px">⏳ 아직 TM을 시작하지 않은 사업부입니다. (시작일: ${div.startDate})</div>`
     return
   }
   h+=`<div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-bottom:1rem">`
   div.teams.forEach(function(t){
    const team=t.id
    const tms=teamMembers(team);let tQ2=0,tD=0,tF=0,tTot=0
    tms.forEach(m=>{
      const q=mq(m,date); if(q===0) return; // 휴무 제외
      tTot++; const c=logs4(m,date).length;
      tQ2+=q; tD+=Math.min(c,q); if(c>=q) tF++
    })
    h+=`<div class="pn" style="margin-bottom:0"><div class="pnt"><i class="ti ti-users" style="font-size:15px"></i>${escHtml(teamName(team))}</div><div style="font-size:12px;color:var(--t2);margin-bottom:8px">대상 ${tTot}명 · 달성 ${tD}건 · ${tQ2>0?Math.round(tD/tQ2*100):0}%</div>`
    tms.forEach(m=>{
      const q=mq(m,date),c=logs4(m,date).length
      const isV = q===0
      const isOver  = !isV && c > q    // 초과 달성
      const isAch   = !isV && c >= q   // 달성
      const isBoost = !isV && q > 1 && c >= q  // 자발적 할당 증액 후 달성 ★
      const pctBase = isV ? 0 : Math.min(c/q, 1)
      const pctOver  = isOver ? Math.min((c-q)/q, 0.5) : 0
      // 색상: 자발증액달성=골드, 일반달성=초록, 진행중=주황, 미시작=회색
      const bc = isV ? 'var(--b3)' : isBoost ? '#F59E0B' : isAch ? '#1D9E75' : c>0 ? '#BA7517' : 'var(--b3)'
      const ms2 = isMe(m)?';font-weight:600;color:var(--ti)':''
      // 배지: 자발증액달성=⭐, 일반초과=🔥
      const overBadge = isBoost
        ? `<span title="${q}건 달성! (증액 목표 달성)" style="font-size:12px;margin-left:2px">⭐</span>`
        : isOver
          ? `<span title="${c-q}건 초과 달성" style="font-size:12px;margin-left:2px">🔥</span>`
          : ''
      const cntLabel = isV ? '휴무'
        : isBoost ? `<b style="color:#F59E0B;font-size:12px">${c}</b>`
        : isOver  ? `<b style="color:#1D9E75">${c}</b>`
        : c > 0   ? `<b style="color:#1D9E75">${c}</b>`
        : `${c}`
      // 막대 구조: [기본 달성바 + 초과 돌출바 + 목표 표시선]
      // 초과분: 막대 전체 너비를 최대 100%로 제한, 대신 색상·광택으로 표현
      // 기본달성 구간 + 초과 구간을 하나의 막대 안에 두 색상으로 나눔
      const baseW  = Math.round(pctBase * 100)
      const overW  = isOver ? Math.min(Math.round(pctOver * 100), 100 - baseW) : 0
      const barHtml = `<div style="flex:1;height:8px;background:var(--bg2);border-radius:99px;overflow:hidden;position:relative">
        <div style="position:absolute;left:0;top:0;height:100%;width:${baseW}%;background:${bc};border-radius:99px 0 0 99px;transition:width .4s"></div>
        ${isOver?`<div style="position:absolute;left:${baseW}%;top:0;height:100%;width:${overW+2}%;background:linear-gradient(90deg,#22c55e,#86efac);border-radius:0 99px 99px 0;transition:all .4s"></div>`:''}
      </div>`
      h+=`<div style="display:flex;align-items:center;gap:8px;padding:4px 0;${isV?'opacity:0.4':''}">
        <span style="font-size:12px;width:54px;flex-shrink:0${ms2}">${m}${overBadge}${isMe(m)?' ◀':''}</span>
        ${barHtml}
        <span style="font-size:11px;color:var(--t2);width:40px;text-align:right;white-space:nowrap">${cntLabel}</span>
      </div>`
    })
    h+=`</div>`
   })
   h+=`</div>`
  })
  h+= quickTmFormHtml()
  h+=`<div id="all-ma-logs" style="margin-top:1rem"></div>`
  
  document.getElementById('tab-all').innerHTML=h
  // 부제목: 권한 범위의 사업부·팀 인원 표시
  const _sub=document.getElementById('ps-sub')
  if(_sub){ _sub.textContent = visibleDivisions().map(function(d){ return d.name+' ('+d.teams.map(function(t){return t.name+' '+t.members.length}).join('·')+')' }).join('   ·   ') || '조직 정보 없음' }
  // 내 이름 또는 저장 직후 MA를 빠른입력 담당자에 자동 반영
  const autoMa = window.LAST_QUICK_MA || window.MY_MA_NAME
  if(autoMa){
    const qsel=document.getElementById('q-ma')
    if(qsel) qsel.value=autoMa
  }
  renderAllMaLogs()
}

      const histCnt = CACHE.logs.filter(function(l){ return l.company===r.name }).length

         + (done?';text-decoration:line-through;opacity:.6':'')+'">'

  }

    const overCnt = fuList.filter(function(x){ return x.st.state==='over' }).length

    h += '<div class="pnt"><i class="ti ti-alarm" style="font-size:15px"></i>팔로우업 필요 ('+fuList.length+'건'+(overCnt?' · 지연 '+overCnt:'')+')'
       + '<span style="font-size:11px;color:var(--t2);font-weight:400;margin-left:6px">보류·추가상담 건은 기록일 +'+FU_DAYS+'일 내 재통화가 필요합니다</span></div>'
    h += '<div style="display:flex;flex-wrap:wrap;gap:6px">'
    fuList.forEach(function(x){
      const over = x.st.state==='over'
      const col = over ? 'var(--bgd)' : 'var(--bgi)', tcol = over ? 'var(--td)' : 'var(--ti)'
      const lbl = over ? '지연 +'+x.st.overDays+'일' : 'D-'+x.st.dLeft
      h += '<button onclick="setCompanyInForm(\''+String(x.r.company||'').replace(/'/g,"\\'")+'\')"'
         + ' title="기록일 '+x.r.log_date+' ('+(x.r.consult_result||'')+') · 기한 '+x.st.due+' · 클릭하면 고객사명이 입력됩니다"'
         + ' style="font-size:12px;padding:5px 12px;border-radius:99px;border:0.5px solid '+tcol+';background:'+col+';color:'+tcol+';cursor:pointer;font-family:var(--font)">'
         + escHtml(x.r.company||'—')+' <strong>'+lbl+'</strong></button>'
    })
    h += '</div></div>'
  }

  // ── 오늘 기록된 TM 내역 ──
  h += '<div class="pn" style="margin-bottom:0"><div class="pnt"><i class="ti ti-notes" style="font-size:15px"></i>오늘 TM 기록 ('+todayLogs.length+'건)</div>'
  if(!todayLogs.length){
    h += '<div style="font-size:12px;color:var(--t2);text-align:center;padding:1rem">아직 기록된 TM이 없습니다.</div>'

    todayLogs.forEach(function(l){
      const crCls=l.consult_result==='종결'?'종결':'추가상담'
      const callPill=l.call_result?'<span class="pill '+l.call_result+'">'+l.call_result+'</span>':''
      const crPill=l.consult_result?'<span class="pill '+crCls+'" title="클릭하면 상담결과를 변경합니다" style="cursor:pointer" onclick="quickChangeResult(&apos;'+l.id+'&apos;,event)">'+(l.consult_result==='추가상담'?'추가상담':l.consult_result)+'</span>':'<span class="pill 추가상담" title="클릭하면 상담결과를 지정합니다" style="cursor:pointer;opacity:.55" onclick="quickChangeResult(&apos;'+l.id+'&apos;,event)">결과지정</span>'
      const detail=l.consult_detail?'<div class="lcons">'+l.consult_detail+'</div>':''
      const ap=l.action_plan?'<div class="lap">→ '+l.action_plan+'</div>':''
      h+='<div class="lc '+crCls+'"><div class="lh"><span class="lco">'+(l.company||'—')+'</span>'
        +'<div class="lb">'+callPill+' '+crPill
        +'<button onclick="openEditLog(&apos;'+l.id+'&apos;)" style="font-size:11px;padding:2px 9px;border-radius:99px;border:0.5px solid var(--b2);background:transparent;color:var(--t2);cursor:pointer;font-family:var(--font);font-weight:500">수정</button>'
        +'<button onclick="delLogAll(&apos;'+l.id+'&apos;)" style="font-size:11px;padding:2px 9px;border-radius:99px;border:1px solid var(--td);background:transparent;color:var(--td);cursor:pointer;font-family:var(--font);font-weight:500">기록 삭제</button></div></div>'
        +'<div class="lmg"><div class="lmi">거래업체 <strong>'+(l.current_partner||'—')+'</strong></div>'
        +'<div class="lmi">수수료율 <strong>'+(l.fee_rate||'—')+'</strong></div>'
        +'<div class="lmi">연락처 <strong>'+(maskPhone(l.ceo_contact)||'—')+'</strong></div></div>'
        +detail+ap+'</div>'
    })
  }
  h += '</div>'
  box.innerHTML = h
}

// 고객사명을 빠른입력폼에 자동 세팅

// 고객사명 입력/선택 시 가맹점수 자동 표시
function syncBranchInfo(inputId, badgeId){
  const val = document.getElementById(inputId)?.value.trim()
  const badge = document.getElementById(badgeId)
  if(!badge) return
  if(!val){ badge.style.display='none'; return }
  const db = CACHE.db.find(r=>r.name===val)
  if(db){
    const phNum = calcPhase(db.branches||0)
    const phase = phNum===1?'1차':phNum===2?'2차':'3차'
    badge.textContent = isLeader() ? ('🏢 '+db.branches+'개점 · '+phase) : ('🏢 '+phase+' 대상')
    // 기존 TM 이력 알림 표시
    const prevLogs = CACHE.logs.filter(function(l){ return l.company===val })
    const histBadge = badge.parentElement?.querySelector('.tm-hist-badge')
    if(histBadge) histBadge.remove()
    if(prevLogs.length>0){
      const lastLog = prevLogs[0]  // 가장 최근
      const histEl = document.createElement('div')
      histEl.className='tm-hist-badge'
      histEl.style.cssText='font-size:11px;padding:6px 10px;border-radius:var(--r1);background:#FEF3C7;color:#92400E;margin-top:5px;cursor:pointer'
      histEl.innerHTML='📋 기존 TM '+prevLogs.length+'건 있음 · 최근: '+lastLog.log_date+' ('+lastLog.call_result+') — <u>이력 보기</u>'
      histEl.onclick=function(){ showTmHistory(val) }
      badge.parentElement.appendChild(histEl)
    }
    badge.style.display='inline-block'
    badge.style.background = db.phase===2 ? 'var(--bgw)' : 'var(--bgi)'
    badge.style.color = db.phase===2 ? 'var(--tw)' : 'var(--ti)'
  } else {
    badge.style.display='none'
  }
}

// setCompanyInForm 개선: 고객사명 세팅 후 가맹점수도 바로 반영
function setCompanyInForm(name){
  const co = document.getElementById('q-co')
  if(co){
    co.value = name
    co.focus()
    syncBranchInfo('q-co','q-branches-badge')
  }
}
